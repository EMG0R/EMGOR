<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover so the black field runs under the notch/home bar on
     iPhone; the safe-area insets below keep the button out from under them. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>this is how i see you</title>
<style>
  * { -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }

  /* dvh, not vh: on iOS Safari vh is the *largest* viewport height, so the
     collapsing URL bar would otherwise push the button off the bottom. */
  .stage {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }

  video {
    /* Horizontal video, fit whole inside the viewport: letterboxed with the
       phone upright, edge-to-edge once it's turned sideways.
       The width is computed from the 16:9 ratio rather than left to `auto`,
       so the frame is already the right size on first paint — `auto` would
       collapse to the 300x150 default until metadata arrived and the whole
       layout would jump once the video loaded. */
    aspect-ratio: 16 / 9;
    width: min(100vw, calc(100dvh * 16 / 9));
    height: auto;
    max-width: 100vw;
    max-height: 100dvh;
    display: block;
    background: #000;
  }

  .get {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 30px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    background: rgba(255, 255, 255, 0.07);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.02em;
    text-decoration: none;
    transition: background 0.18s ease, transform 0.18s ease;
  }
  .get:active { background: rgba(255, 255, 255, 0.16); transform: scale(0.97); }
  .get svg { width: 17px; height: 17px; }
  .get .size {
    font-size: 13px;
    opacity: 0.5;
    letter-spacing: 0.04em;
  }

  /* Turned sideways the video owns the whole screen, so the button stops
     taking up layout room and floats over the frame instead. It sits at the
     top, not the bottom: the video's own control bar runs the full width of
     the bottom edge, and a pill down there would land right on top of it. */
  @media (orientation: landscape) {
    .stage { gap: 0; }
    .get {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      padding: 11px 22px;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.5);
      border-color: rgba(255, 255, 255, 0.22);
    }
    .get:active { transform: translateX(-50%) scale(0.97); }
  }
</style>
</head>
<body>
<div class="stage">
  <video
    src="media/howISeeYou1.mp4"
    playsinline
    webkit-playsinline
    controls
    preload="metadata"
  ></video>

  <a class="get" href="media/howISeeYou1.mp4" download="this is how i see you.mp4">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
    Download
    <span class="size">86 MB</span>
  </a>
</div>
</body>
</html>
