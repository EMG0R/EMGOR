<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0512">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>GORCAVE SERVER</title>
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        :root {
            /* near-black purple base, layered upward for gentle depth */
            --bg:          #0a0512;
            --bg-glow:     #150b26;
            --surface:     rgba(168, 146, 214, 0.05);
            --surface-2:   rgba(168, 146, 214, 0.09);
            --line:        rgba(178, 158, 222, 0.12);
            --line-strong: rgba(178, 158, 222, 0.30);
            --text:        rgba(236, 231, 247, 0.90);
            --text-dim:    rgba(214, 205, 235, 0.55);
            --text-faint:  rgba(198, 188, 226, 0.28);
            --lavender:    rgba(178, 163, 214, 0.78);  /* calm notice tone, never red */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            height: 100%;
            background: var(--bg);
        }

        body {
            /* Pinned shell: prevents whole-page rubber-band scrolling on iOS
               while #history keeps its own momentum scroll. JS resizes this
               shell to window.visualViewport when the keyboard opens. */
            position: fixed;
            top: 0; left: 0; right: 0;
            width: 100%;
            height: 100vh;   /* fallback for old iOS */
            height: 100dvh;  /* dynamic viewport baseline */
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
            background:
                radial-gradient(120% 70% at 50% 0%, var(--bg-glow) 0%, var(--bg) 62%),
                var(--bg);
            font-family: 'Courier New', Courier, monospace;
            color: var(--text);
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            /* short, non-janky settle when the keyboard opens/closes */
            transition: height 0.14s ease-out, transform 0.14s ease-out;
        }

        .home-button {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            left: max(14px, env(safe-area-inset-left));
            z-index: 100;
            font-size: 2rem;
            line-height: 1;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            color: var(--text-dim);
            text-decoration: none;
            transition: color 0.2s;
        }
        .home-button:hover, .home-button:active { color: var(--text); }

        header {
            padding: max(16px, env(safe-area-inset-top)) 16px 12px 64px;
            text-align: center;
            border-bottom: 1px solid var(--line);
            background: var(--surface);
            flex: 0 0 auto;
        }
        header h1 {
            font-size: 0.95rem;
            letter-spacing: 3px;
            font-weight: normal;
            color: rgba(232, 226, 246, 0.82);
        }
        header .sub {
            margin-top: 5px;
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: var(--text-faint);
        }

        /* ---- Passphrase gate (kept intact; bypassed while AUTH_REQUIRED is false) ---- */
        #gate {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 24px;
            text-align: center;
            min-height: 0;
        }
        #gate.hidden { display: none; }
        #gate label {
            font-size: 0.72rem;
            letter-spacing: 2px;
            color: var(--text-faint);
            text-transform: uppercase;
        }
        #gate input {
            background: var(--surface-2);
            border: 1px solid var(--line-strong);
            color: var(--text);
            font-family: inherit;
            font-size: 16px; /* >=16px: stops iOS Safari auto-zoom on focus */
            letter-spacing: 1px;
            padding: 12px 14px;
            width: min(320px, 82vw);
            outline: none;
            border-radius: 6px;
            -webkit-appearance: none;
        }
        #gate input:focus { border-color: rgba(190, 172, 235, 0.55); }
        #gate button, .send-btn {
            background: var(--surface-2);
            border: 1px solid var(--line-strong);
            color: var(--text);
            font-family: inherit;
            font-size: 0.78rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 12px 20px;
            min-height: 44px;   /* Apple HIG minimum touch target */
            min-width: 72px;
            cursor: pointer;
            border-radius: 6px;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
        }
        #gate button:hover, .send-btn:hover,
        #gate button:active, .send-btn:active {
            border-color: rgba(196, 178, 240, 0.6);
            background: rgba(168, 146, 214, 0.14);
        }
        #gate .note {
            max-width: 330px;
            font-size: 0.72rem;
            line-height: 1.55;
            color: var(--text-faint);
        }
        #gate-error {
            font-size: 0.72rem;
            letter-spacing: 0.5px;
            color: var(--lavender);   /* was red; calm lavender now */
            min-height: 1em;
        }

        /* ---- Chat UI ---- */
        #chat {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        #chat.hidden { display: none; }

        #history {
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;                 /* particle layer can never widen the scroller */
            -webkit-overflow-scrolling: touch;  /* momentum scroll */
            overscroll-behavior: contain;       /* don't chain to the page */
            padding: 16px 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 82%;
            font-size: 1rem;
            line-height: 1.55;
            padding: 10px 14px;
            border-radius: 10px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.me {
            align-self: flex-end;
            background: rgba(150, 122, 208, 0.16);
            border: 1px solid rgba(178, 158, 222, 0.16);
            color: rgba(240, 236, 250, 0.94);
        }
        .msg.them {
            align-self: flex-start;
            background: rgba(168, 146, 214, 0.06);
            border: 1px solid var(--line);
            color: rgba(228, 222, 243, 0.82);
        }
        .msg.system {
            align-self: center;
            max-width: 90%;
            background: none;
            border: none;
            color: var(--lavender);   /* was red; calm lavender now */
            font-size: 0.82rem;
            letter-spacing: 0.3px;
            text-align: center;
        }
        .msg.thinking {
            position: relative;   /* containing block for the particle canvas */
            align-self: flex-start;
            background: rgba(168, 146, 214, 0.06);
            border: 1px solid var(--line);
            color: var(--text-dim);
            letter-spacing: 2px;
        }
        /* The pulse lives on the dots, not the bubble, so it can't also
           modulate the opacity of the particle canvas sitting inside it.
           This is the reduced-motion / no-canvas fallback indicator. */
        .msg.thinking .dots {
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.9; }
        }
        /* Ambient particle layer: extends up and to the right of the
           bubble. Fixed 200x118 box so it can never widen #history, and
           pointer-events:none so it is invisible to touch/scroll. */
        .think-particles {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 200px;
            height: 118px;
            pointer-events: none;
        }
        /* Graceful exit: the bubble collapses out of the flow (so the real
           reply lands underneath it without a layout jump) while the frozen
           particle layer dissipates on its own timer. */
        .msg.thinking.settling {
            opacity: 0;
            overflow: hidden;
            transition: opacity 0.30s ease-out,
                        height 0.30s ease-out,
                        padding 0.30s ease-out,
                        margin 0.30s ease-out,
                        border-width 0.30s ease-out;
        }

        #composer {
            flex: 0 0 auto;
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 12px;
            padding-left: max(12px, env(safe-area-inset-left));
            padding-right: max(12px, env(safe-area-inset-right));
            /* home-indicator inset only matters when the keyboard is closed;
               JS drops --kb-pad to 0 while the keyboard is up */
            padding-bottom: calc(10px + var(--kb-pad, env(safe-area-inset-bottom)));
            border-top: 1px solid var(--line);
            background: rgba(168, 146, 214, 0.045);
        }
        #composer input {
            flex: 1 1 auto;
            background: rgba(168, 146, 214, 0.09);
            border: 1px solid var(--line-strong);
            color: var(--text);
            font-family: inherit;
            font-size: 16px;   /* >=16px: prevents iOS focus auto-zoom */
            line-height: 1.3;
            padding: 12px 14px;
            min-height: 44px;
            outline: none;
            border-radius: 10px;
            min-width: 0;
            -webkit-appearance: none;
        }
        #composer input::placeholder { color: var(--text-faint); }
        #composer input:focus { border-color: rgba(190, 172, 235, 0.55); }

        #forget {
            position: absolute;
            bottom: max(8px, env(safe-area-inset-bottom));
            right: max(10px, env(safe-area-inset-right));
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: var(--text-faint);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
        }
        #forget:hover { color: var(--text-dim); }
    </style>
</head>
<body>
    <a href="index.html" class="home-button">&#8962;</a>

    <header>
        <h1>GORCAVE SERVER</h1>
        <div class="sub">a chat line into the machine watching the room</div>
    </header>

    <div id="gate" class="hidden">
        <label for="token-input">passphrase</label>
        <input id="token-input" type="password" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="enter passphrase">
        <button id="gate-submit">Enter</button>
        <div id="gate-error"></div>
        <div class="note">
            Stored locally in this browser only — never sent anywhere but the
            gorcave backend, and never put in a URL. gorcave isn't publicly
            reachable yet, so this gate is here before there's a door behind it.
        </div>
    </div>

    <div id="chat">
        <div id="history"></div>
        <form id="composer" autocomplete="off">
            <input id="msg-input" type="text" placeholder="say something to gorcave"
                   autocomplete="off" autocorrect="on" autocapitalize="sentences"
                   spellcheck="true" enterkeyhint="send">
            <button type="submit" class="send-btn">Send</button>
        </form>
    </div>

    <button id="forget" title="Clear stored passphrase">forget passphrase</button>

    <script>
        // ---------------------------------------------------------------
        // Live Tailscale Funnel endpoint on the gorcave Pi (public HTTPS
        // ingress via Tailscale's edge -> tailnet -> local FastAPI chat
        // endpoint). Per SERVER_SECURITY_PLAN.md: only /api/chat and
        // /api/health are exposed; everything else on the Pi stays private.
        const BACKEND_URL = "https://gorcave.taila85593.ts.net/api/chat";
        // ---------------------------------------------------------------

        const STORAGE_KEY = 'gorcave_token';

        // Backend passphrase auth is currently disabled (reversible on the
        // server via SERVER_AUTH_ENABLED). Flip this back to true (and
        // re-enable SERVER_AUTH_ENABLED on the Pi) to restore the gate.
        const AUTH_REQUIRED = false;

        const gateEl      = document.getElementById('gate');
        const chatEl      = document.getElementById('chat');
        const tokenInput  = document.getElementById('token-input');
        const gateSubmit  = document.getElementById('gate-submit');
        const gateError   = document.getElementById('gate-error');
        const historyEl   = document.getElementById('history');
        const composer    = document.getElementById('composer');
        const msgInput    = document.getElementById('msg-input');
        const forgetBtn   = document.getElementById('forget');
        const sendBtn     = composer.querySelector('.send-btn');

        function scrollToLatest() {
            historyEl.scrollTop = historyEl.scrollHeight;
        }

        function addMessage(text, cls) {
            const div = document.createElement('div');
            div.className = 'msg ' + cls;
            div.textContent = text;
            historyEl.appendChild(div);
            scrollToLatest();
        }

        function showChat() {
            gateEl.classList.add('hidden');
            chatEl.classList.remove('hidden');
            if (!historyEl.hasChildNodes()) {
                addMessage('Connected to the gate. gorcave itself may or may not be listening yet.', 'system');
            }
        }

        function tryEnter() {
            const val = tokenInput.value.trim();
            if (!val) {
                gateError.textContent = 'enter a passphrase first';
                return;
            }
            localStorage.setItem(STORAGE_KEY, val);
            gateError.textContent = '';
            showChat();
            msgInput.focus();
        }

        gateSubmit.addEventListener('click', tryEnter);
        tokenInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') tryEnter();
        });

        // Only wired up (and only visible) when auth is actually required —
        // while AUTH_REQUIRED is false this button must never be able to
        // bring the gate back, accidental tap or otherwise.
        if (AUTH_REQUIRED) {
            forgetBtn.addEventListener('click', () => {
                localStorage.removeItem(STORAGE_KEY);
                tokenInput.value = '';
                chatEl.classList.add('hidden');
                gateEl.classList.remove('hidden');
                gateError.textContent = '';
            });
        } else {
            forgetBtn.style.display = 'none';
        }

        // ---------------------------------------------------------------
        // iOS keyboard handling via the visualViewport API.
        //
        // On iOS Safari the *layout* viewport does not shrink when the
        // software keyboard appears — only the visual viewport does. So a
        // 100vh / position:fixed bottom bar ends up underneath the keyboard.
        // The fix: size the pinned body shell to visualViewport.height and
        // translate it down by visualViewport.offsetTop (Safari scrolls the
        // layout viewport when focusing an input near the bottom).
        // ---------------------------------------------------------------
        const vv = window.visualViewport;

        function applyViewport() {
            if (!vv) return;
            const h = Math.round(vv.height);
            const top = Math.round(vv.offsetTop);
            document.body.style.height = h + 'px';
            document.body.style.transform = top ? 'translateY(' + top + 'px)' : 'none';

            // Keyboard up? The home-indicator inset is meaningless then —
            // the keyboard already occupies that space.
            const kbUp = (window.innerHeight - vv.height) > 120;
            document.documentElement.style.setProperty(
                '--kb-pad', kbUp ? '0px' : 'env(safe-area-inset-bottom)'
            );
        }

        let vvFrame = null;
        function scheduleViewport(keepAtBottom) {
            if (vvFrame) cancelAnimationFrame(vvFrame);
            vvFrame = requestAnimationFrame(() => {
                vvFrame = null;
                applyViewport();
                if (keepAtBottom) scrollToLatest();
            });
        }

        if (vv) {
            vv.addEventListener('resize', () => scheduleViewport(true));
            vv.addEventListener('scroll', () => scheduleViewport(false));
            applyViewport();
        }

        // The pinned shell means the window itself should never scroll; if
        // iOS nudges it (focus scroll-into-view), snap it back to 0.
        window.addEventListener('scroll', () => {
            if (window.scrollY !== 0) window.scrollTo(0, 0);
        }, { passive: true });

        // Focusing the input: let Safari finish opening the keyboard, then
        // re-measure and keep the newest message in view.
        msgInput.addEventListener('focus', () => {
            setTimeout(() => scheduleViewport(true), 60);
            setTimeout(() => scheduleViewport(true), 320);
        });

        // Tapping Send must not blur the input — a blur would dismiss the
        // keyboard and immediately re-show it (the classic iOS flicker).
        ['mousedown', 'touchstart', 'pointerdown'].forEach((evt) => {
            sendBtn.addEventListener(evt, (e) => { e.preventDefault(); }, { passive: false });
        });
        sendBtn.addEventListener('click', () => {
            if (document.activeElement !== msgInput) msgInput.focus();
        });

        // ---------------------------------------------------------------
        // Ambient "thinking" particles.
        //
        // CANVAS, not DOM nodes. With ~15 bodies alive and every one of them
        // moving each frame, DOM would mean ~15 style recalcs + composited
        // layers per frame inside #history — the same scroll container the
        // visualViewport keyboard logic is fighting to keep smooth on a
        // phone. A single <canvas> is one element, one composited layer, and
        // zero layout work no matter how many particles are drawn. The only
        // thing DOM would have bought us (free glyph rendering) canvas gives
        // us anyway via fillText with the same monospace stack.
        // ---------------------------------------------------------------

        const REDUCED_MOTION = !!(window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches);

        // Feature gate — if any of this is missing we silently fall back to
        // the plain pulsing "..." indicator.
        const PARTICLES_OK = !REDUCED_MOTION &&
            typeof window.requestAnimationFrame === 'function' &&
            !!(document.createElement('canvas').getContext);

        // === THE SINGLE SOURCE OF PARTICLE CONTENT =======================
        // These are deliberately abstract marks, NOT words. The backend does
        // not stream intermediate generation, so any "thinking words" shown
        // here would be invented by the front end and would misrepresent the
        // machine — so we don't.
        //
        // FUTURE HOOK: if /api/chat ever grows a streaming response that
        // emits real token fragments, this function is the one place to
        // change. Buffer the incoming fragments somewhere and return the
        // next real fragment here instead of a glyph; everything downstream
        // (spawning, physics, fading, recycling) already treats the return
        // value as opaque text and needs no edits. Keep fragments short —
        // the layer is sized for 1–3 characters.
        const AMBIENT_GLYPHS = ['·', '·', '·', '∙', '∙', '◦', '˙', '°', ':', '×', '⟡'];
        function nextParticleGlyph() {
            return AMBIENT_GLYPHS[(Math.random() * AMBIENT_GLYPHS.length) | 0];
        }
        // =================================================================

        // Motion constants. Everything here is tuned slow on purpose: peak
        // speed is ~35 px/s, i.e. about half a pixel per frame at 60fps.
        const P_MAX        = 20;    // hard cap on live particles
        const P_SPAWN_MIN  = 140;   // ms between spawns (jittered)
        const P_SPAWN_MAX  = 280;   // avg ~210ms -> ~14 alive at steady state
        const P_LIFE_MIN   = 2400;  // ms
        const P_LIFE_MAX   = 3600;  // ms
        const P_GRAVITY    = 7;     // px/s^2 down: enough to arc a rise, not to drop
        const P_DRAG       = 0.35;  // fraction of velocity shed per second
        const P_BOUNCE     = 0.5;   // restitution off the layer bounds
        const P_SWAY       = 4;     // px/s^2 sinusoidal horizontal sway
        const P_DISSIPATE  = 520;   // ms fade-out once the reply lands
        const P_COLORS     = ['178,163,214', '196,178,240', '150,122,208'];

        /**
         * Builds the thinking bubble and (when allowed) starts its particle
         * loop. Returns { el, finish } — call finish() exactly once when the
         * reply arrives or the request fails.
         */
        function createThinkingIndicator() {
            const el = document.createElement('div');
            el.className = 'msg thinking';
            const dots = document.createElement('span');
            dots.className = 'dots';
            dots.textContent = '...';
            el.appendChild(dots);

            let canvas = null, ctx = null;
            let raf = 0, last = 0, tick = 0;
            let w = 0, h = 0, dpr = 1;
            let originX = 24, originY = 96;
            let spawnTimer = 0;
            let dying = false, dieAt = 0;
            let finished = false;
            const parts = [];

            function measure() {
                if (!canvas) return false;
                const cr = canvas.getBoundingClientRect();
                if (!cr.width || !cr.height) return false;
                const d = Math.min(window.devicePixelRatio || 1, 2);
                if (cr.width !== w || cr.height !== h || d !== dpr) {
                    w = cr.width; h = cr.height; dpr = d;
                    canvas.width  = Math.round(w * dpr);
                    canvas.height = Math.round(h * dpr);
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                }
                // Spawn from wherever the "..." actually sits, so the
                // particles read as sprouting out of the bubble's own text.
                const dr = dots.getBoundingClientRect();
                if (dr.width) {
                    originX = (dr.left + dr.width / 2) - cr.left;
                    originY = (dr.top + dr.height / 2) - cr.top;
                }
                return true;
            }

            function makeParticle() {
                return {
                    glyph: nextParticleGlyph(),
                    x: originX + (Math.random() * 10 - 5),
                    y: originY + (Math.random() * 6 - 3),
                    vx: -6 + Math.random() * 32,    // biased rightward, away from the bubble
                    vy: -34 + Math.random() * 20,   // always upward to start
                    size: 7 + Math.random() * 5,
                    peak: 0.22 + Math.random() * 0.22,
                    life: P_LIFE_MIN + Math.random() * (P_LIFE_MAX - P_LIFE_MIN),
                    age: 0,
                    phase: Math.random() * 6.283,
                    color: P_COLORS[(Math.random() * P_COLORS.length) | 0]
                };
            }

            function stop() {
                if (raf) { cancelAnimationFrame(raf); raf = 0; }
                if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
                canvas = null; ctx = null;
                parts.length = 0;
            }

            function frame(ts) {
                raf = requestAnimationFrame(frame);

                if (!last) last = ts;
                let dt = (ts - last) / 1000;
                last = ts;
                if (dt > 0.05) dt = 0.05;   // backgrounded-tab / jank guard

                // Re-measuring every frame would be a layout read per frame;
                // 3x/sec is plenty for a bubble that barely moves.
                if ((tick % 20) === 0 && !measure()) { tick = 0; return; }
                tick++;
                if (!ctx) { stop(); return; }

                let fade = 1;
                if (dying) {
                    fade = 1 - (ts - dieAt) / P_DISSIPATE;
                    if (fade <= 0) { stop(); return; }
                } else {
                    spawnTimer -= dt * 1000;
                    if (spawnTimer <= 0) {
                        if (parts.length < P_MAX) parts.push(makeParticle());
                        spawnTimer = P_SPAWN_MIN + Math.random() * (P_SPAWN_MAX - P_SPAWN_MIN);
                    }
                }

                ctx.clearRect(0, 0, w, h);

                for (let i = parts.length - 1; i >= 0; i--) {
                    const p = parts[i];
                    p.age += dt * 1000;
                    if (p.age >= p.life) { parts.splice(i, 1); continue; }   // recycled

                    p.vy += P_GRAVITY * dt;
                    p.vx += Math.sin(p.age * 0.0012 + p.phase) * P_SWAY * dt;
                    const keep = 1 - P_DRAG * dt;
                    p.vx *= keep; p.vy *= keep;
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;

                    // Soft, lossy walls — a nudge back inside, not a ping-pong.
                    if (p.x < 3)     { p.x = 3;     p.vx = -p.vx * P_BOUNCE; }
                    if (p.x > w - 3) { p.x = w - 3; p.vx = -p.vx * P_BOUNCE; }
                    if (p.y < 3)     { p.y = 3;     p.vy = -p.vy * P_BOUNCE; }
                    if (p.y > h - 3) { p.y = h - 3; p.vy = -p.vy * P_BOUNCE; }

                    const t = p.age / p.life;
                    let a = t < 0.14 ? (t / 0.14) : (t > 0.55 ? (1 - t) / 0.45 : 1);
                    a *= p.peak * fade;
                    if (a <= 0.004) continue;

                    ctx.globalAlpha = a;
                    ctx.fillStyle = 'rgb(' + p.color + ')';
                    ctx.font = p.size.toFixed(1) + 'px "Courier New", Courier, monospace';
                    ctx.fillText(p.glyph, p.x, p.y);
                }
                ctx.globalAlpha = 1;

                // Nothing left to draw and nothing more coming: tear the
                // loop down rather than idling a rAF on a phone battery.
                if (dying && !parts.length) stop();
            }

            if (PARTICLES_OK) {
                try {
                    canvas = document.createElement('canvas');
                    canvas.className = 'think-particles';
                    canvas.setAttribute('aria-hidden', 'true');
                    ctx = canvas.getContext('2d');
                    if (ctx) {
                        el.appendChild(canvas);
                        raf = requestAnimationFrame(frame);
                    } else {
                        canvas = null;
                    }
                } catch (err) {
                    canvas = null; ctx = null;
                }
            }

            function finish() {
                if (finished) return;
                finished = true;

                if (canvas && ctx) {
                    // Freeze the particle layer in viewport space so the
                    // bubble can collapse beneath it without dragging the
                    // particles down with it.
                    const r = canvas.getBoundingClientRect();
                    canvas.style.position = 'fixed';
                    canvas.style.left = r.left + 'px';
                    canvas.style.top = r.top + 'px';
                    canvas.style.bottom = 'auto';
                    document.body.appendChild(canvas);
                    dying = true;
                    dieAt = (window.performance && performance.now)
                        ? performance.now() : last;
                } else {
                    stop();
                }

                // Collapse the bubble out of the flow. The negative margin
                // cancels #history's 12px flex gap so the incoming reply
                // slides up without a jump.
                el.style.height = el.offsetHeight + 'px';
                el.classList.add('settling');
                requestAnimationFrame(() => {
                    el.style.height = '0px';
                    el.style.paddingTop = '0px';
                    el.style.paddingBottom = '0px';
                    el.style.borderWidth = '0px';
                    el.style.marginBottom = '-12px';
                });
                setTimeout(() => {
                    if (el.parentNode) el.parentNode.removeChild(el);
                }, 340);
            }

            return { el: el, finish: finish };
        }

        composer.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = msgInput.value.trim();
            if (!text) return;

            const headers = { 'Content-Type': 'application/json' };
            if (AUTH_REQUIRED) {
                const token = localStorage.getItem(STORAGE_KEY);
                if (!token) {
                    showChat();
                    gateEl.classList.remove('hidden');
                    chatEl.classList.add('hidden');
                    return;
                }
                headers['Authorization'] = 'Bearer ' + token;
            }

            addMessage(text, 'me');
            msgInput.value = '';
            // Keep the keyboard up across a send.
            msgInput.focus();

            const thinking = createThinkingIndicator();
            historyEl.appendChild(thinking.el);
            scrollToLatest();

            try {
                const res = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ message: text })
                });

                thinking.finish();

                if (!res.ok) {
                    addMessage("can't reach the agent right now", 'system');
                    return;
                }

                const data = await res.json();
                if (data && typeof data.reply === 'string') {
                    addMessage(data.reply, 'them');
                } else {
                    addMessage("can't reach the agent right now", 'system');
                }
            } catch (err) {
                thinking.finish();
                addMessage("can't reach the agent right now", 'system');
            }
        });

        // Auto-enter if a passphrase is already stored from a previous visit.
        // When AUTH_REQUIRED is false, skip the passphrase gate entirely and
        // go straight to the chat interface.
        (function init() {
            if (!AUTH_REQUIRED) {
                showChat();
                return;
            }
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                showChat();
            }
        })();
    </script>
</body>
</html>
