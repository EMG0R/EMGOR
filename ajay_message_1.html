<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Video</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  video {
    /* Fit entirely within the viewport in both axes — a portrait
       video on a landscape screen letterboxes instead of overflowing. */
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    display: block;
  }
</style>
</head>
<body>
<video src="media/ajaymessage22.mp4" playsinline controls preload="metadata"></video>
</body>
</html>
