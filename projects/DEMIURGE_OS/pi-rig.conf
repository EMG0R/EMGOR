# pi-rig.conf — single source of truth for the Pi rig's user@host, for every
# MAC-SIDE script that reaches the Pi over SSH (sync, deploy, monitor
# helpers). The Pi's OWN scripts and systemd units do NOT read this file —
# they derive the user from $USER/$HOME/$(id -u) at install or run time
# (see setup-script/setup-demiurge.sh's PI_USER, and demiurge-env.sh).
#
# This is the ONE place to edit when the rig is renamed (e.g. gorpi7 ->
# gorpi7v2). Every Mac-side script sources this file and falls back to the
# values below only when PI_USER / PI_HOST aren't already set in the
# environment, so `PI_USER=gorpi7v2 ./neptr/scripts/sync_to_pi.sh` still
# works for a one-off override without editing anything.
PI_USER_DEFAULT="gorpi7v2"
PI_HOST_DEFAULT="demiurge.local"
