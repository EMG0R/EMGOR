# Installed as ~/.config/systemd/user/cod-bus.service.d/10-dormant-guard.conf
# A node is a tank member only when ~/.cod-bus.conf exists with a hub URL AND a
# token. Without them this unit is SKIPPED by systemd (ExecCondition false is a
# clean skip, not a failure, and Restart= does not fire), so even a manual
# `systemctl --user start cod-bus` makes no outbound connection.
[Service]
ExecCondition=/bin/sh -c 'f="$HOME/.cod-bus.conf"; grep -q "^COD_BUS_URL=.." "$f" 2>/dev/null && grep -q "^COD_BUS_TOKEN=.." "$f" 2>/dev/null'
