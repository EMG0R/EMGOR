# NEPTR Phase 4 — legacy launcher config (SUPERSEDED)
#
# This file was used by launch_phase4.sh when it was the primary entry point.
# As of 2026-04-24, demiurge.service reads live.conf directly via
# /boot/firmware/demiurge.conf `launch =`. live.conf is now the only
# config you need to edit. This file is kept for reference only.
#
# Original description: single source of truth for the launcher: which csound entry to run,
# which chuck files to spork alongside it, and how PipeWire should wire
# them together.
#
# Format: KEY = VALUE, one per line, # for comments. Paths are relative
# to the NEPTR_phase4 root (whichever directory holds this file).

# ---- csound ----
# Main entry. This file already #includes every effects/*.orc, so
# launching it covers the entire effect chain — no other csd is touched
# directly.
csound_main      = csound/neptrPhase4.csd

# Preset bank: 0=surf/gig (default), 1=bass-rig.
# Passed to csound as --omacro:PRESET_BANK=<value>.
# Production: set csound_opts in live.conf instead (demiurge.service).
preset_bank      = 1

# JACK/PipeWire client name csound will register under. The launcher
# uses this to find csound's input ports for routing.
csound_jack_name = neptr_phase4

# Csound CsOptions inside neptrPhase4.csd default to ALSA hw direct
# (-odac:hw:2,0). For PipeWire routing to work we need csound to use
# the JACK driver instead. Setting this to 1 makes the launcher pass
# `-+ignore_csopts=1` so the in-file CsOptions are skipped and the
# launcher's own options take effect.
csound_ignore_csopts = 1

# ---- chuck ----
# ChucK files to launch as JACK clients alongside csound. They are
# spawned in order. Each one is its own JACK client; its outputs get
# linked to the csound input ports.
chuck_files      = chuck/synthi.ck

# JACK client name chuck registers under. ChucK's default is "ChucK"
# and its stereo output ports are "ChucK:outport 0" / "ChucK:outport 1".
chuck_jack_name  = ChucK

# Chuck's RtAudio JACK driver wants a device index to "open" — even
# though chuck creates its own JACK client and free output ports
# regardless. The launcher runs `chuck --probe` and picks the first
# device whose name contains this substring AND has ≥ 2 output
# channels. If the match fails (e.g. Scarlett unplugged at boot), the
# launcher falls back to the always-present DEMIURGE virtual sink.
chuck_jack_device_match = Scarlett Solo (3rd Gen.) Headphones

# ---- routing ----
# Routing intent (the launcher implements this; no overrides):
#
#   demiurge-source:capture_FL  -> <csound_jack_name>:input1
#   demiurge-source:capture_FR  -> <csound_jack_name>:input2
#   <chuck>:outport 0           -> <csound_jack_name>:input1   (mixed in)
#   <chuck>:outport 1           -> <csound_jack_name>:input2   (mixed in)
#   <csound>:output1            -> demiurge-sink:playback_FL
#   <csound>:output2            -> demiurge-sink:playback_FR
#
# Chain stages link only to the DEMIURGE virtual hub
# (`demiurge-sink` / `demiurge-source`). The hub <-> physical USB
# hardware (Scarlett or whatever else is plugged in) is wired by a
# separate "aggregate" pass that the launcher runs at start AND
# repeatedly in a 2 s background loop. Hot-unplug / replug of the
# audio interface re-converges within ~2 s with no audio interruption
# to the chain stages — they never see hardware directly, only the
# always-present hub. There is therefore nothing in this file to point
# at a specific Scarlett port.
