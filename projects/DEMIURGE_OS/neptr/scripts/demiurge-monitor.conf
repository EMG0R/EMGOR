# demiurge-monitor.conf — universal control-monitor config.
#   INSTALL ON THE PI:  cp demiurge-monitor.conf ~/demiurge/monitor.conf
#
# Reconfigure the monitor for whatever control input comes into the demiurge
# system — no code change. Restart the service after editing:
#   sudo systemctl restart demiurge-monitor
#
# If this file is absent, the daemon falls back to the built-in Teensy defaults.

# MIDI input port. "auto" prefers the Teensy's own hardware port (independent of
# the audio engine / UI / supervisor), then bridge, then Through. Or set a
# substring of a specific port name.
port = auto

# Where the one-line telemetry snapshot is published (atomic writes). The
# terminal companion (`demiurge`) reads this.
output = /tmp/neptr_companion_telemetry

# Publish cadence in seconds.
interval = 0.4

# CCs that should display centred (64) before their first message (joystick axes).
center64 = 27,28

# CC -> label map, in display order. label:cc per line. Reconfigure freely for a
# different controller; the terminal just word-wraps whatever labels appear.
[map]
jstX:27
jstY:28
joyB:77
exp:29
ldr1:30
ldr2:36
accX:31
accY:32
accZ:33
fsr1:34
fsr2:35
micL:78
micR:79
btn1:60
btn2:61
btn3:62
btn4:63
btn5:64
btn6:65
btn7:66
btn8:67
btn9:68
enc1:20
enc2:21
enc3:22
enc4:23
enc5:24
enc6:25
enc7:26
eb1:70
eb2:71
eb3:72
eb4:73
eb5:74
eb6:75
eb7:76
