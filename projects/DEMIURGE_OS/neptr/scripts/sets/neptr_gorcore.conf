# set: neptr_gorcore
# power: high
# NEPTR Phase 4 — GORCORE rig (his verified-good config, docs/2026-08-12-state.md)
# sync layer ON, quantum 64, preset bank 2. Period 64x(4+) follows `quantum`
# automatically (demiurge-quantum-limits lockstep).
# Switch: demiurge-set neptr_gorcore

link    = off
bpm     = 124
rate    = 48000
quantum = 64

sync_layer = on
audio_interface = hw:CARD=USB,DEV=0

csound_extra = --omacro:PRESET_BANK=2

chain =
  ~/NEPTR_phase4/csound/neptrPhase4.csd
