# DEMIURGE — Bluetooth output policy (WirePlumber drop-in)
#
# Overrides the "ignore Bluetooth entirely" block in 50-demiurge.conf so the
# Pi can stream its main mix to ONE Bluetooth speaker (A2DP output only).
#
# Loaded after 50-demiurge.conf (higher number wins). For live testing this
# can live in ~/.config/wireplumber/wireplumber.conf.d/ (no sudo, restart with
# `systemctl --user restart wireplumber`). For the permanent install its body
# replaces the monitor.bluez.rules block inside the system 50-demiurge.conf at
# /etc/wireplumber/wireplumber.conf.d/.
#
# Design notes:
#  - A2DP only (a2dp_sink + a2dp_source); HSP/HFP dropped. Dropping the headset
#    profiles keeps a speaker in high-quality stereo — a stray HFP negotiation
#    would otherwise flip it into 8 kHz mono "phone-call" mode mid-set. Both
#    A2DP roles are kept because restricting to a2dp_source alone stops some
#    BlueZ/WirePlumber versions from forming any usable profile at all (the
#    device then never appears as a PipeWire node).
#  - OUTPUT-ONLY is enforced where it actually matters: the DEMIURGE sync layer
#    (aggregate.rs) only ever links `bluez_output.*` sinks. A Bluetooth input
#    node can never enter the Demiurge graph, whatever profile is negotiated.
#  - bluez_output nodes are marked node.autoconnect = false, exactly like the
#    USB sinks in 50-demiurge.conf. The DEMIURGE launcher (aggregate.rs) owns
#    all physical-output linking via pw-link; WirePlumber must not speculatively
#    wire the speaker to anything, or it would fight the launcher's routing.

# CRITICAL for a headless Pi: disable seat-monitoring. By default WirePlumber's
# BlueZ monitor only creates device/node objects while the user is on the
# *active* logind graphical seat. DEMIURGE runs headless (SSH + linger, no
# graphical session), so with seat-monitoring on, a speaker connects at the
# BlueZ level but NO bluez_output node is ever created — and the failed audio
# transport makes BlueZ drop the link seconds later. Disabling it lets the
# monitor always create nodes. This is THE fix for "connects then disconnects,
# no node" on headless systems.
#   ref: WirePlumber bluetooth docs; bluez/bluez#1545
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

# NOTE: we deliberately do NOT set `monitor.bluez.properties` here. In
# WirePlumber 0.5 a `.properties` section is taken "as-is" — it REPLACES the
# stock defaults rather than merging — and the defaults are what register the
# A2DP media endpoints with BlueZ. Overriding the block (e.g. just to set
# bluez5.roles) silently drops those defaults, so the speaker connects but no
# audio transport / bluez_output node is ever created. The stock defaults
# already enable A2DP output to a speaker, which is all we need. Output-only is
# enforced where it matters: the sync layer (aggregate.rs) links bluez_output
# sinks only, so a Bluetooth input can never enter the Demiurge graph.

monitor.bluez.rules = [
    # Re-enable Bluetooth devices that 50-demiurge.conf disabled.
    {
        matches = [ { device.api = "bluez5" } ]
        actions = {
            update-props = {
                device.disabled = false
                node.disabled   = false
            }
        }
    }
    # The speaker's output node: never auto-routed, never auto-default. The
    # launcher links demiurge-sink-output → bluez_output explicitly. Keep it
    # warm (no pause-on-idle) so the first note doesn't get clipped while the
    # A2DP link spins up. Priority below USB (2000) — launcher owns ordering.
    {
        matches = [ { node.name = "~bluez_output\\..*" } ]
        actions = {
            update-props = {
                node.autoconnect   = false
                node.pause-on-idle = false
                priority.session   = 1000
                priority.driver    = 1000
            }
        }
    }
]
