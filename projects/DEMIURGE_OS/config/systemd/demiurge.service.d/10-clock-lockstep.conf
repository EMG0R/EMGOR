# DEMIURGE — one knob for rate AND quantum: generate every device-side setting
# from ~/demiurge/live.conf BEFORE the engine (and any audio) exists.
#
# Installed to: /etc/systemd/system/demiurge.service.d/10-clock-lockstep.conf
#
# Why: rate/quantum used to be hand-kept in six places, and period-size lived in
# a generated /etc file that a fresh install never had — after the 2026-10-01
# card rebuild the device ran 128x4 while live.conf said whatever was typed in
# it, and a non-48k `rate =` would have been silently resampled (incident
# 2026-10-02-bitcrush-after-rebuild). `demiurge-quantum-limits lockstep` reads
# live.conf and writes the period, rate and clock fragments into the USER
# config dirs (no sudo; they shadow the /etc boot seeds), restarts
# wireplumber/pipewire only if a fragment actually changed, and pins
# clock.force-rate/force-quantum. It is safe here because the engine is down.
#
# The `-` prefix is deliberate on BOTH lines: neither tool may ever stop the
# instrument from starting. They print loudly and exit 0 on every error path.
#
# demiurge-mixer restore puts the codec's ADC gain / input mux back from
# ~/demiurge/asound.state (a no-op when that file does not exist), so the input
# level survives a card rebuild instead of falling back to driver defaults.
[Service]
ExecStartPre=-/opt/demiurge/bin/demiurge-quantum-limits lockstep
ExecStartPre=-/opt/demiurge/bin/demiurge-mixer restore
