# DEMIURGE — pin the launcher and all audio children to the isolated core.
#
# Installed to: /etc/systemd/system/demiurge.service.d/cpu-affinity.conf
#
# Pairs with the kernel cmdline `isolcpus=3` (see
# config/pi5-performance/cmdline.txt.additions — `nohz_full=3` and
# `rcu_nocbs=3` are listed there too but the stock Raspberry Pi OS kernel
# rejects both, so isolcpus is the only live token). Without this
# drop-in, isolcpus=3 only means "the general scheduler never puts
# anything on CPU 3" — nothing actually moves TO that core. The result
# is a wasted isolated core: the audio stages keep floating across
# CPU 0-2 alongside browser tabs / systemd housekeeping, and thread
# migration jitter is the same as if isolcpus wasn't set.
#
# CPUAffinity=3 here moves the launcher AND every child it forks
# (wrappers → csound / chuck / pd / sc / faust, demiurge-clock,
# pw-link subprocess calls) onto CPU 3 exclusively. Pi 5 at 2.4 GHz
# has plenty of budget for a 6-stage chain on one core at 128-frame
# quantum.
#
# If a chain is too dense for a single core you can widen this to
# "2-3" (two isolated cores) — but first add CPU 2 to the isolcpus
# cmdline token, otherwise the general scheduler will co-schedule
# unrelated userspace on CPU 2 and the pinning does nothing.
#
# Revert: rm this file, `systemctl daemon-reload`, restart demiurge.
#
# CORRECTED 2026-08-10 after measuring on the HiFiBerry. The original
# `CPUAffinity=3` above never took effect — csound ran on 0-2 as
# SCHED_OTHER next to the UI (~10 xruns/min) while CPU 3 sat idle.
# Two things were wrong, and the obvious fix made it worse:
#
#   * CPUAffinity= alone was silently clamped, so nothing moved.
#   * Adding AllowedCPUs=3 (whole-unit cgroup cpuset) DID move
#     everything to CPU 3 — launcher, wrappers, pw-link helpers AND the
#     engine — and measured WORSE (40 xruns/100s) than no pin at all.
#     Those helpers preempt the very engine the core was reserved for.
#
# What actually works: ONLY the engine process on the isolated core.
#   - AllowedCPUs=0-3 keeps CPU 3 *admissible* to this unit's cgroup
#     (without it, the engine's own taskset would be refused).
#   - CPUAffinity=0-2 keeps the launcher and its helper subprocesses
#     OFF the isolated core by default.
#   - The engine alone is pinned by DEMIURGE_RT_PIN in
#     src/wrappers/demiurge-env.sh (auto-derived from isolcpus, or
#     live.conf `rt_core =`), applied by every demiurge-run-* wrapper
#     alongside its existing `chrt --fifo 74`.
# Measured that way: 0 xruns.
#
# Verify:
#   taskset -pc $(pgrep -x csound)     → "3"    (engine on isolated core)
#   taskset -pc $(pgrep demiurge-laun) → "0-2"  (launcher off it)

[Service]
CPUAffinity=0-2
AllowedCPUs=0-3
