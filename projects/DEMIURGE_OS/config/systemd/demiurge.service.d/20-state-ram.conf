# seed RAM state from SD before csound starts; flush back on stop
#
# Installed by setup-demiurge.sh Phase 6 (the demiurge.service.d glob) — it used
# to live in src/wrappers/ where the installer's glob skipped *.conf, so it was
# never installed. Without it csound's instr 97 wrote the settings table to the
# SD card ON THE AUDIO THREAD every 2 s (2-8 ms per write vs a 1.33 ms period).
# demiurge-run-csound uses /dev/shm/neptr-state when that directory exists.
#
# `-` on the seed: if demiurge-state-ram is not installed yet (Phase 6 ran but
# Phase 7d has not), the service must still start; csound then falls back to
# the SD state dir.
[Service]
ExecStartPre=-/usr/local/bin/demiurge-state-ram seed
ExecStopPost=/usr/local/bin/demiurge-state-ram flush
