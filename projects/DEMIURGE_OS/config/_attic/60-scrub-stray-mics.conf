[Service]
# Remove mic→demiurge-sink stray links that WP auto-creates at boot before
# the launcher wires mics to csound. Runs 8 seconds after ExecStart so the
# full graph (csound registered + WP linked everything) is settled first.
# node.dont-reconnect=true on demiurge-sink (50-demiurge.conf Rule 3)
# prevents WP from re-creating these links after the scrub.
ExecStartPost=/bin/bash -c '  sleep 8;   for port in FL FR RL RR; do     pw-link -d "alsa_input.usb-Focusrite_Scarlett_Solo_USB_Y7HT8KA9C84089-00.HiFi__Mic1__source:capture_MONO" "demiurge-sink:playback_${port}" 2>/dev/null || true;     pw-link -d "alsa_input.usb-Focusrite_Scarlett_Solo_USB_Y7HT8KA9C84089-00.HiFi__Mic2__source:capture_MONO" "demiurge-sink:playback_${port}" 2>/dev/null || true;     pw-link -d "alsa_input.usb-Focusrite_Scarlett_Solo_USB_Y7HT8KA9C84089-00.HiFi__Mic1__source.split:capture_MONO" "demiurge-sink:playback_${port}" 2>/dev/null || true;     pw-link -d "alsa_input.usb-Focusrite_Scarlett_Solo_USB_Y7HT8KA9C84089-00.HiFi__Mic2__source.split:capture_MONO" "demiurge-sink:playback_${port}" 2>/dev/null || true;   done;   exit 0'
