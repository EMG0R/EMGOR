[Unit]
# DRM probes late on Pi5; a one-shot ConditionPathExists=/dev/dri/cardN in the
# base unit permanently SKIPS the UI that boot (systemd checks a condition once).
# Reset it to EMPTY here so a stale base unit can never skip the UI at boot, then
# WAIT for the device in ExecStartPre instead. (An empty assignment clears all
# previously-set ConditionPathExists values.) This makes the drop-in self-
# sufficient even if the base unit source re-syncs with the old condition.
ConditionPathExists=
# Disable the start rate-limit so the UI keeps retrying KMSDRM until the screen
# is free (covers boot AND the after-game reclaim race).
StartLimitIntervalSec=0

[Service]
RestartSec=2
# Wait (bounded ~30s) for the DRM device before launching kivy; fail-open.
ExecStartPre=/bin/sh -c "for i in $(seq 1 60); do if [ -e /dev/dri/card0 ] || [ -e /dev/dri/card1 ]; then exit 0; fi; sleep 0.5; done; exit 0"
