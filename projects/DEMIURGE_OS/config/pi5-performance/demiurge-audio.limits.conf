# DEMIURGE M8 — RT limits for the audio group
# Install to: /etc/security/limits.d/demiurge-audio.conf
#
# Every member of the `audio` group gets:
#   - realtime priority up to 99 (required by JACK/PipeWire real-time threads)
#   - unlimited locked memory (required so audio buffers never get paged out)
#   - nice down to -20 (for any non-RT-thread process boost)
#
# These limits apply at next login. Verify with:
#   ulimit -r   # → 99
#   ulimit -l   # → unlimited

@audio   -   rtprio      99
@audio   -   memlock     unlimited
@audio   -   nice        -20
