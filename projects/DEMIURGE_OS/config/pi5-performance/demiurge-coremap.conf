# demiurge-coremap.conf — the Pi 5 "three audio cores + one management core"
# map. Sourced (bash) by demiurge-coremap.sh. INERT: nothing reads this until
# demiurge-coremap.sh is run by hand at the bench with the confirm env set.
# Install to: /etc/demiurge/coremap.conf   (optional; script has same defaults)
#
# Extends the demiurge-power family: demiurge-power.sh owns freq/governor/
# cores-online; this owns WHICH process sits on WHICH core. live.conf stays the
# only user-facing surface; these keys may later be mirrored as live.conf
# `core_util=`, `core_csound=`, `core_cardinal=`, `core_jack=` (not wired yet).

# CPU lists (taskset -c syntax)
UTIL_CPUS=0        # OS, launcher, transport clock, web UI, OSC/MIDI pool, updater, COD, utility audio
CSOUND_CPU=1       # Csound engine (RT)
CARDINAL_CPU=2     # Cardinal / VCV engine (RT)
JACK_CPU=3         # pipewire-jack data-loop (graph driver) / any third audio process (RT)

# SCHED_FIFO priorities (chrt --fifo). Ordering matters:
#   audio-pacing IRQ threads 85 > pipewire data-loop 83 > csound 74 > cardinal 70
# The three are on different cores so they no longer preempt each other; the
# ordering only decides who wins if a core is ever shared (fallback).
IRQ_PRIO=85        # set by demiurge-audio-irq-rt.sh (unchanged)
JACK_PRIO=83       # pipewire's own RT prio; coremap does NOT change it, listed for the doc
CSOUND_PRIO=74     # same value demiurge-run-csound already uses
CARDINAL_PRIO=70   # Cardinal wrapper does not exist yet

# Process-name patterns (pgrep -x)
CSOUND_COMM="csound demiurge-csound-host"
CARDINAL_COMM="Cardinal CardinalNative"
PIPEWIRE_COMM="pipewire"
