# DEMIURGE — PipeWire low-latency tuning  (BOOT SEED — 2026-10-02)
# Install to: /etc/pipewire/pipewire.conf.d/99-demiurge-lowlatency.conf
#
# This static file is only the 48000 / 128 BOOT SEED for a rig that has never
# run `demiurge-quantum-limits lockstep`. Lockstep (ExecStartPre of
# demiurge.service) generates a copy of this file from live.conf `rate =` /
# `quantum =` into ~/.config/pipewire/pipewire.conf.d/99-demiurge-lowlatency.conf
# — SAME NAME, so the user-dir copy shadows this one. Do not hand-edit values
# here to change rate or quantum; edit live.conf.
#
# default.clock.rate           = 48000   hardware rate
# default.clock.allowed-rates  = [48000] graph is locked to 48k — no resampling
# default.clock.force-rate     = 48000   runtime enforcement (see notes)
# default.clock.quantum        = 128     ~2.67 ms per hop (boot seed; live.conf wins)
# default.clock.min-quantum    = 32      lower bound PW is allowed to drop to
# default.clock.max-quantum    = 2048    fixed ceiling so any live.conf quantum fits
# default.clock.force-quantum  = 128     boot seed; launcher re-pins from live.conf
#
# `force-rate` and `force-quantum` are listed in the config file for
# documentation, but the keys are NOT honored from config files alone — they
# are overwritten by WirePlumber's initial metadata push at session start.
# The authoritative place to set both is the demiurge.service ExecStartPre
# block that writes to the `settings` metadata object at launcher start:
#
#     pw-metadata -n settings 0 clock.force-rate    48000
#     pw-metadata -n settings 0 clock.force-quantum 128
#
# Keep all values in this config file anyway so pw-top / pw-metadata read
# consistent numbers when the launcher isn't running.
#
# After install: systemctl --user restart pipewire wireplumber
# Verify:        pw-metadata -n settings 0 clock.force-rate
#                pw-metadata -n settings 0 clock.force-quantum
# Measure:       pw-top   (RATE=48000, QUANT=128, ERR flat)
#
# QUANTUM = ONE KNOB (live.conf). Set the graph quantum in exactly ONE place:
#   ~/demiurge/live.conf  `quantum = <Q>`
# Everything downstream follows automatically:
#   - the launcher reads live.conf and pins clock.force-quantum via pw-metadata
#     at startup AND on every hot-reload (util::pin_clock_metadata);
#   - the wrappers derive their buffer from the injected DEMIURGE_QUANTUM
#     (demiurge-run-csound `-b $Q`, demiurge-run-chuck `--bufsize:$Q`);
#   - demiurge-env.sh derives PIPEWIRE_LATENCY=${DEMIURGE_QUANTUM}/${rate};
#   - max-quantum above is a fixed ceiling (2048) so any Q fits without clamping.
#   The default/force-quantum/ExecStartPre values are just pre-launcher boot
#   seeds — the launcher overrides them from live.conf within ~1 s, so they do
#   NOT need to change when you change the quantum.
#
# RATE is now ONE KNOB too (2026-10-02): live.conf `rate = <R>`. It used to be a
#   six-place hand lockstep (this file, wait-pipewire.conf, 50-demiurge.conf,
#   demiurge-virtual.conf, launcher util.rs, demiurge-env.sh). Now
#   `demiurge-quantum-limits lockstep` generates, from live.conf:
#     - ~/.config/pipewire/pipewire.conf.d/99-demiurge-lowlatency.conf
#         (default.clock.{rate,allowed-rates,force-rate,quantum,force-quantum})
#     - ~/.config/wireplumber/wireplumber.conf.d/61-demiurge-rate.conf
#         (audio.rate / allowed-rates on every alsa_* node)
#     - ~/.config/wireplumber/wireplumber.conf.d/60-demiurge-period.conf
#         (period-size/num, both directions)
#   and pins clock.force-rate / force-quantum via pw-metadata. The static files
#   (this one, 50-demiurge.conf's USB rule, demiurge-virtual.conf) remain 48000
#   boot seeds; see demiurge/docs/gotchas.md Q7c for the history.
#
#   Mismatches don't error — wrong quantum gives total silence (gotchas Q7a),
#   wrong rate gives constant resampling artifacts that survive replug/restart
#   (gotchas Q7c). See demiurge/docs/gotchas.md for both.

context.properties = {
    default.clock.rate           = 48000
    default.clock.allowed-rates  = [ 48000 ]
    default.clock.force-rate     = 48000
    default.clock.quantum        = 128
    default.clock.min-quantum    = 32
    # max-quantum is a fixed CEILING, not the operating value. Kept high so the
    # graph quantum — set ONLY in live.conf (`quantum =`) and pinned at runtime by
    # the launcher's pw-metadata push — is never clamped. To change the quantum,
    # edit live.conf and nothing else; this ceiling does not need touching.
    default.clock.max-quantum    = 2048
    default.clock.force-quantum  = 128
}
