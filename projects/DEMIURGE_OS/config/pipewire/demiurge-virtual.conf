# DEMIURGE — Virtual Audio Layer
#
# Creates persistent virtual sink/source nodes that always exist.
# Audio languages connect here only — never to physical hardware directly.
# Unplugging hardware: links torn down, virtual nodes persist. No crashes.
#
# Channel count:
#   - demiurge-sink  is a 4-channel bus (FL FR RL RR). Default stereo patches
#     write to FL/FR and are routed to the first physical interface. Channels
#     RL/RR feed the second interface when aggregation is active.
#   - demiurge-source is a 4-channel capture bus with the same shape.
#
# Task 1 (Rust launcher rewrite) will manage this dynamically at runtime.
# For now the layer is sized to cover one or two stereo interfaces. Third
# and fourth interfaces require growing these channel counts here and
# re-running pipewire.
#
# node.autoconnect = false ON BOTH STREAM ENDS — this is load-bearing, not
# tidiness. A loopback's capture end is a Stream/Input and its playback end a
# Stream/Output, so WirePlumber's default policy speculatively connects them to
# whatever it currently considers the default source/sink. On a rig whose
# default source is a MONITOR, that closes an audio feedback loop directly
# into the input bus. It was happening on every boot of this rig, and the only
# reason it was survivable is that the launcher tore the links down afterwards:
#
#   scrub monitor: alsa_output.platform-soc_..._sound...:monitor_FL
#                    -X-> demiurge-source-input:input_FL
#   aggregate: unlink demiurge-sink:monitor_FL → demiurge-source-input:input_FL
#
# Those two lines are a race being won, not a loop being prevented — the links
# exist from node creation until the next launcher pass. `node.dont-reconnect`
# (below) does NOT cover this: it only stops a stream re-targeting after its
# target goes away, and says nothing about the FIRST connection. autoconnect
# off means the links are never created at all, and the launcher's explicit
# pw-link calls are unaffected (pw-link works on ports, not on stream policy),
# so aggregate and graph keep full control of every edge.

context.modules = [
    # Virtual Sink — languages send audio here.
    # audio.rate is pinned at 48000 on both sides of the loopback so a USB
    # hot-plug that briefly exposes the graph to another rate cannot drag
    # the virtual nodes with it. See gotchas.md Q7c for the full story.
    {
        name = libpipewire-module-loopback
        args = {
            audio.rate     = 48000
            audio.position = [ FL FR RL RR ]
            capture.props = {
                node.name        = "demiurge-sink"
                node.description = "DEMIURGE"
                media.class      = "Audio/Sink"
                audio.rate       = 48000
                audio.position   = [ FL FR RL RR ]
                audio.channels   = 4
                node.latency     = 256/48000
                node.linger      = true
                priority.session = 0
            }
            playback.props = {
                node.name         = "demiurge-sink-output"
                node.description  = "DEMIURGE Output"
                audio.rate        = 48000
                audio.position    = [ FL FR RL RR ]
                audio.channels    = 4
                node.latency      = 256/48000
                stream.dont-remix = true
                node.autoconnect    = false
                node.dont-reconnect = true
                node.linger       = true
                priority.session  = 0
            }
        }
    }

    # Virtual Source — languages receive audio from here.
    # Same 48000 pinning rationale as the sink loopback above.
    {
        name = libpipewire-module-loopback
        args = {
            audio.rate     = 48000
            audio.position = [ FL FR RL RR ]
            capture.props = {
                node.name         = "demiurge-source-input"
                node.description  = "DEMIURGE Input"
                audio.rate        = 48000
                audio.position    = [ FL FR RL RR ]
                audio.channels    = 4
                node.latency      = 256/48000
                stream.dont-remix = true
                # THE feedback entrance. This is the port pair the hardware
                # monitor and demiurge-sink's own monitor were landing on.
                node.autoconnect    = false
                node.dont-reconnect = true
                node.linger       = true
                priority.session  = 0
            }
            playback.props = {
                node.name        = "demiurge-source"
                node.description = "DEMIURGE Capture"
                media.class      = "Audio/Source"
                audio.rate       = 48000
                audio.position   = [ FL FR RL RR ]
                audio.channels   = 4
                node.latency     = 256/48000
                node.linger      = true
                priority.session = 0
            }
        }
    }
]
