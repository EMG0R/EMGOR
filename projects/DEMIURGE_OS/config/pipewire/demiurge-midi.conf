# DEMIURGE — Virtual MIDI Layer
# Creates a persistent virtual MIDI merge port.
# All physical MIDI controllers auto-link to demiurge-midi-in (Sink).
# Audio languages read MIDI from demiurge-midi (Source).
# Controllers can be hot-plugged/unplugged — virtual port always persists.

context.modules = [
    {
        name = libpipewire-module-loopback
        args = {
            capture.props = {
                node.name        = "demiurge-midi-in"
                node.description = "DEMIURGE MIDI In"
                media.class      = "Midi/Sink"
                node.linger      = true
            }
            playback.props = {
                node.name        = "demiurge-midi"
                node.description = "DEMIURGE MIDI"
                media.class      = "Midi/Source"
                node.linger      = true
            }
        }
    }
]
