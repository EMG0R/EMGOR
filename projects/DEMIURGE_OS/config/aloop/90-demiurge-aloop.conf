# DEMIURGE — WirePlumber policy for the snd-aloop virtual interface.
# Drop-in for /etc/wireplumber/wireplumber.conf.d/.
#
# This is the always-on FALLBACK CLOCK that lets the DEMIURGE sync layer run in
# real-time when NO physical interface is plugged in. The sync-layer nodes only
# advance when something clocks the graph; with no real device PipeWire would
# otherwise suspend them (pw-top shows QUANT 0, Dummy-Driver idle). The loopback
# card, simply by being present in its DEFAULT (ACP) profile, clocks the whole
# graph — verified live: demiurge nodes jump to QUANT 256 RATE 48000 Running the
# moment snd-aloop is loaded.
#
# DELIBERATELY does NOT set api.alsa.use-acp = false. The raw-PCM (use-acp=false)
# approach was tried for an abandoned DMA-latency-measurement path and it
# REGRESSED clocking — raw PCMs suspend until explicitly driven, so the graph
# stopped being clocked at idle. The default ACP profile is what we want here:
# it keeps the loopback running and clocking on its own. (Same reason the old
# api.alsa.period-size/period-num raw-PCM tuning is gone.)
#
# Priority is pinned LOWEST (priority.driver = 0, priority.session = 0) so any
# real interface always outranks the loopback as the graph driver. The aloop
# only drives the graph when it is the ONLY candidate (the 0-interface case);
# the instant a real device appears it takes over and the aloop sits idle. It is
# a pure fallback, never in the way of a real interface.
#
# THE CONTRACT, made explicit 2026-08-11: available as a fallback, PROVABLY
# INERT otherwise. Verified live with a real card attached —
#
#   priority.driver = 0        HiFiBerry (2000) wins driver election; confirmed
#                              from pw-top, the card drives and the aloop is not
#                              in any driver group.
#   pw-top state = S           suspended, not running.
#   /proc/asound/card10/pcm*   every hw_params reads "closed" — the PCM is not
#                              even open. Zero RT budget, zero interrupts.
#
# and it still does its job: switching the real card to a profile that removed
# it from the graph woke the aloop to Q=128 as driver within seconds, exactly as
# intended for the no-interface case.
#
# HOW IT GOT THIS WAY, because the fix was not in this file. The aloop was
# xrun-storming at 61/s, permanently open, and PipeWire's journal showed it
# resyncing as a follower with a 352-frame delay it could never hold. The cause
# was a hand-made link in ~/demiurge/graph.conf looping the aloop's own capture
# into its own playback — a no-op audio path that nothing listens to, but enough
# to keep the node running and make it a follower of itself. Removing that link
# took PipeWire's ALSA journal from 125 lines per 4 minutes to 1 per 90 s.
#
# So: if this node is ever seen RUNNING while a real interface is attached, look
# for a link keeping it alive before touching anything in this file. The
# stripped ring tuning documented above is NOT why it misbehaved.
#
# This is all SYNC-MODE-ONLY. In bypass mode the sync layer is off, PipeWire is
# stopped, and the launcher owns ALSA directly — this rule is dormant.
#
# Generic by design: the sync layer must never assume any particular
# audio-interface brand or model.

monitor.alsa.rules = [
    {
        matches = [
            { node.name = "~alsa_(output|input)\\..*[Ll]oop.*" }
        ]
        actions = {
            update-props = {
                audio.rate          = 48000
                audio.allowed-rates = [ 48000 ]
                node.pause-on-idle  = false
                priority.session    = 0
                priority.driver     = 0
                node.dont-reconnect = true
            }
        }
    }
]
