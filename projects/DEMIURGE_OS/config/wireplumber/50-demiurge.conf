# DEMIURGE — WirePlumber policy (drop-in for /etc/wireplumber/wireplumber.conf.d/)
#
# Goal: keep the routing picture sane for a live-audio instrument.
#
# Rules:
#  1. HDMI audio nodes exist but are DEMOTED, never disabled (changed
#     2026-08-06 — was node.disabled=true, which made HDMI output impossible
#     even when explicitly selected). zero session/driver priority + no
#     autoconnect means WirePlumber never picks HDMI as default sink, clock
#     driver, or a speculative link target; the launcher's
#     is_selectable_audio_node() predicate additionally ignores HDMI nodes
#     in aggregation/routing unless the user explicitly selected an HDMI
#     interface (or live.conf hdmi_default=on). So: no session ever
#     accidentally plays synth output through a monitor, but explicit HDMI
#     selection now works. An idle enabled node suspends after 5s
#     (session.suspend-timeout-seconds) so it burns no CPU.
#  2. DEMIURGE virtual nodes (demiurge-sink, demiurge-source) are never
#     selected as default targets by WirePlumber's default-node policy,
#     and never get auto-reconnected if a downstream link drops. The
#     launcher controls linking explicitly. Auto-selecting them as
#     defaults creates loopback cycles (gotchas.md Q5).
#
#     The combination of `priority.session = 0`, `node.dont-reconnect =
#     true` and `node.autoconnect = false` is what keeps demiurge-sink
#     pinned where the launcher expects it. Don't remove any of them: with
#     priority=0 alone, WirePlumber will happily destroy the loopback
#     when a higher-priority sink appears; with dont-reconnect alone,
#     the sink can still be promoted to default and steal stream routing
#     from the user's chain; without autoconnect=false the loopback's
#     stream ends get speculatively wired to whatever is default, which is
#     how a monitor port ended up feeding demiurge-source-input. All three
#     = a passive virtual hop that nothing competes with.
#
#     THOSE PROPERTIES ARE SET IN config/pipewire/demiurge-virtual.conf,
#     NOT IN RULE 3 BELOW. Rule 3 lives in monitor.alsa.rules and the ALSA
#     monitor never sees a loopback node, so it has never fired. See the
#     note on Rule 3.
#  3. USB audio class devices get high session priority so they are the
#     preferred default when wpctl picks one.
#  4. Bluetooth and networked audio are ignored — DEMIURGE is wired only.

wireplumber.settings = {
    # Never auto-pick DEMIURGE virtual nodes as default
    device.routes.default-sink-volume = 1.0
    node.features.audio.control-port = false
}

monitor.alsa.rules = [
    # --- Rule 0: PRO AUDIO PROFILE for the I2S HAT. ---
    #
    # THIS IS THE FIX FOR THE CAPTURE RESYNC. Everything in Rules 2c/2d below
    # about follower delay describes the problem; this rule is the answer, and
    # the two must be read together.
    #
    # The ACP `stereo-fallback` profile splits ONE duplex codec into TWO
    # independent PipeWire nodes. Nothing in that model records that the DAC
    # and the ADC are the same chip on the same crystal, so PipeWire does the
    # only safe thing it can: it makes capture a FOLLOWER of playback, targets
    # a follower delay of 1.5x quantum, and RESYNCS whenever the delay drifts
    # more than one quantum from that target. Every resync is a discontinuity.
    #
    # MEASURED on the shipped stereo-fallback config, quantum 128 (2026-08-11):
    #
    #   spa.alsa: hw:2c: follower delay:326 target:160 thr:128 resample:1, resync
    #
    #   delay ~= 130 (fixed) + ~1.5 x quantum      threshold = 2.5 x quantum
    #     quantum  64 -> resync above 160, delay ~230   fails by ~70
    #     quantum 128 -> resync above 320, delay ~326   fails by ~7
    #
    # So the shipped quantum 128 was never clean, only MARGINAL — about 1.5
    # resyncs a minute, which is exactly the intermittent crackle in normal
    # use. Arithmetic says the profile needs quantum >140 to be resync-free.
    #
    # The Pro Audio profile exposes the card's raw PCMs instead, in ONE clock
    # domain, so no follower relationship is created at all. MEASURED after
    # this rule, same hardware, 60 s of duplex streaming: ZERO resyncs, zero
    # `follower delay` lines of any kind, ERR 0 on both device nodes. The
    # fixed ~130-frame term does not shrink — it ceases to exist, because
    # nothing is being followed. This is also simply the physically correct
    # model of the hardware: one codec, one crystal, one clock domain.
    #
    # TSCHED: LEAVE IT OFF (api.alsa.disable-tsched = true, Rules 2c/2d).
    #
    # There is a long-standing note in this file that disable-tsched "STOPS
    # THIS CARD OPENING AT ALL". That result is REAL but it is ACP-SPECIFIC,
    # and carrying it over to Pro Audio cost a lot of time. Retested directly
    # on the Pro Audio profile (2026-08-11): the card opens, both PCMs report
    # `state: RUNNING`, and the graph links normally. IRQ-driven scheduling is
    # what Pro Audio is designed around, so this is the combination the
    # profile actually wants — the ACP failure was never a property of the
    # hardware.
    #
    # It is also the difference between quantum 64 working and not working,
    # and the mechanism is worth stating because it is not about xrun
    # headroom. With tsched ON, PipeWire wakes on a timer at the graph quantum
    # while the card's DMA still advances one period at a time. A quantum
    # BELOW the hardware period therefore runs the graph twice per period, and
    # the second run finds no new capture data — an underrun by construction,
    # not by overload. MEASURED at quantum 64, period-size 128, engine nowhere
    # near budget (p99 0.77, ZERO over-budget cycles) yet ~35 engine and ~8
    # per-device errors PER SECOND. Deepening the ring does not touch it
    # (period-num 8 measured: errors unchanged, engine p99 0.77 -> 0.86).
    # Switching to IRQ scheduling collapses it to essentially nothing.
    #
    # THE OTHER HALF OF IRQ MODE IS api.alsa.headroom, and on its own the
    # profile switch is NOT enough. With headroom 0 (the value the tsched-era
    # rules used, and correct there) IRQ mode leaves a residual ~0.24
    # playback errors/second that is INDEPENDENT OF QUANTUM — measured at the
    # same rate at quantum 64 and 128, which is what identifies it as a
    # wake-up margin problem rather than a buffer-depth or load problem.
    # headroom 64 removes it:
    #
    #   quantum 64, IRQ, headroom  0    device-out 30 err / 150 s
    #   quantum 64, IRQ, headroom 64    device-out  1 err / 150 s
    #
    # Note this is the PLAYBACK side. Capture headroom stays ignored by this
    # card whatever is requested (it reports 32 regardless) — see Rule 2d.
    #
    # WHY THIS MATCH AND NOT A WIDER ONE. The pattern is the same
    # platform-I2S identity Rules 2c/2d use, and carries the same two
    # exclusions for the same reasons (`_sound` excludes HDMI, `soc_` excludes
    # snd_aloop — the aloop MUST stay on its ACP profile or its node name
    # changes and 90-demiurge-aloop.conf's priority rule stops matching it,
    # which would let the fallback clock outrank a real interface).
    #
    # USB interfaces are DELIBERATELY NOT included, and this is the one place
    # the device-general instinct is wrong. ACP's mono-splitting is what
    # creates the `__Mic1__source` / `__Mic2__source` capture nodes that the
    # launcher's numbered-input path (graph::resolve_hw_input_mono, the `in1
    # ->` / `in2 ->` chain syntax) resolves against. Pro Audio removes those
    # nodes, so every numbered-input chain on a multi-input USB interface
    # would silently lose its input. A duplex USB box is also typically
    # already clock-coherent to PipeWire, so it has far less to gain. If USB
    # is ever moved over, resolve_hw_input_mono must become "channel N of the
    # capture node" IN THE SAME COMMIT.
    #
    # WHERE THIS LANDS. All 150 s windows, sync mode, engine + touch daemon +
    # web UI running, ERR read as a delta across the window (pw-top):
    #
    #   profile / mode                    q    engine  dev-out  dev-in  resync
    #   ------------------------------------------------------------------
    #   ACP stereo-fallback (WAS SHIPPED) 128     -        -       -    ~1.5/min
    #   pro-audio, tsched on              128     0        0       0      0
    #   pro-audio, tsched on               64   4279     1057    1006     0
    #   pro-audio, IRQ, headroom  0        64      0       30       0     0
    #   pro-audio, IRQ, headroom 64        64      0        1       0     0   <= SHIPPED
    #
    # Engine at the shipped point: mean 0.38, p99 0.71, max 0.77 of budget,
    # ZERO over-budget cycles. Quantum 64 = 1.33 ms, half the old latency,
    # with fewer discontinuities than the old quantum 128 had.
    #
    # Note this is an identity/topology match, not a product match — any I2S
    # audio HAT on any Pi matches it, and no card is named anywhere.
    #
    # api.alsa.use-acp = false REACHES THE SAME RAW PCMs AND IS THE WRONG WAY
    # TO GET THERE. It drops the ACP layer entirely, so the nodes are named
    # `alsa_output.platform-soc_..._sound` with NO profile suffix — and every
    # ring/priority/rate rule below, plus the generated
    # 60-demiurge-period.conf (now written to ~/.config/wireplumber/... by
    # `demiurge-quantum-limits lockstep`, 2026-10-02), matches `..._sound\\..*`, a trailing dot that is
    # then no longer there. The card would come up on PipeWire's stock ring
    # (measured on this card as period 1024 / buffer 32768) with nothing
    # reporting a problem. `device.profile = "pro-audio"` keeps the suffix
    # (`...sound.pro-output-0`, verified live in the launcher log) so every
    # pattern in this file keeps matching. Same destination, one of them silent.
    #
    # THIS RULE IS NOT SUFFICIENT ON ITS OWN, and both reasons are measured:
    #   1. It only reaches /etc when setup-demiurge.sh is re-run. On 2026-08-12
    #      the installed copy was byte-identical to commit 673d476 — four
    #      commits before this rule existed. The fix was measured, committed,
    #      and never installed, and the device had no way to say so.
    #   2. A profile set at runtime FALLS BACK. The launcher log has
    #      `clock master changed: ...pro-output-0 → ...stereo-fallback` at
    #      14:18 on 2026-08-11, and every run after it was ACP again.
    # So the launcher asserts this same profile from the running graph at every
    # start and on every device change — util::enforce_duplex_clock_domain.
    # This rule is what makes that assertion a no-op in the normal case.
    {
        matches = [ { device.name = "~alsa_card\\.platform-soc_.*_sound" } ]
        actions = {
            update-props = {
                device.profile = "pro-audio"
            }
        }
    }
    # --- Rule 0b: PIN THE I2S CARD TO ITS REAL CHANNEL COUNT (2). ---
    #
    # Rule 0 alone produces a card that is correctly clocked and completely
    # SILENT. Pro Audio does not negotiate a channel count: it opens the device
    # at the maximum the driver advertises, and the Pi's I2S controller
    # advertises 8. The DAC+ADC Pro is a 2-channel codec, so the PCM ran as
    #
    #     channels: 8      capture_AUX0 .. capture_AUX7
    #
    # with the codec filling none of the eight slots the way the node expected.
    # Capture read as EXACT DIGITAL ZEROS — 0 nonzero samples in 330752 frames,
    # on both channels, while /proc/asound reported `state: RUNNING` and the
    # links were all present and correct. (Under ACP the same idle input read a
    # -95 dBFS noise floor, which is what a live converter looks like.)
    #
    # That is a nastier failure than the resync it replaced, because every
    # indicator says healthy: profile right, one clock domain, 8 links up, both
    # PCMs RUNNING off one trigger_time, mixer untouched — and no audio.
    #
    # Pinning channels + position makes Pro Audio open the PCM the same shape
    # ACP did, so AUX0/AUX1 are the codec's actual L/R. The launcher's port
    # resolution already derives the pair generically, so nothing downstream
    # needs to know which profile produced them.
    {
        matches = [
            { node.name = "~alsa_output\\.platform-soc_.*_sound\\..*" }
            { node.name = "~alsa_input\\.platform-soc_.*_sound\\..*"  }
        ]
        actions = {
            update-props = {
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
    # --- Rule 1: demote HDMI audio (enabled, but never auto-picked) ---
    # Nodes stay alive so the launcher can route to them when the user
    # explicitly selects an HDMI interface; priorities 0 keep them out of
    # default-sink and clock-driver election, autoconnect off keeps streams
    # from landing on them speculatively, and the 5s suspend timeout parks
    # the node when nothing is linked (no idle CPU cost).
    {
        matches = [
            { node.name = "~alsa_output.*hdmi.*" }
            { node.name = "~alsa_output.*HDMI.*" }
            { node.name = "~alsa_input.*hdmi.*" }
            { node.name = "~alsa_input.*HDMI.*" }
        ]
        actions = {
            update-props = {
                priority.session    = 0
                priority.driver     = 0
                node.autoconnect    = false
                node.pause-on-idle  = true
                session.suspend-timeout-seconds = 5
            }
        }
    }
    # --- Rule 2: USB audio class devices get session priority AND are
    #            pinned to 48 kHz with no alternate rates allowed.
    #
    # Clock-driver stickiness (Phase 2 multi-interface): PipeWire's driver
    # selection uses strict `>` (not `>=`) when comparing priority.driver,
    # so among equal-priority candidates the FIRST-connected device stays
    # master when a second is plugged in. Setting explicit priority.driver =
    # 2000 for all USB outputs means: USB beats the aloop fallback (prio=0)
    # and DEMIURGE virtual nodes (prio=0), but all USB devices tie-break by
    # connection order — naturally sticky, no launcher code needed to enforce.
    #
    # Without `audio.rate` + `audio.allowed-rates`, a hot-plugged Scarlett
    # opens at whatever rate it last used (last-used persists across power
    # cycles on most class-compliant USB audio devices). On a graph that
    # was previously running at 48 kHz that triggers a graph-rate switch,
    # constant resampling, and audible artifacts that don't go away on
    # restart. Pinning here closes that hole at the source — the alsa
    # monitor opens the device at 48 kHz and refuses to negotiate down.
    #
    # Keep these two values in lockstep with default.clock.rate /
    # clock.force-rate (see 99-demiurge-lowlatency.conf and
    # demiurge.service.d/wait-pipewire.conf).
    #
    # NOTE: matching on `device.bus = "usb"` DOES NOT WORK in this context —
    # `device.bus` is only set on the Device object, not on the Node that
    # monitor.alsa.rules matches against. Using it silently produced a
    # no-match, so the Scarlett opened at its last-used native rate and
    # PipeWire resampled to 48 kHz causing audible bit-crushing at boot.
    # Instead, match on the node.name pattern — USB alsa nodes are always
    # named `alsa_output.usb-...` or `alsa_input.usb-...` which uniquely
    # distinguishes them from HDMI (`alsa_output.platform-...hdmi...`),
    # PCI (`alsa_output.pci-...`), etc.
    #
    # THE `hw_USB_*` CATCH: When WirePlumber sees a multi-channel USB input
    # device that it wants to split into per-channel mono sources (Scarlett
    # Mic1 + Mic2 are the default case), it creates an invisible PARENT
    # node named `alsa_input.hw_USB_0` that actually holds the ALSA open.
    # The per-channel `.usb-...__Mic1__source.split` children just slice
    # that parent's buffer. The parent has `api.alsa.split.parent = true`
    # and is NOT named `usb-...` — so the two patterns above miss it.
    # Without the third pattern, on cold boot the parent could open at
    # 44100 (its EnumFormat range is 44100-48000), and pipewire would
    # silently resample 44.1→48 into every split, causing exactly the
    # "bit-crushed" artifacts we were chasing that survived re-enumeration.
    {
        matches = [
            { node.name = "~alsa_output\\.usb-.*" }
            { node.name = "~alsa_input\\.usb-.*"  }
            { node.name = "~alsa_input\\.hw_.*"   }
            # Platform / I2S cards (HiFiBerry DAC+ADC Pro presents as
            # `alsa_output.platform-soc_107c000000_sound.stereo-fallback`).
            #
            # THE PATTERN IS SHAPED BY TWO EXCLUSIONS, both load-bearing:
            #   hdmi — Rule 1 above demotes it, but rules apply in order and the
            #     LAST match wins, so an unguarded `platform-.*` here would
            #     silently re-promote HDMI to priority 2000 and undo Rule 1.
            #     Requiring `_sound.` is what excludes it (HDMI nodes carry
            #     `_hdmi`).
            #   loop — snd-aloop is a platform device too
            #     (`alsa_output.platform-snd_aloop.0.analog-stereo`); it must
            #     keep the priority 0 that 90-demiurge-aloop.conf gives it so it
            #     stays the lowest-priority fallback clock. Requiring `soc_`
            #     excludes it.
            #
            # DO NOT rewrite these as a negative lookahead. `(?!...)` was tried
            # (2026-08-10) and WirePlumber's `~` matcher does not support it —
            # the pattern matched NOTHING and the card silently kept PipeWire's
            # defaults. Fails safe, but it fails. A trailing `.*` is likewise
            # required: the match is anchored, and `..._sound\\.` alone misses.
            { node.name = "~alsa_output\\.platform-soc_.*_sound\\..*" }
            { node.name = "~alsa_input\\.platform-soc_.*_sound\\..*"  }
        ]
        actions = {
            update-props = {
                priority.session    = 2000
                priority.driver     = 2000
                audio.rate          = 48000
                audio.allowed-rates = [ 48000 ]
                node.pause-on-idle  = false
                node.autoconnect    = false
            }
        }
    }
    # --- Rule 2b: USB output — minimise playback buffer depth.
    #
    # Without explicit constraints, PipeWire picks api.alsa.period-size=64
    # and api.alsa.period-num=512, giving a 32768-sample ring buffer it can
    # fill 8+ quanta deep (~21ms of output buffering at q=256).
    #
    # Fix: pin period-size to quantum (256), keep only 4 periods in the ring
    # buffer (= 1024 samples = 21.3ms max), set headroom=0 to stop extra
    # pre-fill. With isolcpus + RT priority the USB jitter is covered by
    # the two-period minimum PipeWire always maintains regardless.
    #
    # Result: playback delay ~2×256 = 512 samples = 10.7ms at 48kHz.
    #
    # BUS ASYMMETRY IS DELIBERATE — see Rule 2c. This rule stays USB-only; the
    # platform/I2S ring is tuned separately because the two buses have
    # different jitter profiles and the numbers do NOT transfer.
    {
        matches = [
            { node.name = "~alsa_output\\.usb-.*" }
        ]
        actions = {
            update-props = {
                api.alsa.headroom    = 0
                api.alsa.period-size = 256
                api.alsa.period-num  = 4
            }
        }
    }
    # --- Rule 2b(ii) / "2c": platform-I2S output — ring depth for DMA-paced
    #     cards. Kept as its OWN rule rather than widening Rule 2b's match,
    #     precisely because the USB numbers above were tuned against a USB
    #     jitter profile. A DMA-paced I2S card has no URB scheduling and no
    #     125 us microframe granularity, so it tolerates a far shallower ring.
    #     Separate rules mean tuning one bus can never perturb the other.
    #
    # Before this rule existed a platform card fell through to PipeWire's
    # defaults — measured on the HiFiBerry DAC+ADC Pro (2026-08-10) as
    # period_size 1024 / buffer_size 32768, i.e. no ring tuning at all.
    #
    # MEASURED on the HiFiBerry DAC+ADC Pro, 2026-08-10, sync mode, UI + touch
    # daemon running, >=90 s per point:
    #
    #   ring          quantum   hw per/buf    delay          worst    xruns
    #   default        128      1024/32768    208 fr 4.33ms    -        -
    #   256 x 4        128       256/ 1024    192 fr 3.99ms   5.33ms    0
    #   128 x 4         64       128/  512     93 fr 1.94ms   2.67ms    0   <= SHIPPED
    #   256 x 4         64       (csound dies — see the floor rule below)
    #    64 x 4         32       (csound dies)
    #
    # TWO SEPARATE EFFECTS, and conflating them wastes hours:
    #
    # 1. Ring depth is NOT a latency lever. At quantum 128, shrinking the ring
    #    32x (32768 -> 1024) moved delivered latency by SEVEN FRAMES. PipeWire
    #    writes the DMA ring just-in-time, so `delay` tracks ~1.5x quantum
    #    regardless of ring depth. That is the exact inverse of csound's ALSA
    #    backend in bypass, which fills its ring so the ring IS the latency
    #    (gotchas.md Q7c). Deeper ring = more xrun headroom, same latency.
    #
    # 2. period-size CONSTRAINS how low quantum can go, which is how the ring
    #    matters after all. A quantum too far below api.alsa.period-size cannot
    #    be satisfied — csound then xrun-storms and the launcher marks it dead.
    #    MEASURED: quantum 64 FAILS at period-size 256 and WORKS at 128. So
    #    lowering period-size is not about the ring; it is the prerequisite for
    #    lowering quantum, and quantum is the latency.
    #
    #    CORRECTION 2026-08-10: this used to say period-size was a hard FLOOR on
    #    quantum (q >= period-size). That is WRONG, and the rig disproves it —
    #    it has been running quantum 64 at period-size 128 with zero xruns for
    #    weeks. The relation supported by the measurements is
    #    `period-size <= 2 * quantum`, and that is what demiurge-quantum-limits
    #    enforces. Believing the floor version would make the tooling refuse the
    #    configuration this file actually ships.
    #
    # Hence period-size 128: it is what unlocks quantum 64 (1.33 ms, half of the
    # 2.67 ms at quantum 128). period-num stays at 4 for headroom.
    #
    # period-size 64 IS now reachable, but only deliberately. The old note here
    # said "DO NOT go to period-size 64" and gave two reasons; one of them was
    # wrong and worth correcting, because it hid a real capability:
    #
    #   * "quantum 32 could not keep csound alive on this patch" — CONFOUNDED.
    #     The patch was ksmps 64 at the time, so quantum 32 was impossible for a
    #     reason that had nothing to do with period-size: -b 32 is not a
    #     multiple of ksmps 64. That test says nothing about the ring.
    #   * "period-size 64 with period-num 2 (a 128-frame total ring) HARD-LOCKED
    #     the Pi, and systemd's 60 s hardware watchdog turned the lockup into a
    #     REBOOT" (gotchas.md Q7c-i) — STILL TRUE, and still the reason
    #     period-num is never allowed below 4.
    #
    # With ksmps also lowered to 32, period-size 64 x 4 ran 120 s with zero
    # xruns (see demiurge/docs/latency-measurements.md). It is NOT shipped: it
    # costs ~19 points of CPU on the RT core to buy ~1.33 ms. Change it through
    # `demiurge-audio quantum`, which lowers this in lockstep and refuses the
    # combinations that cannot work — never by hand-editing this file.
    #
    # api.alsa.disable-tsched = true: IRQ-driven scheduling, which is what the
    # Pro Audio profile is built around. See Rule 0 for why this is what makes
    # quantum 64 viable — with tsched ON, a quantum below the hardware period
    # underruns by construction rather than by overload. The "card will not
    # open with tsched off" note elsewhere in this file was measured on ACP
    # and does NOT hold on Pro Audio (retested: both PCMs reach RUNNING).
    #
    # period-num is left at 4 as a floor, but note that PipeWire recomputes
    # the ring from the hardware's own parameters in IRQ mode and reports 128
    # here — the value below is not authoritative once tsched is off. It is
    # kept because it still applies if this rule is ever run tsched-on again,
    # and because period-num must never drop below 4 (gotchas.md Q7c-i: a
    # 2-period ring hard-locked the board and the watchdog rebooted it).
    #
    # The `_sound\\..*` pattern keeps matching under Pro Audio — the node is
    # named `...sound.pro-output-0` rather than `...sound.stereo-fallback`, so
    # the ring tuning below carries over unchanged (verified: period-size 128
    # is applied to the pro-audio node).
    # clock.name IS NOT THE FIX AND IS STILL WORTH SETTING. Measured on this
    # rig: giving both platform-soc nodes the same clock name flips the journal
    # from `resample:1` to `resample:0` — the adaptive resampler between them is
    # gone — and the resync CONTINUES, because the resync is a separate
    # delay-window test that runs on any follower whether or not a resampler is
    # involved. Rule 0 is what removes the follower. This removes the resampler,
    # which is a real discontinuity source in its own right, and costs nothing:
    # under Pro Audio it is simply inert, and if the profile ever falls back to
    # ACP it is one fewer thing sitting in the capture path. The name is
    # arbitrary but must be IDENTICAL to the capture rule's (2d) — that identity
    # is the entire mechanism.
    # BOOT SEED (2026-10-02): the 128 x 4 below is only what a rig that has
    # never run `demiurge-quantum-limits lockstep` gets. Lockstep (an
    # ExecStartPre of demiurge.service) generates
    # ~/.config/wireplumber/wireplumber.conf.d/60-demiurge-period.conf from
    # live.conf `quantum =` and that user-dir file SHADOWS this /etc rule for
    # period-size/num in both directions. The old /etc copy of
    # 60-demiurge-period.conf is retired (installer removes it).
    {
        matches = [
            { node.name = "~alsa_output\\.platform-soc_.*_sound\\..*" }
        ]
        actions = {
            update-props = {
                api.alsa.headroom       = 64
                api.alsa.period-size    = 128
                api.alsa.period-num     = 4
                api.alsa.disable-tsched = true
                clock.name              = "api.alsa.platform-duplex"
            }
        }
    }
    # --- Rule 2d: CAPTURE ring — the other half of 2b/2c.
    #
    # Rules 2b and 2c above match `alsa_output.*` ONLY. For most of this
    # project's life that was invisible, because nothing was ever wired into
    # the capture side: the sync-layer input path was disconnected (csound's
    # input ports had zero links), so an untuned capture ring cost nothing and
    # nobody looked. Wiring the input up without this rule would have handed
    # the user a tuned output and a stock input.
    #
    # MEASURED on the HiFiBerry DAC+ADC Pro, 2026-08-10, with a physical
    # output->input loopback cable and testing/latency/rtdelay (per-shot
    # integer sample offsets, not buffer arithmetic):
    #
    #   capture ring        round trip (mean of 20)   sd
    #   1024 x 32 (stock)   265.4 fr   5.53 ms        4.9 fr
    #   128 x 4             see docs/latency-measurements.md
    #
    # headroom deserves its own note: PipeWire's stock capture headroom on
    # this card was 32 frames, and headroom on the CAPTURE side is pure
    # additive delay — it is how long the reader waits past the DMA pointer
    # before trusting the data. The playback rules have used headroom 0 since
    # the isolcpus/RT work made the jitter predictable; the same reasoning
    # applies here, on the same card, on the same DMA engine.
    #
    # period-size is kept EQUAL to the playback rule's, deliberately. It is a
    # floor on quantum (see Rule 2c) on the capture side too, so a capture
    # period-size larger than the playback one would silently become the
    # binding constraint on how low `quantum` can go — and it would do it
    # invisibly, because the failure mode is csound xrun-storming rather than
    # anything that names the capture device.
    #
    # WHAT ACTUALLY STOPS QUANTUM 64 ON THIS CARD IS NOT IN THIS RULE, and a
    # night was spent tuning these two numbers before anyone read PipeWire's
    # own journal (2026-08-11):
    #
    #   spa.alsa: hw:2c: follower delay:224 target:96 thr:64 resample:1, resync
    #
    # The ACP profile presents a duplex I2S card as two INDEPENDENT nodes, so
    # PipeWire cannot know the DAC and ADC share one bit/frame clock — which on
    # a DAC+ADC Pro they do. It therefore makes capture a RESAMPLING FOLLOWER of
    # playback, targets a follower delay of 1.5x quantum, and resyncs whenever
    # the delay drifts past one quantum, i.e. above 2.5x quantum. Every resync
    # is a discontinuity; it lands as an ERR on both device nodes and drags the
    # engine's client node with it.
    #
    # The capture delay on this card MEASURES ~224 frames and does not move with
    # period-size (219-240 at ps 128, 224 at ps 64). So:
    #
    #   quantum 128 -> resync above 320 frames > 224   clean
    #   quantum  64 -> resync above 160 frames < 224   permanent resync
    #
    # The shipped quantum 128 is clean because of that inequality, not because
    # of anything tuned here. Do not expect a ring change to buy quantum 64.
    #
    # TRIED AND MEASURED, so nobody repeats them:
    #   * period-size 64 x 4 (both directions) — HALVED the device errors but did
    #     not clear them, and made the ENGINE worse (p99 68% -> 88% of budget),
    #     because it doubles the card's DMA interrupt rate. Net negative.
    #   * identical `clock.name` on both platform-soc nodes — genuinely works as
    #     far as it goes: the journal flips resample:1 -> resample:0, the adaptive
    #     resampler is gone. The resync continues anyway; the delay/threshold test
    #     does not care whether resampling is on. Not sufficient alone.
    #   * `api.alsa.headroom = 0` on capture — REQUESTED AND IGNORED. The node
    #     reports headroom 32 whatever this rule says; PipeWire floors capture
    #     headroom on this device. Do not count on headroom as a lever.
    #
    # THE FULL LEVER LIST, MEASURED 2026-08-11 AT QUANTUM 64. Read this before
    # spending another night on it; every one of these was tried on the rig.
    #
    #   lever                          delay      result
    #   ---------------------------------------------------------------------
    #   (baseline, ps 128)             ~230       1.67/1.53/1.36 err/s
    #   period-size 64 x 4             ~224       halves err, engine p99 68->88%
    #   capture period-num 16          -          worse
    #   identical clock.name           ~230       resample:1 -> 0, resync stays
    #   api.alsa.headroom = 0          -          IGNORED; node still reports 32
    #   api.alsa.disable-batch = true  ~230       no effect; prop not even echoed
    #   api.alsa.disable-tsched = true  n/a       card will not open — ON ACP.
    #                                             Does NOT hold on Pro Audio;
    #                                             see Rule 0. Retested 08-11.
    #   capture as driver (prio 3000)   n/a       engine cannot run; graph dies
    #   pw data-loop off isolated core  -         worse
    #   aloop removed from graph        -         worse (and now moot, see below)
    #
    # WHY clock.name IS NOT ENOUGH, since it looks like it should be. The man
    # page is precise: "Devices with the same clock name will not use a
    # RESAMPLER to align the clocks." That is all it does. The resync is a
    # SEPARATE test — PipeWire targets a follower delay of 1.5x quantum and
    # resyncs outside +/-1 quantum — and that test runs on any follower whether
    # or not a resampler is involved. Confirmed live: the journal flips to
    # resample:0 and keeps resyncing at the same rate. So NO clock.name setting
    # can close this. The delay itself has to come down, or the node has to stop
    # being a follower.
    #
    # THE DELAY SCALES WITH QUANTUM, which the first pass got wrong by reading
    # only q=64 samples. Measured: ~230 frames at q=64, ~327 at q=128. Against a
    # 2.5x quantum resync threshold that gives 160 (fails by 70) and 320 (fails
    # by 7). So quantum 128 is MARGINAL, not clean — it resyncs a few times a
    # minute rather than continuously, which is why it reads as fine. Quantum
    # 256 is the first comfortably clean point. There is a fixed ~120-frame term
    # in that delay that no ring or headroom setting reached.
    #
    # PRO AUDIO: DONE — this is what Rule 0 at the top of this file now does,
    # and everything above from "WHAT ACTUALLY STOPS QUANTUM 64" onward is the
    # record of the problem it solved, kept because the levers it rules out
    # are all still worth not re-trying. Result: zero resyncs, at every
    # quantum. Read Rule 0 for the measurements.
    #
    # What the switch actually cost, since the earlier estimate here was too
    # pessimistic in one direction and too optimistic in another:
    #
    #   NOT a problem. The interface RESOLVER (util::resolve_interface,
    #   demiurge-interface, all three UIs) reads `aplay -l` CARD names, never
    #   PipeWire node names, so the card is still "HiFiBerry DAC+ADC Pro"
    #   everywhere a human sees it and selection is completely unaffected.
    #   util::is_selectable_audio_node also needed nothing: it keys on the
    #   `alsa_output.`/`alsa_input.` prefix plus the aloop and HDMI
    #   exclusions, all of which survive the rename to `...pro-output-0`.
    #   (The old note here assumed the resolver matched product names against
    #   node names. It does not, and never did.)
    #
    #   THE actual problem. The PORTS become `playback_AUX0..7` /
    #   `capture_AUX0..7`; there is no playback_FL/FR. pw-link fails SILENTLY
    #   on a port that does not exist, so every hardcoded FL/FR name produced
    #   an unlinked graph with no error anywhere — dead air with every service
    #   reporting healthy. Fixed generically rather than by adding AUX to a
    #   name table: util::device_port_pair derives the stereo pair from the
    #   ports a device actually has (front pair if it declares one, else the
    #   first two in device channel order, else a lone mono port for both
    #   sides), and aggregate's enumerators now match on port DIRECTION
    #   ("playback_"/"capture_") instead of on the literal name playback_FL.
    #   A card with some third naming scheme now needs no code change.
    # BOOT SEED (2026-10-02): the 128 x 4 below is only what a rig that has
    # never run `demiurge-quantum-limits lockstep` gets. Lockstep (an
    # ExecStartPre of demiurge.service) generates
    # ~/.config/wireplumber/wireplumber.conf.d/60-demiurge-period.conf from
    # live.conf `quantum =` and that user-dir file SHADOWS this /etc rule for
    # period-size/num in both directions. The old /etc copy of
    # 60-demiurge-period.conf is retired (installer removes it).
    {
        matches = [
            { node.name = "~alsa_input\\.platform-soc_.*_sound\\..*" }
        ]
        actions = {
            update-props = {
                api.alsa.headroom       = 64
                api.alsa.period-size    = 128
                api.alsa.period-num     = 4
                api.alsa.disable-tsched = true
                # IDENTICAL to Rule 2c's, deliberately — see the note there.
                # One codec, one crystal, one clock name. Changing one of these
                # two strings without the other silently re-arms the resampler.
                clock.name              = "api.alsa.platform-duplex"
            }
        }
    }
    # --- Rule 2e: USB capture ring — same fix, USB bus.
    #
    # Split from 2d for exactly the reason 2c is split from 2b: the two buses
    # have different jitter profiles and the numbers do not transfer. USB keeps
    # the 256 period-size its playback rule uses.
    {
        matches = [
            { node.name = "~alsa_input\\.usb-.*" }
        ]
        actions = {
            update-props = {
                api.alsa.headroom    = 0
                api.alsa.period-size = 256
                api.alsa.period-num  = 4
            }
        }
    }
    # --- Rule 3: DEMIURGE virtual nodes are never defaults ---
    #
    # READ THIS BEFORE RELYING ON IT: this rule does nothing. It sits inside
    # `monitor.alsa.rules`, which WirePlumber's ALSA monitor applies only to
    # nodes the ALSA monitor creates. demiurge-sink / demiurge-source and their
    # stream ends are created by module-loopback out of
    # config/pipewire/demiurge-virtual.conf and the ALSA monitor never sees
    # them, so these four matches have never fired.
    #
    # The properties are REAL and load-bearing; the authority for them is
    # demiurge-virtual.conf, which sets priority.session, node.dont-reconnect
    # and node.autoconnect directly as module args — the one place that cannot
    # miss, because the node does not exist without it. The header note at the
    # top of this file claiming this rule is "the *only* thing keeping
    # demiurge-sink pinned" is wrong; it was always the module args.
    #
    # Kept rather than deleted because it is harmless and because a future
    # WirePlumber that grows a general node-rules hook would want exactly these
    # four matches. Do not add anything here expecting it to take effect —
    # verify against the running node with `pw-cli info <id>` first.
    {
        matches = [
            { node.name = "demiurge-sink"        }
            { node.name = "demiurge-source"      }
            { node.name = "demiurge-sink-output" }
            { node.name = "demiurge-source-input"}
        ]
        actions = {
            update-props = {
                priority.session = 0
                priority.driver  = 0
                node.autoconnect = false
                node.dont-reconnect = true
            }
        }
    }
]

# Ignore Bluetooth audio entirely — DEMIURGE is a wired instrument.
monitor.bluez.rules = [
    {
        matches = [ { device.api = "bluez5" } ]
        actions = {
            update-props = {
                device.disabled = true
                node.disabled   = true
            }
        }
    }
]
