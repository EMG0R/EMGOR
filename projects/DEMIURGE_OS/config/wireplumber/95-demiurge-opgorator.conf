# DEMIURGE — WirePlumber policy for the Pocket OpGorator (Daisy Seed USB
# capture device). Drop-in for /etc/wireplumber/wireplumber.conf.d/.
#
# See docs/superpowers/specs/2026-07-29-pocket-opgorator-integration-design.md
# §3 for the full integration. Summary: the OpGorator is a capture-only USB
# audio class device (no playback interface — firmware-side hard requirement,
# see the design doc's Phase-C section) that DEMIURGE wires into the graph
# via the explicit `opgorator` chain token (see live.rs), NOT the generic
# USB auto-bridge (aggregate.rs excludes it by name on purpose).
#
# Priority is pinned LOWEST (priority.driver = 0, priority.session = 0) —
# it must never be elected graph clock driver. Rule 2 in 50-demiurge.conf
# already gives every `alsa_input.usb-*` node priority.driver = 2000; this
# file is numbered to load AFTER 50-demiurge.conf (alphabetical conf.d
# ordering) so its update-props for this specific device win and override
# that generic USB priority back down to 0 — same pattern as
# 90-demiurge-aloop.conf for the loopback fallback clock.
#
# Rate is 48 kHz fixed in firmware (no alternate rate negotiation), so
# audio.allowed-rates just documents/enforces what the device already does —
# this closes the same "opens at last-used rate" hole described in
# 50-demiurge.conf's Rule 2 for other USB devices.
#
# Matches on `OpGorator` (product string "Pocket OpGorator") with `Daisy` /
# `Daisy_Seed` as fallback patterns in case a given DaisyDuino build's USB
# descriptor doesn't carry the OpGorator-specific string yet.

monitor.alsa.rules = [
    {
        matches = [
            { node.name = "~alsa_input\\..*OpGorator.*"   }
            { node.name = "~alsa_input\\..*Daisy_Seed.*"  }
            { node.name = "~alsa_input\\..*Daisy.*"       }
        ]
        actions = {
            update-props = {
                audio.rate          = 48000
                audio.allowed-rates = [ 48000 ]
                priority.session    = 0
                priority.driver     = 0
                node.pause-on-idle  = false
            }
        }
    }
]
