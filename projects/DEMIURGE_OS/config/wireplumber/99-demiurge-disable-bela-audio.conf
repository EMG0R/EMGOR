# 99-demiurge-disable-bela-audio.conf — hide the Bela's USB AUDIO card.
#
# WHY (2026-09-25): the hyperGuitar's Bela enumerates on the Pi as a composite
# USB gadget: network (the OSC/telemetry link), CDC serial, AND a full-speed
# 44.1 kHz audio card. Its audio bridge is masked on the Bela side, so that
# card is dead air in both directions — but the launcher still counted it as
# a second wired output. With TWO outputs direct mode is off, so the chain
# ran csound(128) -> demiurge-sink loopback (node.latency 256) -> DAC(128):
# a standing 128<->256 conversion through the loopback whose follower-delay
# resyncs click with NO xrun and NO CPU load — the "IR crackle" that survived
# three different IR implementations. Disabling the card leaves exactly one
# wired output, direct mode engages, and the loopback leaves the audio path.
# The USB network and serial functions are not ALSA devices and are unaffected.
monitor.alsa.rules = [
    {
        matches = [ { device.name = "~alsa_card\\.usb-Augmented_Instruments_Ltd_Bela.*" } ]
        actions = {
            update-props = {
                device.disabled = true
            }
        }
    }
]
