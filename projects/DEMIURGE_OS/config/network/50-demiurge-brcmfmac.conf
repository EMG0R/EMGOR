# DEMIURGE — brcmfmac driver workaround
# Install to: /etc/modprobe.d/50-demiurge-brcmfmac.conf
# Requires a REBOOT to take effect (module parameter, not runtime-settable).
#
# This is a documented Raspberry Pi 5 + Debian Trixie driver bug, not a
# NetworkManager or demiurge-wifi config problem — see
# https://forums.raspberrypi.com/viewtopic.php?t=374223 and
# https://github.com/raspberrypi/linux/issues/6049 for the same symptoms
# reported independently by many other users:
#
#   - "Activation: (wifi) association took too long" repeatedly, especially
#     joining a network OTHER than whichever one is already associated
#   - dmesg: "brcmfmac: brcmf_set_channel: set chanspec ... fail, reason -52"
#
# feature_disable=0x2000 turns off the specific brcmfmac firmware feature
# that causes the channel-set failure during association to a new AP. This
# is separate from (and stacks with) roamoff=1, which Raspberry Pi OS
# already ships by default in /lib/modprobe.d/rpi-brcmfmac.conf.
options brcmfmac feature_disable=0x2000
