# DEMIURGE — NetworkManager defaults
# Install to: /etc/NetworkManager/conf.d/10-demiurge-network.conf
#
# These are DEFAULTS, not overrides: NetworkManager applies a value from here
# only when the individual profile does not set that property itself. So a
# profile created by `demiurge-wifi` keeps its own explicit settings, and
# everything else — including profiles created ad-hoc with
# `nmcli dev wifi connect` — inherits sane behaviour without anyone having to
# remember the flags.
#
# Reload with: sudo nmcli general reload conf

[connection]
# Wifi power-save parks the radio between beacons. It is worth real milliwatts
# and costs reliability: latency spikes, missed beacons, and on this chip
# outright association loss. This box is mains-powered and runs a realtime
# audio engine — 2 = disable, everywhere, by default.
wifi.powersave=2

# Randomised MACs break DHCP reservations and any router-side static lease or
# firewall rule, and make the box show up as a new client on every join —
# which is exactly how you lose a stable address. Always present the real
# hardware address.
wifi.cloned-mac-address=permanent
ethernet.cloned-mac-address=permanent

# NetworkManager's stock default (4) gives up on a profile after a short
# burst of association failures — an AP reboot, a channel change, a few
# seconds of interference — and won't try again until something external
# pokes it. That turns a 30-second router blip into an indefinite outage
# that looks like the Pi died. So this is raised, not left at the stock
# value — but NOT set to 0 (retry forever) anymore: with a profile that is
# genuinely broken (wrong password, AP that will never accept it), infinite
# retries means NM never stops disconnecting the working link to go try the
# dead one again, on a loop, forever — self-inflicted flapping that looked
# exactly like a hardware fault on 2026-08-15 (see network-fixes-2026-08-15
# notes). 20 retries with NM's own backoff covers a real blip generously
# (minutes, not seconds) while still actually giving up on a dead profile.
connection.autoconnect-retries=20

[connection-ethernet]
match-device=type:ethernet
# Ethernet must win the default route whenever the cable is in. Lower metric
# wins; wifi sits at 600 below, so plugging in silently takes over and
# unplugging silently falls back, with no interface fighting.
ipv4.route-metric=100
ipv6.route-metric=100

[connection-wifi]
match-device=type:wifi
ipv4.route-metric=600
ipv6.route-metric=600

[device-wifi]
match-device=type:wifi
# Randomising the MAC used for *scanning* makes some APs (and the GL-iNet's
# client tracking) treat every scan as a new device. Harmless to disable on a
# fixed studio box, and one less source of odd AP-side behaviour.
wifi.scan-rand-mac-address=no
