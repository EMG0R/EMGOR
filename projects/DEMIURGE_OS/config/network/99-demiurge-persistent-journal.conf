# DEMIURGE — persistent journal
# Install to: /etc/systemd/journald.conf.d/99-demiurge-persistent-journal.conf
#
# WHY THIS EXISTS: this box was losing the network several times a night and
# the post-mortem was impossible — `journalctl -b -1` had nothing, because the
# journal was volatile (living in /run) and every reboot wiped the evidence.
# A network fault you cannot see the logs for is a fault you cannot fix.
#
# THE 99- PREFIX IS LOAD-BEARING. Raspberry Pi OS ships
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf, which sets
# Storage=volatile. systemd merges drop-ins from /etc and /usr into one list
# sorted by FILENAME — /etc only beats /usr for the *same* filename — so a
# 10-* file in /etc loses to the vendor's 40-*. Anything sorting after 40
# wins. Do not renumber this file down.
#
# Storage=persistent forces /var/log/journal even if the directory is missing
# (journald creates it), rather than Storage=auto's "only if it already
# exists" behaviour.
#
# The caps keep it honest on an SD card: 200M total, 20M per file, and a hard
# 1-month retention so it can never grow unbounded on a box that runs for
# weeks. Compress is on by default; SyncIntervalSec is left at the default
# because forcing frequent fsyncs on SD is worse than losing the last few
# seconds of log on a hard crash.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=200M
SystemMaxFileSize=20M
MaxRetentionSec=1month
