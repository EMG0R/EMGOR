<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>nonlinear daylight</title>
<!--
  The ONE shared UI for every hello_<lang> nonlinear-daylight example.
  Served by demiurge_web.py at /examples/nonlinear_daylight.html?stage=<lang>
  (csound | chuck | pd | sc | faust | strudel). Same three parameters in every
  language: /nld-<lang>/density, /tone, /length (floats 0..1).
  Two-way: sliders write via POST /api/pool/set; the page follows every
  /param echo from GET /api/pool/events (engine /pout -> pool -> here).
-->
<style>
:root{--bg:#0b0613;--card:#150c24;--line:#2a1646;--ink:#efe6ff;--dim:#8d78b3;--v:#9b5cff;--v2:#d08cff;--bad:#ff6b8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.3 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:6px 0 2px;letter-spacing:.04em}
.sub{color:var(--dim);font-size:13px;margin-bottom:14px}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.langs a{padding:8px 12px;border:1px solid var(--line);border-radius:10px;color:var(--dim);text-decoration:none;font-size:14px}
.langs a.on{background:var(--v);border-color:var(--v);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.row b{font-weight:600}.row small{color:var(--dim)}
.val{font-variant-numeric:tabular-nums;color:var(--v2)}
canvas{width:100%;height:44px;display:block;touch-action:none}
#msg{color:var(--dim);font-size:13px;min-height:1.3em}#msg.bad{color:var(--bad)}
</style></head><body><main>
<h1>nonlinear daylight</h1>
<div class="sub">one UI, every language. <span id="lock"></span></div>
<div class="langs" id="langs"></div>
<div id="sliders"></div>
<div id="msg"></div>
<script>
const LANGS = ["csound","chuck","pd","sc","faust","strudel"];
const NAMES = {density:["Density","event rate"], tone:["Tone","brightness"], length:["Length","note length"]};
const q = new URLSearchParams(location.search);
let lang = (q.get("stage") || "csound").replace(/^nld-/, "");
if (lang === "supercollider") lang = "sc";
if (!LANGS.includes(lang)) lang = "csound";
const stage = "nld-" + lang;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);
const st = {};   // name -> {v, echo, cv, drag}
let pending = null, timer = null;

$("langs").innerHTML = LANGS.map(l => `<a href="?stage=${l}" class="${l===lang?"on":""}">${l}</a>`).join("");

function msg(t, bad){ $("msg").textContent = t; $("msg").className = bad ? "bad" : ""; }

function draw(name){
  const s = st[name], cv = s.cv, dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const pad = 14, y = h/2, x = v => pad + v*(w-2*pad);
  g.lineCap = "round"; g.lineWidth = 8;
  g.strokeStyle = css("--line"); g.beginPath(); g.moveTo(x(0),y); g.lineTo(x(1),y); g.stroke();
  g.strokeStyle = css("--v"); g.beginPath(); g.moveTo(x(0),y); g.lineTo(x(s.v),y); g.stroke();
  g.fillStyle = css("--ink"); g.beginPath(); g.arc(x(s.v),y,11,0,6.2832); g.fill();
  if (s.echo != null){ g.strokeStyle = css("--v2"); g.lineWidth = 2; g.beginPath(); g.arc(x(s.echo),y,16,0,6.2832); g.stroke(); }
  s.val.textContent = s.v.toFixed(2) + (s.echo != null ? "  echo " + s.echo.toFixed(2) : "  echo -");
}

function send(path, v){
  pending = [path, v];
  if (timer) return;
  timer = setTimeout(async () => {   // coalesce to ~20 Hz
    const [p, val] = pending; pending = null; timer = null;
    try {
      const r = await fetch("/api/pool/set", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({path:p, value:val})});
      if (!r.ok) throw new Error("HTTP " + r.status);
      msg("");
    } catch(e){ msg("POST /api/pool/set failed: " + e.message, true); }
    if (pending) { const [pp, vv] = pending; pending = null; send(pp, vv); }
  }, 50);
}

function build(){
  const box = $("sliders");
  for (const name of Object.keys(NAMES)){
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML = `<div class="row"><span><b>${NAMES[name][0]}</b> <small>${NAMES[name][1]}</small></span><span class="val"></span></div><canvas></canvas>`;
    box.appendChild(card);
    const s = st[name] = {v:0.5, echo:null, cv:card.querySelector("canvas"), val:card.querySelector(".val"), path:`/${stage}/${name}`, hard:false};
    const set = ev => {
      const r = s.cv.getBoundingClientRect(), pad = 14;
      s.v = Math.max(0, Math.min(1, (ev.clientX - r.left - pad)/(r.width - 2*pad)));
      draw(name); send(s.path, s.v);
    };
    s.cv.addEventListener("pointerdown", e => { s.cv.setPointerCapture(e.pointerId); s.drag = true; set(e); });
    s.cv.addEventListener("pointermove", e => { if (s.drag) set(e); });
    const up = () => { s.drag = false; };
    s.cv.addEventListener("pointerup", up); s.cv.addEventListener("pointercancel", up);
    draw(name);
  }
  addEventListener("resize", () => Object.keys(st).forEach(draw));
}

async function init(){
  build();
  try {
    const d = await (await fetch("/api/pool/params")).json();
    const by = Object.fromEntries((d.params||[]).map(p => [p.path, p]));
    let found = 0, hard = 0;
    for (const n of Object.keys(st)){
      const p = by[st[n].path]; if (!p) continue;
      found++; if (p.map === "hard") hard++;
      if (typeof p.value === "number") st[n].v = p.value;
      draw(n);
    }
    $("lock").textContent = found ? (hard === found ? "mapping: hard (locked by the instrument)" : "") : "";
    if (!found) msg("no /" + stage + "/* in the registry yet: copy hello_" + (lang==="sc"?"supercollider":lang) + "/params/" + stage + ".json to ~/demiurge/params/", true);
  } catch(e){ msg("GET /api/pool/params failed: " + e.message, true); }
  const es = new EventSource("/api/pool/events");
  es.onmessage = m => {
    let e; try { e = JSON.parse(m.data); } catch(_) { return; }
    for (const n of Object.keys(st)) if (st[n].path === e.path){
      st[n].echo = e.value;
      if (!st[n].drag) st[n].v = e.value;     // two-way: engine moves the slider
      draw(n);
    }
  };
}
init();
</script></main></body></html>
