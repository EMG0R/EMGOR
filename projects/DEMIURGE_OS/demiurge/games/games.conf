# games.conf — Demiurge arcade console config.
#
# Same `key = value` / #-comment format as ~/demiurge/live.conf on purpose, so
# these keys fold straight into live.conf later. For now the arcade console
# keeps its own self-contained config here in the games folder.
#
# Read by arcade_supervisor.py. Change + restart the supervisor to apply.

# Master on/off for the arcade launcher. off = supervisor still runs the synth
# MIDI bridge, but the launch CODES below will NOT open any game.
enabled = on

# Teensy serial port (same one serial_bridge.py uses). The supervisor REPLACES
# serial_bridge.py as the owner of this port.
serial_port = /dev/serial/by-id/usb-Teensyduino_Teensy_MIDI_19910760-if00

# --- launch CODES: each game opens via a button sequence (always listening:
# from synth it opens, from inside a game it switches) ---
# Konami-code style: ARCADE between each of 3 face buttons. 7 presses total.
# Tokens: ARCADE(b1) A(b9) B(b8) X(b6) Y(b7). See docs/BUTTONS.md.
# Format:  label | rom-filename (in roms/) | CODE [ | full-core-path ]
# 4th field = core override (else default_core / FBNeo). Each code's 3 middle
# buttons are unique so no two games collide.
games =
  galaga    | galaga.zip    | ARCADE,Y,ARCADE,X,ARCADE,A,ARCADE
  digdug    | digdug.zip    | ARCADE,Y,ARCADE,B,ARCADE,A,ARCADE
  mspacman  | mspacman.zip  | ARCADE,B,ARCADE,Y,ARCADE,X,ARCADE
  spyhunt   | spyhunt.zip   | ARCADE,B,ARCADE,A,ARCADE,X,ARCADE
  sf        | sf.zip        | ARCADE,A,ARCADE,Y,ARCADE,B,ARCADE
  centiped  | centiped.zip  | ARCADE,X,ARCADE,Y,ARCADE,A,ARCADE
  digdug2   | digdug2.zip   | ARCADE,X,ARCADE,B,ARCADE,Y,ARCADE
# Game & Watch (gnw_*) removed 2026-06-23 — they're real dual-screen handhelds,
# not arcade machines; user wants arcade versions only. Artwork/cores remain on
# the Pi but no launch code, so they're not in the lineup.

# --- continue / credits ---
# Games with native infinite-lives cheats (FBNeo .opt): galaga mspacman sf
# Games listed here get a burst of autocoin_burst coins inserted on launch
# (after autocoin_delay_ms ms) so they have plenty of credits without needing
# a free-play DIP. Galaga is NOT listed here — it uses the FBNeo cheat instead.
autocoin_games = galaga digdug digdug2 centiped spyhunt
autocoin_burst = 50
autocoin_delay_ms = 5000

# Max gap between presses in a code before it resets (ms).
code_gap_ms = 2500
# In a game, hold the joystick click (jb) this long to EXIT back to synth (ms).
exit_hold_ms = 1500

# (legacy) hold time for the old single hold-combo — unused by the code launcher.
combo_hold_ms = 1000

# On console open: SIGSTOP demiurge.service so the synth audio freezes in place
# and resumes on the EXACT sample on close (true pause). The face UI is handled
# separately by the supervisor (bin/ui-release / ui-restore) — it must be STOPPED,
# not frozen, because it holds DRM master and a frozen UI keeps the screen.
# off = leave the synth running (and don't freeze on console open).
freeze_synth = on

# RetroArch audio driver. pipewire = ride the Demiurge sync layer (a node), which
# is the integrated path. Requires `sync_layer = on` in live.conf for game audio
# to reach the Scarlett while the synth chain is frozen.
audio_driver = pipewire

# Boot STRAIGHT into a ROM on combo (no menu) when default_game + default_core are
# both set. Filename is under games/roms/. Leave default_game empty to land in the
# RGUI menu instead.
default_game = galaga.zip
default_core = /home/gorpi7/.config/retroarch/cores/fbneo_libretro.so

# Master game volume (0-100), applied to RetroArch.
volume = 80

# Joystick digital threshold (12-bit). |reading - 2048| past this = a direction.
joy_deadzone = 900

# Rotate the joystick directions (degrees clockwise) to line up with the rotated
# portrait screen. 0/90/180/270. Pair with retroarch.cfg `video_rotation`. If the
# stick feels rotated (e.g. right moves the cursor up), bump this by 90.
joy_rotation = 90

# Reflections applied AFTER rotation, to fix a pure up/down or left/right swap
# (which rotation alone can't do). on/off. CLI: `demgames inverty on|off`.
joy_invert_x = off
joy_invert_y = on
