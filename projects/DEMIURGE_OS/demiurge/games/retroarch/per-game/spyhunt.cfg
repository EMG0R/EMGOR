# spyhunt.cfg — Spy Hunter (FBNeo) per-game override.
# Loaded by the supervisor via:
#   retroarch --appendconfig demiurge/games/per-game/spyhunt.cfg
# (only when this file exists). Everything here is appended AFTER retroarch.cfg,
# so these keys WIN. Keep it to Spy-Hunter-specific input so the car DRIVES and
# every weapon is reachable from the cabinet.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
# Spy Hunter is a DRIVING game. The original arcade had a steering yoke, a single
# GAS PEDAL, a lo/hi gear shifter, and weapon buttons. With FBNeo's default
# RetroPad layout the ACCELERATE input lands on RetroPad **B**, which on this
# cabinet is keyboard "z" = device button b8 (also fired by the arcade button b1,
# which sends A+B+Y). Before this file there was "no way to start driving" only
# because nobody knew which button was gas — it WAS reachable, just unlabeled.
# This file locks the mapping so it can never drift, and documents it.
#
# ---------------------------------------------------------------------------
# SOURCE OF TRUTH (verbatim from FBNeo: src/burn/drv/pre90s/d_mcr3.cpp)
# ---------------------------------------------------------------------------
#   SpyhuntInputList[]  (digital game inputs, in FBNeo "p1 ..." terms):
#     "p1 fire 1" = P1 Accelerator   (analog in arcade; digital button here)
#     "p1 fire 2" = Gear Shift       (lo/hi toggle)
#     "p1 fire 3" = Missiles
#     "p1 fire 4" = Oil Slick
#     "p1 fire 5" = Smoke Screen
#     "p1 fire 6" = Machine Gun
#     "p1 start"  = Weapons Van       (also calls the weapons van truck in-zone)
#     "p1 coin"   = Coin
#     "p1 x-axis" = Wheel / Steering  (BIT_ANALOG_REL, clamp 0x34..0xb4)
#
# FBNeo's libretro core maps the generic "p1 fire 1..6" to RetroPad B,A,Y,X,L,R
# (in that order). So the RetroPad layout for Spy Hunter is:
#     B     = Accelerate   (fire 1)
#     A     = Gear Shift   (fire 2)
#     Y     = Missiles     (fire 3)
#     X     = Oil Slick    (fire 4)
#     L     = Smoke Screen (fire 5)
#     R     = Machine Gun  (fire 6)
#     Start = Weapons Van / Start
#     Select= Coin
#     D-pad L/R = Steer
#
# ---------------------------------------------------------------------------
# CABINET CHAIN  (device button -> RetroPad -> keyboard, per retroarch.cfg)
# ---------------------------------------------------------------------------
#   b8  -> B  (z)          = ACCELERATE   <-- the gas pedal
#   b1  -> A+B+Y (arcade)  = also accelerates (+ gear + missiles): broad "go/fire"
#   b9  -> A  (x)          = GEAR SHIFT (tap to toggle lo/hi)
#   b7  -> Y  (s)          = MISSILES
#   b6  -> X  (a)          = OIL SLICK
#   b4  -> L  ([)          = SMOKE SCREEN
#   b2  -> R  (])          = MACHINE GUN
#   b3  -> Start (enter)   = WEAPONS VAN / START
#   b5  -> Select (rshift) = COIN (insert credit)
#   joystick L/R           = STEER
#
# ---------------------------------------------------------------------------
# DEVICE TYPE
# ---------------------------------------------------------------------------
# Standard RetroPad (device id 1). The FBNeo core feeds the RetroPad D-pad
# Left/Right into Spy Hunter's analog "p1 x-axis" wheel automatically, so the
# joystick steers without needing a physical analog stick. Do NOT switch this to
# an analog/paddle device type or the d-pad steering breaks.
input_libretro_device_p1 = "1"

# ---------------------------------------------------------------------------
# EXPLICIT PLAYER-1 BINDS (locked; identical to globals, restated so they can't
# drift and so the keyboard->RetroPad chain is unambiguous for Spy Hunter)
# ---------------------------------------------------------------------------
input_player1_up    = "up"
input_player1_down  = "down"
input_player1_left  = "left"      # steer left
input_player1_right = "right"     # steer right
input_player1_a     = "x"         # GEAR SHIFT  (fire 2)
input_player1_b     = "z"         # ACCELERATE  (fire 1)  <-- gas pedal
input_player1_y     = "s"         # MISSILES    (fire 3)
input_player1_x     = "a"         # OIL SLICK   (fire 4)
input_player1_l     = "leftbracket"   # SMOKE SCREEN (fire 5)
input_player1_r     = "rightbracket"  # MACHINE GUN  (fire 6)
input_player1_start = "enter"     # WEAPONS VAN / START
input_player1_select= "rshift"    # COIN

# ---------------------------------------------------------------------------
# RUNAHEAD: drop to 1 frame for this driving game. 2 frames of re-sim can make a
# fast-scrolling racer feel jittery on steering; 1 is the safe sweet spot here.
# (Global default is 2; this overrides it just for Spy Hunter.)
run_ahead_frames = "1"
