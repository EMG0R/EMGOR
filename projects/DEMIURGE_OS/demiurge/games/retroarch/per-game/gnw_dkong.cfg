# gnw_dkong.cfg — per-game override for Game & Watch: Donkey Kong (DK-52).
# Layered on top of retroarch/retroarch.cfg via the supervisor's
# `--appendconfig`. Only KEYS THAT DIFFER from the base config belong here.
#
# This is a HANDHELD, not a coin-op: there are no coins/credits. You START with
# GAME A (or GAME B) and PLAY with left/right + the JUMP button.
#
# How the MAME core (mame_libretro.so) maps this machine onto the RetroPad
# (default MAME RetroPad layout — see gnw_dkong.NOTES.md for the full story):
#   RetroPad START  -> "Game A"  (MAME IPT_START1)
#   RetroPad A      -> "Jump"    (MAME IPT_BUTTON1)
#   RetroPad D-pad  -> Left/Right move (MAME IPT_JOYSTICK_*)
#   RetroPad SELECT -> MAME "Coin" — UNUSED by this driver (no coin input)
#   "Game B"=IPT_START2, "Time"=IPT_SELECT, "Alarm"=IPT_SERVICE2,
#   "ACL"=IPT_SERVICE1 are NOT on a default RetroPad button (reach via TAB OSD).
#
# The cabinet input chain is FIXED in lib/gamepad.py: each physical button emits
# a fixed keyboard key, and retroarch.cfg binds each key to a RetroPad button.
# We only re-route those key->RetroPad bindings here. Resulting device map:
#   b3 (Start btn, left cluster) = enter  -> RetroPad START  = GAME A  (START)
#   b1 ARCADE / b9 (A)           = x      -> RetroPad A      = JUMP
#   joystick left/right                   -> RetroPad d-pad  = MOVE
#   b5 (Select btn, left cluster)= rshift -> RetroPad SELECT (unused here)
# These already match the base config, so the binds below are explicit for
# clarity/self-documentation; they don't change behaviour vs. the base.

# Single-player handheld.
input_max_users = "1"

# RetroPad (libretro device type 1) — the MAME core's default RetroPad layout
# is exactly what we want (Start=Game A, A=Jump, d-pad=move).
input_libretro_device_p1 = "1"

# --- device-button -> RetroPad binds (keyboard keys emitted by gamepad.py) ---
# MOVE: joystick -> d-pad left/right (up/down unused by this game).
input_player1_left  = "left"
input_player1_right = "right"
input_player1_up    = "up"
input_player1_down  = "down"
# JUMP: ARCADE(b1) and the A face button(b9) both emit "x" -> RetroPad A.
input_player1_a = "x"
# START = GAME A: the Start button (b3) emits "enter" -> RetroPad START.
input_player1_start = "enter"
# SELECT: the Select button (b5) emits "rshift" -> RetroPad SELECT. Maps to
# MAME "Coin", which this handheld ignores; harmless. (GAME B / Time / Alarm /
# ACL are reached via the MAME TAB menu — see the NOTES file.)
input_player1_select = "rshift"

# --- classic Game & Watch LCD look (shader) ---
# This is a dual-LCD handheld; the MAME core picks the "Unit Only" artwork view
# (the clean clamshell device silhouette, both LCD panels) via the per-machine
# MAME cfg (~/demiurge/games/saves/MAME/mame/cfg/gnw_dkong.cfg <video> target),
# enabled by mame_read_config in MAME.opt. The lcd1x GLSL shader gives the crisp
# dot-matrix LCD grid so it reads as a classic Game & Watch, not raw DS pixels.
# GLSL (not slang) because the Pi RetroArch uses the gl video driver. Per-game
# only — never forced globally onto the FBNeo arcade games.
video_shader_enable = "true"
video_shader = "/home/gorpi7/.config/retroarch/shaders/handheld/lcd1x.glslp"
