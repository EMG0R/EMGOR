# ============================================================================
# Per-game RetroArch override for STREET FIGHTER  (rom: sf.zip, core: FBNeo)
# Loaded via:  --appendconfig demiurge/games/retroarch/per-game/sf.cfg
# Do NOT edit the global retroarch.cfg; this file only patches player 1 input.
# ============================================================================
#
# GAME: "Street Fighter (World, Analog buttons)" -- the original 1987 SF.
# In FBNeo the parent `sf` set exposes a full 6-ATTACK-BUTTON layout
# (3 punches + 3 kicks), identical in spirit to Street Fighter II:
#
#        Top row  (Punches):   Jab(LP)   Strong(MP)   Fierce(HP)
#        Bottom row (Kicks):   Short(LK)  Forward(MK)  Roundhouse(HK)
#
# FBNeo's "Classic" 6-button RetroPad preset maps those six game buttons to
# RetroPad   Y  X  L  /  B  A  R   in this order:
#
#   RetroPad Y -> Light  Punch (Jab)
#   RetroPad X -> Medium Punch (Strong)
#   RetroPad L -> Heavy  Punch (Fierce)
#   RetroPad B -> Light  Kick  (Short)
#   RetroPad A -> Medium Kick  (Forward)
#   RetroPad R -> Heavy  Kick  (Roundhouse)
#
# Device-type 1 ("RetroPad with 6 buttons - Classic", value 769 in FBNeo)
# tells the core to present all six attack buttons on Y/X/L/B/A/R.
# ----------------------------------------------------------------------------

# Force the FBNeo 6-button "Classic" pad preset for player 1.
input_libretro_device_p1 = "769"

# ----------------------------------------------------------------------------
# CABINET KEYBOARD -> RETROPAD chain (for reference; bound globally):
#   keyboard x -> A , z -> B , a -> X , s -> Y ,
#   [ -> L , ] -> R , enter -> Start , rshift -> Select/Coin
#
# PHYSICAL CABINET BUTTON -> RetroPad -> SF attack (with preset 769):
#   b9 -> A -> Medium Kick  (Forward)
#   b8 -> B -> Light  Kick  (Short)
#   b6 -> X -> Medium Punch (Strong)
#   b7 -> Y -> Light  Punch (Jab)
#   b4 -> L -> Heavy  Punch (Fierce)
#   b2 -> R -> Heavy  Kick  (Roundhouse)
#   b3 -> Start            (Start)
#   b5 -> Select/Coin      (insert credit)
#   b1 -> ARCADE broad (A+B+Y) = Medium Kick + Light Kick + Light Punch
#   joystick -> d-pad (movement / jump / crouch)
# ----------------------------------------------------------------------------

# Explicit player-1 attack binds (belt-and-suspenders; mirror the preset so the
# mapping survives even if the device-type preset is ignored on some build).
# These name the keyboard keys the cabinet already injects.
input_player1_a    = "x"        # Medium Kick  (Forward)
input_player1_b    = "z"        # Light  Kick  (Short)
input_player1_x    = "a"        # Medium Punch (Strong)
input_player1_y    = "s"        # Light  Punch (Jab)
input_player1_l    = "leftbracket"   # Heavy Punch (Fierce)
input_player1_r    = "rightbracket"  # Heavy Kick  (Roundhouse)
input_player1_start  = "enter"
input_player1_select = "rshift"      # Coin / credit
