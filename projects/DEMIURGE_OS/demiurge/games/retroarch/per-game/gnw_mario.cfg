# gnw_mario.cfg — per-game override for Game & Watch: Mario Bros. (MW-56, 1983).
# Layered on top of retroarch/retroarch.cfg via the supervisor's
# `--appendconfig`. Only KEYS THAT DIFFER from the base config belong here.
#
# NOTE: this is "Mario Bros." (the 2-player package-line handheld), NOT "Mario's
# Cement Factory". HANDHELD, not coin-op: no coins/credits.
#
# IMPORTANT — this game has NO action/jump button. Play is MOVEMENT ONLY. It is
# the two-player vs. unit: each player works one side of the conveyor. In MAME
# the two sides are two independent dual-direction controls
# ("JOYSTICKLEFT" = P1 side, "JOYSTICKRIGHT" = P2 side). On a one-stick cabinet
# you drive ONE side with the d-pad. START with GAME A (or GAME B).
#
# MAME core (mame_libretro.so) -> RetroPad (default MAME RetroPad layout):
#   RetroPad START  -> "Game A"  (MAME IPT_START1)
#   RetroPad D-pad  -> movement (the side control; up/down + left/right)
#   RetroPad SELECT -> MAME "Coin" — UNUSED by this driver
#   "Game B"=IPT_START2, "Time"=IPT_SELECT, "Alarm"=IPT_SERVICE2,
#   "ACL"=IPT_SERVICE1 are NOT on a default RetroPad button (reach via TAB OSD).
#   There is NO IPT_BUTTON1, so the A face button does nothing in this game.
#
# Cabinet input chain is FIXED in lib/gamepad.py (device button -> keyboard key);
# we only re-route key->RetroPad bindings. Resulting device map:
#   b3 (Start btn)  = enter  -> RetroPad START = GAME A
#   joystick (all 4)         -> RetroPad d-pad = MOVE (one conveyor side)
#   b5 (Select btn) = rshift -> RetroPad SELECT (unused here)
#   ARCADE / face buttons    -> no effect (no action button in this game)

input_max_users = "1"
input_libretro_device_p1 = "1"

# MOVE: this game uses both axes (the side control moves Mario up/down between
# levels), so bind the full d-pad from the joystick.
input_player1_up    = "up"
input_player1_down  = "down"
input_player1_left  = "left"
input_player1_right = "right"
# START = GAME A: Start button (b3) emits "enter" -> RetroPad START.
input_player1_start = "enter"
# SELECT: Select button (b5) emits "rshift" -> RetroPad SELECT (MAME Coin; unused).
input_player1_select = "rshift"

# --- classic Game & Watch LCD look (shader) ---
# Mario Bros. is the wide two-panel handheld: the only artwork view ("External
# Layout") shows the two LCD panels side-by-side as the genuine device (the
# conveyor spans both panels — that IS the hardware, not a "DS"). The lcd1x GLSL
# shader applies the crisp dot-matrix LCD grid so it reads as a classic Game &
# Watch instead of raw emulator pixels. GLSL (not slang) for the Pi's gl video
# driver. Per-game only — never global (keeps the FBNeo arcade games clean).
video_shader_enable = "true"
video_shader = "/home/gorpi7/.config/retroarch/shaders/handheld/lcd1x.glslp"
