# retroarch.cfg — Demiurge arcade console overrides.
# Passed explicitly via `retroarch --config .../retroarch.cfg` by the supervisor.
# Anything not set here inherits RetroArch's own defaults. Paths use ~ which
# RetroArch expands. Tune on-device (docs/INSTALL.md).

# Never let RetroArch overwrite configs on exit — that auto-save was clobbering
# video_rotation (the default ~/.config/retroarch/retroarch.cfg kept forcing 0).
config_save_on_exit = "false"

# ---- look & feel: the "super simple emulator UI vibe" ----
menu_driver = "rgui"
menu_show_load_core = "false"
menu_show_load_content = "false"
menu_show_online_updater = "false"
menu_show_settings = "true"
content_show_playlists = "true"
playlist_directory = "~/demiurge/games/playlists"
rgui_menu_color_theme = "26"
video_fullscreen = "true"
video_smooth = "false"
video_scale_integer = "false"
video_aspect_ratio_auto = "true"
# ---- PORTRAIT: the 1280x720 panel is mounted portrait (same as the face UI,
# which uses rotation 270). 0=0, 1=90, 2=180, 3=270. If the image is upside-down,
# change to "1". Many of these arcade games (Galaga, Dig Dug, Centipede) are
# natively vertical, so they fill a portrait screen nicely.
video_allow_rotate = "true"
# 0=0 1=90 2=180 3=270 (per-app SW rotation; Pi5 vc4 hardware can't do KMS 90/270,
# so this is the only way). Matches the kivy UI's 270 mount. 1 was 180-off
# (up/down+L/R swapped) -> 3. If upside-down, use 1. Pair with games.conf joy_rotation.
video_rotation = "3"

# ---- audio: ALSA 'default' -> pipewire-alsa -> sync layer ----
# RetroArch's native PipeWire backend fails to init against the Demiurge graph
# ("[PipeWire]: Failed to initialize audio"). The proven path on this Pi is ALSA
# 'default', which pipewire-alsa intercepts and routes into the sync layer (same
# way csound's -odac does — see demiurge/docs/gotchas.md Q1). Reliable.
audio_enable = "true"
audio_driver = "alsathread"
audio_device = "default"
audio_sync = "true"
audio_volume = "0.0"

# ---- low latency ----
# These early games are featherweight on a Pi 5, so we can push input latency
# down hard. run_ahead removes 1 frame of lag by re-simulating; single-instance
# keeps CPU low for these light cores. Small swapchain + sync = minimal buffering.
run_ahead_enabled = "true"
# 2 frames: FBNeo/Galaga has ~2-3 frames of internal input lag; these cores are
# tiny so re-simulating 2 frames single-instance is cheap on a Pi 5. Removes one
# more frame of fire-button latency than the previous "1". (was "1")
run_ahead_frames = "2"
run_ahead_secondary_instance = "false"
runahead_mode = "single_instance"
video_max_swapchain_images = "2"
video_hard_sync = "true"
video_hard_sync_frames = "0"
video_frame_delay = "0"
video_frame_delay_auto = "true"
# Poll input as EARLY as possible (0=Early: poll before retro_run; 1=Normal;
# 2=Late). Early shaves a poll's worth of latency off the fire button. This key
# was previously unset, so RetroArch defaulted to Normal (1).
input_poll_type_behavior = "0"
audio_latency = "48"
video_vsync = "true"
# Boot-skip: the supervisor holds fast-forward for the first few seconds of a
# launch so the game's RAM-test/attract boot zooms by to the start screen.
# ratio 0 = unlimited speed while held; key 'grave' is emitted by the gamepad.
fastforward_ratio = "0"
input_hold_fast_forward = "grave"

# ---- cheats: infinite-lives auto-apply per game ----
# Per-game cheat files live in cheats/<core>/<romname>.cht; with apply-after-load
# the enabled cheats (infinite lives/health) auto-apply when the game launches =
# never game-over, no dealing with credits.
cheat_database_path = "~/demiurge/games/cheats"
apply_cheats_after_load = "true"

# ---- continue after death ----
# There is no universal "continue on death" switch — it's per game:
#  * Arcade-style cores (FBNeo/MAME): set Free Play = On in the game's Core
#    Options / DIP menu so a new credit is always available after you die.
#  * Console/homebrew: use the game's own continue, OR rely on the auto
#    save-state below (auto-load on launch resumes your last session).
# We also enable rewind so a death is recoverable by holding the rewind hotkey.
rewind_enable = "true"
rewind_buffer_size = "20"
rewind_granularity = "2"

# ---- persistence: real high scores + saves survive reboots ----
# MAME-family games store high scores in NVRAM; RetroArch writes that here, so
# scores persist. SaveRAM autosaves on close + periodically.
savefile_directory = "~/demiurge/games/saves"
savestate_directory = "~/demiurge/games/states"
system_directory = "~/demiurge/games/system"
sort_savefiles_enable = "true"
sort_savestates_enable = "true"
savestate_auto_save = "true"
savestate_auto_load = "true"
autosave_interval = "10"

# ---- input: player 1 driven by the virtual KEYBOARD "Demiurge Arcade P1" ----
# lib/gamepad.py emits keys; we bind them EXPLICITLY here (no autoconfig needed,
# which is why the controls now actually work). Joystick -> arrows (d-pad);
# arcade button -> SPACE (bound to BOTH A and B = menu-confirm + game-fire);
# joystick click -> ENTER (Start / insert-coin).
input_max_users = "1"
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"
# Canonical map (docs/BUTTONS.md). EVERY button mapped. Movement = analog joystick.
#  A/fire = ARCADE(b1)+A(b9) -> X ; B = b1+b8 -> Z ; Y = b1+b7 -> S ; X = b6 -> A
#  L = UP btn b4 -> [ ; R = DOWN btn b2 -> ]
#  Start = RIGHT btn b3 -> Enter (also coins) ; Select/Coin = LEFT btn b5 -> RShift
input_player1_a = "x"
input_player1_b = "z"
input_player1_x = "a"
input_player1_y = "s"
input_player1_l = "leftbracket"
input_player1_r = "rightbracket"
input_player1_r2 = "semicolon"
# Disable the pause hotkey — we never want a button to accidentally pause a game
# (the b1=R2='p' bind was pausing Spy Hunter). Pausing is handled by the combo.
input_pause_toggle = "nul"
input_player1_start = "enter"
input_player1_select = "rshift"
# Menu also natively takes arrows + enter, so the same two controls drive RGUI.
menu_unified_controls = "true"
# Quit guard so stray inputs never trap the cabinet (we exit via the handshake).
quit_press_twice = "true"

# ---- playlists / content ----
rgui_browser_directory = "~/demiurge/games/roms"
