# set: nam
# Guitar in → NAM amp sim → output
# Profile hot-switch via OSC: oscsend demiurge.local 9000 /nam/idx i N
# Profiles live in ~/demiurge/profiles/nam/ (sorted alphabetically):
#   0 = 73_plexi_bright
#   1 = fender_super_reverb_1977
#   2 = peavey_6505
#   3 = sunn_model_t_doom
#   4 = vox_ac30_custom_classic

link    = off
bpm     = 124
rate    = 48000
quantum = 128

sync_layer = on

chain =
  in1 ->
  ~/demiurge/profiles/nam/73_plexi_bright.nam
