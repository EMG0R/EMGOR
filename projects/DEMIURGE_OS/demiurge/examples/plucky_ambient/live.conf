# ~/demiurge/examples/plucky_ambient/live.conf
#
# DEMIURGE parallel-chain test.
#
# The whole purpose of this file is to prove that multiple `chain =`
# blocks run in parallel and sum cleanly at `out`. It's meant to be
# authored the way a new user would: one config file, no hidden
# knobs, every stage is something you can already find under
# ~/demiurge/examples/.
#
# Two chains, summed at demiurge-sink:playback_FL/FR:
#
#   plucky  :  plucky.ck                               (dry lead, NO reverb)
#   ambient :  ambient_pad.dsp  ->  csound_reverb.csd  (drone + reverbsc wash)
#
# If both show up in `pw-link -l` with each terminal stage feeding
# demiurge-sink directly, and you can hear the plucky arpeggio sitting
# clear on top of the reverb-drenched drone, the multi-chain feature
# is working end-to-end.
#
# How to use this as a new user would:
#
#   1) Point the boot config at it:
#        sudo nano /boot/firmware/demiurge.conf
#        # launch = /home/gorpi7/demiurge/examples/plucky_ambient/live.conf
#
#   2) Or copy this file over your existing ~/demiurge/live.conf:
#        cp ~/demiurge/examples/plucky_ambient/live.conf ~/demiurge/live.conf
#
#   3) sudo systemctl restart demiurge
#   4) sudo journalctl -u demiurge -f        # watch the launcher come up
#   5) pw-link -l | grep demiurge-sink        # two distinct feeders expected

link = off
bpm  = 110

chain =
  ~/demiurge/examples/plucky_ambient/plucky.ck

chain =
  ~/demiurge/examples/plucky_ambient/ambient_pad.dsp
  ~/demiurge/examples/hello_patching/csound_reverb.csd
