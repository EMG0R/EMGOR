<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>hello_patching</title>
<!--
  DEMIURGE hello_patching: one fader per language.
  Each fader POSTs {path, value} (0..1) to the pool and shows the value the
  engine reports back (/pout) next to what we sent. See docs/parameters.md.

  Endpoints used (docs/parameters.md section 7, served by web/demiurge_web.py):
    POST /api/pool/set      {path, value}
    GET  /api/pool/events   SSE, data: {"path","value"}  (the pool's /param telemetry)
  Nothing is faked: if an endpoint is unreachable the page says so, and the
  "echo" column stays at a dash until a real /pout arrives.
-->
<style>
:root{--bg:#0b0613;--card:#150c24;--line:#2a1646;--ink:#efe6ff;--dim:#8d78b3;--v:#9b5cff;--v2:#d08cff;--bad:#ff6b8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.3 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 32px}
h1{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin:8px 0 4px;font-weight:600}
p.sub{margin:0 0 18px;color:var(--dim);font-size:13px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 10px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lang{font-weight:800;font-size:20px;letter-spacing:.02em}
.what{color:var(--dim);font-size:12px}
.vals{font:12px ui-monospace,monospace;color:var(--dim);white-space:nowrap}
.vals b{color:var(--v2);font-weight:600}
canvas{display:block;width:100%;height:56px;touch-action:none;cursor:pointer;margin-top:6px}
#st{font-size:12px;color:var(--dim);margin-top:14px;min-height:2.6em}
#st.err{color:var(--bad)}
</style>
</head>
<body>
<main>
  <h1>hello_patching</h1>
  <p class="sub">seven languages, one chain, one fader each. Left number is sent, right is what the engine says back.</p>
  <div id="rows"></div>
  <div id="st"></div>
</main>
<script>
"use strict";
// One entry per stage; path matches params/<stage>.json.
const P = [
  {id:"strudel", lang:"Strudel", what:"melody head: how many notes fire",   path:"/strudel/density", def:0.70},
  {id:"chuck",   lang:"ChucK",   what:"sine pad voices: chorus mix",        path:"/chuck/chorus",    def:0.35},
  {id:"pd",      lang:"Pd",      what:"vibrato depth",                      path:"/pd/vibrato",      def:0.40},
  {id:"sc",      lang:"SuperCollider", what:"granular cloud density",       path:"/sc/density",      def:0.50},
  {id:"faust",   lang:"Faust",   what:"stutter delay feedback",             path:"/faust/feedback",  def:0.50},
  {id:"cpp",     lang:"C++",     what:"bitcrush chance per beat",           path:"/cpp/crush",       def:0.125},
  {id:"csound",  lang:"Csound",  what:"ring-mod then reverb wet",           path:"/csound/reverb",   def:0.25},
];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const stEl = document.getElementById("st");
function status(msg, bad){ stEl.textContent = msg; stEl.className = bad ? "err" : ""; }

const byPath = {};
P.forEach(p => { p.sent = p.def; p.echo = null; byPath[p.path] = p; });

// ---- build rows ----
const rows = document.getElementById("rows");
P.forEach(p => {
  const d = document.createElement("div"); d.className = "row";
  d.innerHTML = '<div class="top"><div><div class="lang"></div><div class="what"></div></div><div class="vals"></div></div><canvas></canvas>';
  d.querySelector(".lang").textContent = p.lang;
  d.querySelector(".what").textContent = p.what;
  p.vals = d.querySelector(".vals"); p.cv = d.querySelector("canvas");
  rows.appendChild(d);
  attach(p);
});

function draw(p){
  const c = p.cv, dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (c.width !== w*dpr) { c.width = w*dpr; c.height = h*dpr; }
  const g = c.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const pad = 14, y = h/2, x = v => pad + v*(w-2*pad);
  g.lineCap = "round"; g.lineWidth = 6;
  g.strokeStyle = css("--line"); g.beginPath(); g.moveTo(x(0),y); g.lineTo(x(1),y); g.stroke();
  g.strokeStyle = css("--v");    g.beginPath(); g.moveTo(x(0),y); g.lineTo(x(p.sent),y); g.stroke();
  if (p.echo !== null) {           // engine echo: hollow ring
    g.lineWidth = 2; g.strokeStyle = css("--v2");
    g.beginPath(); g.arc(x(p.echo), y, 11, 0, 6.2832); g.stroke();
  }
  g.fillStyle = css("--ink"); g.beginPath(); g.arc(x(p.sent), y, 8, 0, 6.2832); g.fill();
  p.vals.innerHTML = "sent <b>" + p.sent.toFixed(2) + "</b> &nbsp; echo <b>" + (p.echo === null ? "—" : p.echo.toFixed(2)) + "</b>";
}

// ---- send (coalesced to ~30 Hz) ----
let pending = {}, timer = null, warned = false;
function queue(p){
  pending[p.path] = p.sent;
  if (!timer) timer = setTimeout(flush, 33);
}
async function flush(){
  timer = null; const batch = pending; pending = {};
  for (const path in batch) {
    try {
      const r = await fetch("/api/pool/set", {method:"POST", headers:{"Content-Type":"application/json"},
                            body: JSON.stringify({path, value: batch[path]})});
      if (!r.ok) throw new Error("HTTP " + r.status);
    } catch (e) {
      if (!warned) { warned = true; status("POST /api/pool/set failed (" + e.message + "). Is demiurge-web running?", true); }
    }
  }
}
function attach(p){
  const set = ev => {
    const r = p.cv.getBoundingClientRect(), pad = 14;
    p.sent = Math.max(0, Math.min(1, (ev.clientX - r.left - pad) / (r.width - 2*pad)));
    draw(p); queue(p);
  };
  p.cv.addEventListener("pointerdown", ev => { p.cv.setPointerCapture(ev.pointerId); p.drag = true; set(ev); });
  p.cv.addEventListener("pointermove", ev => { if (p.drag) set(ev); });
  const up = () => { p.drag = false; };
  p.cv.addEventListener("pointerup", up); p.cv.addEventListener("pointercancel", up);
}

// ---- echo: engine /pout via the pool's /param fan-out ----
function listen(){
  if (!window.EventSource) { status("No EventSource: echo unavailable."); return; }
  const es = new EventSource("/api/pool/events");   // pool /param telemetry (parameters.md section 3.1)
  let ok = false;
  es.onopen = () => { ok = true; status("echo stream connected"); };
  es.onmessage = m => {
    try { const d = JSON.parse(m.data), p = byPath[d.path];
          if (p && typeof d.value === "number") { p.echo = d.value; draw(p); } } catch(e){}
  };
  es.onerror = () => {
    if (!ok) { status("echo stream /api/pool/events unavailable: echo stays at a dash.", true); es.close(); }
  };
}

addEventListener("resize", () => P.forEach(draw));
P.forEach(draw); listen();
</script>
</body>
</html>
