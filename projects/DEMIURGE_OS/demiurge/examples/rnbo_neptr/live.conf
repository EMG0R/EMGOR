# ~/demiurge/live.conf — DEMIURGE live config: RNBO → NEPTR Phase 4.
#
# Your RNBO patch (authored in Max, pushed to the Pi over the network and
# compiled on-device by the rnbo-runner — auto-started here because a *.rnbo is
# in the chain below; see the rnbo gate in the main live.conf) is the sound
# source. Its
# stereo output is patched straight into the NEPTR Phase 4 Csound guitar-
# effects processor, which runs the full effect chain and feeds the speakers.
#
#   <your patch>.rnbo  ──►  neptrPhase4.csd  ──►  out (demiurge-sink)
#
# Edit this file, save, the launcher hot-reloads. No reboot.
#
# To use a DIFFERENT RNBO patch: name it in Max, export it to the Pi
# (device "rnbo:demiurge"), then change the `*.rnbo` token below to match
# that patch's name. The token's basename IS the patcher name; the file
# doesn't need to exist on disk — the patch lives in the runner's store.

# DEMIURGE-DEVICES-BEGIN
# devices detected by DEMIURGE (read-only, auto-refreshed when idle)
# DEMIURGE-DEVICES-END

# ---------- globals ----------

link    = off
bpm     = 124
rate    = 48000
quantum = 256

# bypass MUST be off for this chain: RNBO + Csound both need the PipeWire/JACK
# hub (bypass mode lets only ONE program own the audio device, with no
# demiurge-sink destination). See the NEPTR live.conf header for the tradeoffs.
bypass  = off

# ---------- audio chain ----------
#
# Stage 1 (rnbo)   loads the named patcher into the always-on rnbo-runner and
#                  exposes its JACK client "<name>-0" for wiring.
# Stage 2 (csound) reads inch 1/2 (the RNBO output, mono-summed), runs the
#                  Phase 4 effect chain, and outputs to the sink.

chain =
  untitled.rnbo
  ~/NEPTR_phase4/csound/neptrPhase4.csd
