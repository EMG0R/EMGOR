<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>hello_softmap</title>
<!--
  DEMIURGE hello_softmap: remap a hardware source onto a "soft" parameter.
  Flow (docs/parameters.md sections 5 and 7): pick source -> pick param ->
  save to the active patch's <patch>.map.json.

  Endpoints (section 7, served by web/demiurge_web.py):
    GET  /api/pool/params    registry (manifests from ~/demiurge/params/*.json)
    GET  /api/pool/sources   calibrated hardware sources
    GET  /api/pool/map       the active patch's map file
    POST /api/pool/map       write it (validate + atomic write, hot reload)
    POST /api/pool/set       {path, value} drive a param directly (test slider)
  When an endpoint is unreachable the page says so and falls back to the
  example data in this folder (params/csound.json, hello_softmap.map.json) so
  you can still see the flow; "Save" then shows the JSON instead of writing it.
-->
<style>
:root{--bg:#0b0613;--card:#150c24;--line:#2a1646;--ink:#efe6ff;--dim:#8d78b3;--v:#9b5cff;--v2:#d08cff;--bad:#ff6b8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.3 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
h1{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin:8px 0 4px;font-weight:600}
h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:20px 0 8px;font-weight:600}
p.sub{margin:0 0 6px;color:var(--dim);font-size:13px}
#todo{background:#2a1020;border:1px solid #5a2038;color:#ffb3c4;border-radius:10px;padding:8px 12px;font-size:12px;margin:10px 0;display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--v);border-color:var(--v);color:#12081f;font-weight:700}
.chip small{color:var(--dim);margin-left:6px;font-size:11px}
.chip.on small{color:#2a1646}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
canvas{display:block;width:100%;height:48px;touch-action:none;cursor:pointer}
.l{display:flex;justify-content:space-between;font:12px ui-monospace,monospace;color:var(--dim)}
.l b{color:var(--v2);font-weight:600}
button.go{width:100%;margin-top:14px;padding:14px;border-radius:12px;border:0;background:var(--v);color:#12081f;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
button.sm{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
label{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px;color:var(--dim)}
pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font:11px/1.4 ui-monospace,monospace;overflow:auto;max-height:240px;color:var(--ink)}
#msg{font-size:12px;color:var(--dim);margin-top:10px;min-height:1.4em}
.map{display:flex;justify-content:space-between;align-items:center;gap:8px;font:12px ui-monospace,monospace;padding:6px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <h1>hello_softmap</h1>
  <p class="sub">pick a source, pick a parameter, save it to the patch.</p>
  <div id="todo"></div>

  <h2>1 &middot; source</h2><div class="chips" id="src"></div>
  <h2>2 &middot; parameter</h2><div class="chips" id="par"></div>

  <h2>3 &middot; zone</h2>
  <div class="card">
    <div class="l"><span>source range used</span><span><b id="zl">0.00</b> to <b id="zh">1.00</b></span></div>
    <canvas id="zone"></canvas>
    <label><input type="checkbox" id="inv"> invert</label>
  </div>

  <button class="go" id="save">Save to patch</button>
  <div id="msg"></div>

  <h2>patch map</h2>
  <div class="card" id="maps"></div>
  <h2>file preview</h2>
  <pre id="json"></pre>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const todo = [];
function note(t){ if (!todo.includes(t)) todo.push(t); const e=$("todo"); e.style.display="block"; e.innerHTML = "Unavailable: " + todo.join("; ") + ". Showing example data from this folder."; }

// Fallbacks = the shipped example files, so the flow is visible without the pool.
const EX_PARAMS = [
  {path:"/csound/cutoff", label:"Filter cutoff"}, {path:"/csound/rate", label:"Note rate"}, {path:"/csound/detune", label:"Detune"}];
const EX_SOURCES = [
  {id:"/hw/teensy/tof1", label:"LiDAR 1"}, {id:"/hw/teensy/knob2", label:"Knob 2"}, {id:"/hw/web/gyro_x", label:"Phone gyro X"}];
const EX_MAP = {version:1, patch:"hello_softmap", maps:[
  {id:"tof1-cutoff", source:"/hw/teensy/tof1", target:{param:"/csound/cutoff"}, zone_lo:0.1, zone_hi:0.9, invert:false, curve:"lin", mode:"continuous", combine:"replace"},
  {id:"knob2-rate", source:"/hw/teensy/knob2", target:{param:"/csound/rate"}, zone_lo:0, zone_hi:1, invert:false, curve:"lin", mode:"continuous", combine:"replace"}],
  values:{"/csound/detune":0.3}};

let params = EX_PARAMS, sources = EX_SOURCES, map = JSON.parse(JSON.stringify(EX_MAP));
let selS = null, selP = null, lo = 0, hi = 1, live = false;

async function jget(url){ const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }
async function load(){
  try { const d = await jget("/api/pool/params"); params = (d.params||d).filter(p => (p.map||"soft") === "soft"); }
  catch(e){ note("GET /api/pool/params"); }
  try { const d = await jget("/api/pool/sources"); sources = d.sources||d; }
  catch(e){ note("GET /api/pool/sources"); }
  try { map = await jget("/api/pool/map"); live = true; }
  catch(e){ note("GET/POST /api/pool/map"); }
  selS = sources[0] && sources[0].id; selP = params[0] && params[0].path;
  render();
}

function chips(el, items, key, sel, pick){
  el.innerHTML = "";
  items.forEach(it => {
    const b = document.createElement("button"); b.className = "chip" + (it[key] === sel ? " on" : "");
    b.innerHTML = ""; b.append(it.label || it[key]);
    const s = document.createElement("small"); s.textContent = it[key]; b.append(s);
    b.onclick = () => pick(it[key]); el.appendChild(b);
  });
}
function entryFor(){ return (map.maps||[]).find(m => m.target && m.target.param === selP); }
function render(){
  chips($("src"), sources, "id", selS, v => { selS = v; render(); });
  chips($("par"), params, "path", selP, v => { selP = v; const e = entryFor(); if (e){ selS = e.source; lo = e.zone_lo; hi = e.zone_hi; $("inv").checked = !!e.invert; } render(); });
  drawZone();
  const box = $("maps"); box.innerHTML = "";
  (map.maps||[]).forEach(m => {
    const d = document.createElement("div"); d.className = "map";
    d.innerHTML = "<span></span><button class='sm'>remove</button>";
    d.firstChild.textContent = m.source + "  ->  " + (m.target.param || JSON.stringify(m.target));
    d.lastChild.onclick = () => { map.maps = map.maps.filter(x => x !== m); render(); };
    box.appendChild(d);
  });
  if (!(map.maps||[]).length) box.textContent = "no maps yet";
  $("json").textContent = JSON.stringify(map, null, 2);
}

// ---- zone: two-handle range, custom drawn ----
const cv = $("zone"); let drag = null;
function drawZone(){
  const dpr = devicePixelRatio||1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w*dpr){ cv.width = w*dpr; cv.height = h*dpr; }
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const pad = 12, y = h/2, x = v => pad + v*(w-2*pad);
  g.lineCap = "round"; g.lineWidth = 6;
  g.strokeStyle = css("--line"); g.beginPath(); g.moveTo(x(0),y); g.lineTo(x(1),y); g.stroke();
  g.strokeStyle = css("--v"); g.beginPath(); g.moveTo(x(lo),y); g.lineTo(x(hi),y); g.stroke();
  g.fillStyle = css("--ink"); [lo,hi].forEach(v => { g.beginPath(); g.arc(x(v),y,9,0,6.2832); g.fill(); });
  $("zl").textContent = lo.toFixed(2); $("zh").textContent = hi.toFixed(2);
}
function zset(ev){
  const r = cv.getBoundingClientRect(), pad = 12;
  const v = Math.max(0, Math.min(1, (ev.clientX - r.left - pad)/(r.width - 2*pad)));
  if (drag === null) drag = Math.abs(v-lo) < Math.abs(v-hi) ? "lo" : "hi";
  if (drag === "lo") lo = Math.min(v, hi - 0.02); else hi = Math.max(v, lo + 0.02);
  drawZone(); $("json").textContent = JSON.stringify(build(), null, 2);
}
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); drag = null; zset(e); });
cv.addEventListener("pointermove", e => { if (e.buttons) zset(e); });
addEventListener("resize", drawZone);

// ---- save ----
function build(){
  const maps = (map.maps||[]).filter(m => !(m.target && m.target.param === selP));
  maps.push({id: selS.split("/").pop() + "-" + selP.split("/").pop(), source: selS, target:{param: selP},
             zone_lo: +lo.toFixed(3), zone_hi: +hi.toFixed(3), invert: $("inv").checked, curve:"lin", mode:"continuous", combine:"replace"});
  return Object.assign({}, map, {maps});
}
$("save").onclick = async () => {
  if (!selS || !selP) { $("msg").textContent = "pick a source and a parameter first"; return; }
  const next = build();
  try {
    const r = await fetch("/api/pool/map", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(next)});
    if (!r.ok) throw new Error("HTTP " + r.status);
    map = next; $("msg").textContent = "saved to " + (map.patch||"patch") + ".map.json; hot reload applies it live";
  } catch(e) {
    map = next; note("POST /api/pool/map");
    $("msg").textContent = "not written (" + e.message + "): preview below is what would be saved";
  }
  render();
};

load();
</script>
</body>
</html>
