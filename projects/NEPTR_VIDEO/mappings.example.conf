# NEPTR VIDEO control mappings.
#
#   NV_MAPPINGS=mappings.conf ./build/neptr-video
#
# Format, one per line:
#
#   <source> <param> [abs|rel] [lo hi] [step]
#
#   abs      the incoming 0..1 value IS the position (faders, sensors, pedals)
#   rel      each message is one detent: >=0.5 up, <0.5 down (encoders)
#   lo hi    limit the travel. lo > hi INVERTS the control -- that is the
#            supported way to flip a sensor, not a mistake to avoid
#   step     movement per detent in rel mode (default 0.02)
#
# The mode word is optional and a line may go straight to its range, which is
# what a modulator does: it is neither absolute nor relative.
#
# Any number of mappings may share a source. That is how you build a macro:
# one knob, several destinations, each with its own range -- and it is how one
# LFO drives three parameters by different amounts in different directions.
#
# ---------------------------------------------------------------------------
# A row SETS or ADDS, and the SOURCE decides which
# ---------------------------------------------------------------------------
#   lfo:<n>     ADDS a bipolar offset on top of wherever you left the fader.
#               A modulator has no position, only an excursion -- so lo/hi is
#               read as a SPAN: hi - lo is how much of that parameter's travel
#               this destination gets, and lo > hi inverts it. `0 1` is full
#               depth, which is what the device's LEARN gesture writes.
#   everything  SETS the position. A fader, a sensor, a pedal and a macro knob
#   else        all HAVE a position; that is the whole difference.
#
# You cannot ask for the other one. An LFO that SET would pin every parameter
# it names and no fader could move one again; a sensor that ADDED would ratchet
# it away every frame and never bring it back. `rel` on an lfo: row is refused
# at the line for the same reason.

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
# sensor:<id>       demiurge-io telemetry, /sensor <id> <norm>, already 0..1
#                   Teensy ids: jx jy exp fsr1 fsr2 tof1 tof2 ax ay az ml mr
# cc:<ch>:<num>     a MIDI control change, /cc <ch> <num> <val 0..127>
#                   ch is 1-indexed (Csound convention, not the wire nibble)
#                   Teensy ch1: rotations CC20-26, enc buttons CC70-76,
#                   buttons CC60-68, joystick button CC77, pedal CC29
# p:<id>            an expression target, /p <id> <val 0..1>
# osc:<address>     anything else carrying a number
# macro:<n>         MACRO n on the instrument's own MOD page (n = 0..3). Not a
#                   sensor: a knob here, fed through this table so that "one
#                   control moving several parameters" is the mechanism that
#                   already exists rather than a second one beside it
# lfo:<n>           LFO n on the same page (n = 0..3). Its rate, depth, phase
#                   and shape are ordinary parameters (lfo0.rate ...); THIS is
#                   where it is pointed. Rows here belong to the PATCH: a
#                   preset saves them and a preset load replaces them. Every
#                   other source belongs to the RIG and a preset never touches
#                   it -- recalling a sound must not re-wire your pedal.
#
# Parameters: run with NV_MONITOR=1 to watch live sources, and read the panel
# for parameter ids. Effect knobs are fx<slot>.<param>, e.g. fx0.amount.

# ---------------------------------------------------------------------------
# Sensors
# ---------------------------------------------------------------------------
sensor:jx    g.center_x       abs
sensor:jy    g.center_y       abs
sensor:exp   g.detail         abs
sensor:tof1  g.zoom           abs
sensor:tof2  g.palette_shift  abs
sensor:fsr1  g.palette_mix    abs

# Tilt drives rotation, but only across the middle of its travel -- the ends
# of an accelerometer axis are where it is noisiest.
sensor:ax    g.rotation       abs 0.25 0.75

# Mic envelope never goes fully still: a floor of 0.2 keeps the piece moving.
sensor:ml    g.speed          abs 0.2 1.0

# A macro: one distance sensor opens the feedback up as your hand approaches.
# fx0 is the FEEDBACK slot in the default chain.
sensor:tof2  fx0.amount       abs 0.0 1.1
sensor:tof2  fx0.decay        abs 0.90 0.99

# ---------------------------------------------------------------------------
# Encoders — physical Teensy rotation CCs, one message per detent
# ---------------------------------------------------------------------------
cc:1:20 g.speed         rel 0 1 0.02
cc:1:21 g.zoom          rel 0 1 0.02
cc:1:22 g.rotation      rel 0 1 0.02
cc:1:23 g.detail        rel 0 1 0.02
cc:1:24 g.palette_shift rel 0 1 0.02
cc:1:25 g.palette_mix   rel 0 1 0.02
cc:1:26 g.render_scale  rel 0 1 0.02

# The expression pedal is absolute, not relative.
cc:1:29 g.detail        abs

# An inverted example: heel = full resolution, toe = crushed.
# cc:1:29 g.render_scale abs 1 0

# ---------------------------------------------------------------------------
# Modulation -- one LFO, three destinations, three different amounts
# ---------------------------------------------------------------------------
# Commented out because these lines are PATCH state: the preset you load will
# replace every lfo: row here. Uncomment them to start a session already wired.
#
# lfo:0 g.palette_shift 0.0 0.30    # a third of the travel, upward
# lfo:0 g.zoom          0.10 0.0    # the same LFO, a tenth, INVERTED
# lfo:0 fx0.amount      0.0 1.0     # ...and all of the feedback amount
#
# Set its speed and level with the ordinary parameters:
#   NV_SET="lfo0.rate=0.25,lfo0.depth=0.8,lfo0.shape=0"
