<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HYPERTRUMPET V2 bring-up</title>
<style>
:root{
  --void:#0c0716; --plum:#150c26; --vein:#2b1a49; --amethyst:#8b5cf6; --lava:#ff4fa3;
  --mist:#ece4ff; --dim:#8d80b3; --ok:#76f2b0; --bad:#ff6684; --warn:#ffc65c;
  --num:"Avenir Next Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --txt:"Avenir Next","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--mist);font:14px/1.4 var(--txt)}
body{background:radial-gradient(1200px 700px at 78% -10%,#2a1553 0%,rgba(42,21,83,0) 60%),radial-gradient(900px 600px at -5% 110%,#3b0f45 0%,rgba(59,15,69,0) 55%),var(--void);background-attachment:fixed}
button,select,input{font:inherit;color:inherit}
button{background:transparent;border:1px solid var(--vein);border-radius:999px;padding:7px 16px;cursor:pointer}
button:hover{border-color:var(--amethyst)}
button:focus-visible,select:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--lava);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
button.go{background:var(--amethyst);border-color:var(--amethyst);color:#10061f;font-weight:700}
select,input[type=number]{background:var(--plum);border:1px solid var(--vein);border-radius:8px;padding:6px 8px}
input[type=number]{width:110px}
.top{display:flex;align-items:center;gap:18px;padding:16px 28px;flex-wrap:wrap}
h1{margin:0;font:600 26px/1 var(--num);letter-spacing:.01em}
h1 span{font:500 14px var(--txt);color:var(--dim);margin-left:12px}
.state{display:flex;align-items:center;gap:8px;color:var(--dim)}
#dot{width:10px;height:10px;border-radius:50%;background:var(--vein)}
#dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.sp{flex:1}
#bDrawer em{font-style:normal;color:var(--lava);margin-left:8px}
#msg{padding:0 28px;min-height:1.2em;color:var(--warn)}
#horn{display:flex;flex-wrap:wrap;gap:34px 44px;padding:10px 28px 40px;align-items:flex-start}
.grp{min-width:0;flex:0 1 auto}
.grp.hide{display:none}
.grp h2{margin:0 0 4px;font:500 13px var(--txt);color:var(--dim)}
.grp canvas{width:100%}
#gFaders{flex:3 1 330px}#gKnobs{flex:2 1 240px}#gPress{flex:2 1 230px}#gEnc{flex:3 1 300px}
#gTilt{flex:2 1 260px}#gLid{flex:3 1 340px}#gScope{flex:1 1 100%}
canvas{display:block}
#tip{position:fixed;pointer-events:none;background:#1c1033;border:1px solid var(--amethyst);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;display:none;z-index:30;max-width:300px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:#10081e;border-left:1px solid var(--vein);transform:translateX(102%);transition:transform .22s ease;z-index:20;overflow:auto;padding:0 22px 40px}
#drawer.open{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:18px 0 8px;position:sticky;top:0;background:#10081e;z-index:2}
.dhead strong{font:600 22px var(--num)}
details{border-top:1px solid var(--vein);padding:12px 0}
summary{cursor:pointer;font:600 16px var(--num);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ ";color:var(--lava)}details[open] summary::before{content:"- "}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.small{font-size:12px;color:var(--dim)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.dim{color:var(--dim)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px;margin-top:8px}.kv span:nth-child(odd){color:var(--dim)}
.banner{font:600 20px var(--num);padding:10px 14px;border-radius:12px;background:var(--plum);color:var(--dim);margin:10px 0}
.banner.pass{background:var(--ok);color:#06150d}.banner.fail{background:var(--bad);color:#1c040b}
.step{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 6px;border-radius:10px}
.step.act{background:var(--plum)}
.step .t{font-weight:700}.step .i{color:var(--dim);font-size:12px}
.chk{font-size:12px;margin-top:4px;display:grid;grid-template-columns:auto 1fr;gap:1px 10px}
.chip{display:inline-block;padding:2px 9px;margin:2px 5px 2px 0;border-radius:999px;border:1px solid var(--vein)}.chip.ok{border-color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:3px 6px;text-align:left;border-top:1px solid var(--vein);font-weight:400}th{color:var(--dim)}
#calwrap .card{background:none;border:0;padding:0}#calwrap h2{font:500 13px var(--txt);color:var(--dim);margin:0 0 6px}
#calwrap canvas{width:100%}
.cname{font-weight:700}.chead{display:flex;gap:8px}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
@media (max-width:700px){.top{padding:12px 16px}#horn{padding:8px 16px 30px}#msg{padding:0 16px}}
</style>
</head>
<body>
<header class="top">
  <h1>hypertrumpet<span>v2 bring-up</span></h1>
  <div class="state"><i id="dot"></i><span id="conn">Disconnected</span><span id="fwinfo" class="small"></span></div>
  <select id="testSel" aria-label="Test view (follows the firmware when connected)"><option value="01_faders">01 faders</option><option value="05_faders_imu_lidar">05 faders, pots, FSR, IMU, lidars</option><option value="06_pots2w_enc">06 faders, 2-wire pots, FSR, encoders, IMU, lidars</option></select>
  <span class="sp"></span>
  <button id="bConnect" class="go">Connect</button>
  <button id="bDemo">Demo</button>
  <button id="bDrawer" aria-expanded="false" aria-controls="drawer">Test panel<em id="dprog"></em></button>
</header>
<div id="msg" role="status"></div>
<main id="horn">
  <section class="grp" id="gFaders"><h2>Faders</h2><canvas id="cvFaders" data-h="300"></canvas></section>
  <section class="grp" id="gKnobs"><h2>Knobs</h2><canvas id="cvKnobs" data-h="300"></canvas></section>
  <section class="grp" id="gPress"><h2>Pressure</h2><canvas id="cvPress" data-h="300"></canvas></section>
  <section class="grp" id="gEnc"><h2>Encoders</h2><canvas id="cvEnc" data-h="300"></canvas></section>
  <section class="grp" id="gTilt"><h2>Tilt</h2><canvas id="cvTilt" data-h="270"></canvas></section>
  <section class="grp" id="gLid"><h2>Distance</h2><canvas id="cvLid" data-h="270"></canvas></section>
  <section class="grp" id="gScope"><h2>Last 10 seconds</h2><canvas id="scope" data-h="120"></canvas></section>
</main>
<div id="tip" role="tooltip"></div>
<aside id="drawer" aria-label="Test panel" aria-hidden="true">
  <div class="dhead"><strong>Test panel</strong><button id="bClose">Close</button></div>
  <details open id="dTest"><summary>Guided test</summary>
    <div id="banner" class="banner">No result yet</div><div id="steps"></div>
    <div class="row"><button id="bBegin" class="go" disabled>Begin step</button><button id="bSkip" disabled>Skip</button><button id="bRestart" disabled>Restart test</button><button id="bCopy" disabled>Copy report</button><button id="bBase" disabled>Save noise baseline</button></div>
    <div class="small" id="baseinfo"></div></details>
  <details id="dCal"><summary>Calibration</summary><div id="calwrap"></div></details>
  <details id="dBus"><summary>Bus and sensors</summary><div id="scanchips"></div><div class="kv" id="i2cinfo"></div><div id="lidtargets"></div><div class="row"><button id="bScan">Rescan bus</button></div></details>
  <details id="dStats"><summary>Channel stats</summary><table id="stats"></table></details>
  <details id="dLink"><summary>Link</summary>
    <div class="kv"><span>sample rate</span><span id="lrate">-</span><span>frames dropped</span><span id="ldrop">-</span><span>stats frames</span><span id="lst">-</span></div>
    <div class="row"><button id="bReset" disabled>Reset stats</button><button id="bDfu" disabled>Enter DFU</button></div></details>
</aside>
<script>
"use strict";
// ---------------------------------------------------------------- constants
const FS = 65535, VREF = 3.3;
const T = {                                   // PASS thresholds (see BRINGUP_PLAN.md, TEST 01)
  edgeLo: 0.02, edgeHi: 0.98,                 // full-scale sweep must reach <2% and >98%
  restPP: 64, restWarn: 160,                  // rest noise p-p, raw counts, 1 s window (200 samples)
  restRecheck: 1.5, restRecheckAdd: 16,       // later rest p-p <= max(1.5 x first, first + 16)
  backtrack: 0.02 * FS,                       // sweep must be monotonic within 2% FS
  jump: 10000,                                // one-sample step bigger than this = dropout/glitch
  xtalk: 0.01 * FS,                           // other channels' excursion during a sweep <= 1% FS
  cover: 30,                                  // sweep must touch >= 30 of 32 bins
  restSamples: 600, sweepTimeoutMs: 30000, sweepMinSamples: 100,
  rateMin: 150, dropMax: 0.02
};
const COLORS = ['#b79cff', '#ff4fa3', '#7de3ff', '#ffc65c', '#76f2b0', '#ff9f5a', '#6ea8ff', '#e879f9'];
const SCOPE_N = 2000;
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- state
const S = {
  test: '', fw: '', ch: [], N: 0, hist: [], hpos: 0, hcount: 0, last: [], st: null,
  seq: 0, lastSeq: -1, drops: 0, frames: 0, stFrames: 0, rate: 0, msBuf: [],
  steps: [], cur: -1, run: null, rest1: null, connected: false, demo: false, port: null, writer: null,
  cards: [], dirty: false, staleT: 0
};

// ---------------------------------------------------------------- line handling
function onLine(line) {
  let m; try { m = JSON.parse(line); } catch (e) { return; }
  if (m.t === 'hello') return onHello(m);
  if (m.t === 's') return onSample(m);
  if (m.t === 'st') { S.st = m; S.stFrames++; mark(); }
  if (m.t === 'imu') return onImu(m);
  if (m.t === 'lid') return onLid(m);
}
function onHello(m) {
  const sig = m.test + '|' + m.ch.map(c => c.n).join(',') + '|' + (m.i2c ? 'i2c' : '') + '|' + (m.enc ? 'enc' : '');
  S.fw = m.fw; $('fwinfo').textContent = 'fw ' + m.fw + '  test ' + m.test + '  ' + m.rate + ' Hz  adc ' + m.adc_bits + 'b x' + m.ovs;
  S.i2c = m.i2c || null; S.helloMs = m.ms; S.calFw = m.cal || null; S.invFw = m.inv || null; S.enc = !!m.enc;
  if (m.calc && !S.calResent) { S.calResent = true; try { const o = JSON.parse(localStorage.getItem('ht_cal') || '{}'); m.ch.forEach((c, i) => { if (!m.calc[i] && o[c.n]) { send('cal ' + i + ' ' + o[c.n].join(' ')); if (S.cal && S.cal[i]) { S.cal[i].bp = o[c.n]; S.cal[i].sent = true; } } }); } catch (e) {} }
  const sel = $('testSel'); if ([...sel.options].some(o => o.value === m.test)) sel.value = m.test;
  if (S.sigKey !== sig) { S.sigKey = sig; S.test = m.test; S.ch = m.ch; S.N = m.ch.length; buildUI(); }
  if (S.run && S.run.s.kind === 'i2c') i2cStepFeed(m);
  mark();
}
// ---- IMU / lidar streams (test 05)
const IMU_N = 1000, LID_N = 400;
function onImu(m) {
  const I = S.imu; if (!I) return;
  const a = m.a.map(x => x / 16384), g = m.g.map(x => x / 131);
  for (let k = 0; k < 3; k++) { I.a[k][I.pos] = a[k]; I.g[k][I.pos] = g[k]; }
  I.pos = (I.pos + 1) % IMU_N; if (I.cnt < IMU_N) I.cnt++;
  I.last = { a, g, ra: m.a, rg: m.g, mag: Math.hypot(a[0], a[1], a[2]), pitch: m.pr[0] / 100, roll: m.pr[1] / 100, tmp: m.tmp / 340 + 36.53 };
  I.ms.push(m.ms); if (I.ms.length > 100) I.ms.shift();
  if (I.ms.length > 10) I.rate = 1000 * (I.ms.length - 1) / (I.ms[I.ms.length - 1] - I.ms[0]);
  if (S.run && (S.run.s.kind === 'imu_rest' || S.run.s.kind === 'imu_faces')) imuStepFeed(m, a, g);
  mark();
}
function onLid(m) {
  const k = m.i || 0, L = S.lids && S.lids[k]; if (!L) return;
  L.mm[L.pos] = m.mm; L.st[L.pos] = m.st; L.pos = (L.pos + 1) % LID_N; if (L.cnt < LID_N) L.cnt++;
  L.last = m; L.ms.push(m.ms); if (L.ms.length > 40) L.ms.shift();
  if (L.ms.length > 5) L.rate = 1000 * (L.ms.length - 1) / (L.ms[L.ms.length - 1] - L.ms[0]);
  if (S.run && S.run.s.kind === 'lid_fixed' && S.run.s.lk === k) lidStepFeed(m);
  mark();
}
function onSample(m) {
  if (!S.N) return;
  if (S.lastSeq >= 0 && m.n !== S.lastSeq + 1) S.drops += Math.max(0, m.n - S.lastSeq - 1);
  S.lastSeq = m.n; S.frames++;
  S.msBuf.push(m.ms); if (S.msBuf.length > 200) S.msBuf.shift();
  if (S.msBuf.length > 20) S.rate = 1000 * (S.msBuf.length - 1) / (S.msBuf[S.msBuf.length - 1] - S.msBuf[0]);
  const LV = m.l || m.v;
  for (let i = 0; i < S.N; i++) { S.hist[i][S.hpos] = m.v[i]; S.histL[i][S.hpos] = LV[i]; }
  S.hpos = (S.hpos + 1) % SCOPE_N; if (S.hcount < SCOPE_N) S.hcount++;
  S.last = m.v; S.lastL = LV; if (m.e) { S.encv = m.e; if (S.run && S.run.s.kind === 'enc') encStepFeed(m); }
  if (S.run && (S.run.s.kind === 'rest' || S.run.s.kind === 'sweep' || S.run.s.kind === 'fsr')) stepSample(m.v, m.ms, LV);
  mark();
  if (S.connected && !S.demo) { clearTimeout(S.staleT); S.staleT = setTimeout(stale, 1500); }
}
function stale() { setMsg('No data for 1.5 s. Check USB, or the firmware is not the bring-up app.'); setConn(false, 'NO DATA'); }

// ---------------------------------------------------------------- UI build
// ---------------------------------------------------------------- instrument panel (custom-drawn, renders only when data arrives)
const C = { void: '#0c0716', plum: '#150c26', vein: '#2b1a49', amethyst: '#8b5cf6', lava: '#ff4fa3', mist: '#ece4ff', dim: '#8d80b3', ok: '#76f2b0', bad: '#ff6684', warn: '#ffc65c' };
const FN = "'Avenir Next Condensed','Arial Narrow','Helvetica Neue',sans-serif", FT = "'Avenir Next','Helvetica Neue',Arial,sans-serif";
const chOf = kinds => S.ch.map((c, i) => ({ c, i })).filter(x => kinds.includes(x.c.k));
const hotReset = cv => { S.hot = S.hot || {}; S.hot[cv.id] = []; return S.hot[cv.id]; };
const txt = (g, s, x, y, font, col, al) => { g.font = font; g.fillStyle = col; g.textAlign = al || 'center'; g.textBaseline = 'alphabetic'; g.fillText(s, x, y); };
const rr = (g, x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
const statLine = i => { const st = S.st; if (!st) return ''; const n = (() => { let k = 0; for (let b = 0; b < 32; b++) if (st.cov[i] >>> b & 1) k++; return k; })();
  return 'min ' + st.min[i] + ', max ' + st.max[i] + '<br>noise ' + st.pp[i] + ' counts now, best ' + (st.ppmin[i] === 65535 ? '...' : st.ppmin[i]) + '<br>' + n + ' of 32 range bins visited'; };
const chTip = i => () => { const raw = S.last[i], lin = S.lastL ? S.lastL[i] : raw; return '<b>' + S.ch[i].n + '</b> on ' + S.ch[i].pin + ', Seed pin ' + S.ch[i].phys + '<br>raw ' + raw + ' (' + (raw / FS * VREF).toFixed(4) + ' V)<br>normalized ' + lin + ' (' + (lin / FS * 100).toFixed(1) + '%)' + (S.st ? '<br>' + statLine(i) : ''); };
const fsrCurve = raw => { const dz = 0.015 * FS, f = FS * 13 / 16; let x = (raw - dz) / (f - dz); x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * x * FS; };

function buildUI() {
  S.hist = S.ch.map(() => new Uint16Array(SCOPE_N)); S.histL = S.ch.map(() => new Uint16Array(SCOPE_N)); S.hpos = 0; S.hcount = 0;
  const show = (id, on) => $(id).classList.toggle('hide', !on);
  show('gFaders', chOf(['slider']).length > 0); show('gKnobs', chOf(['pot', 'pot2w']).length > 0); show('gPress', chOf(['fsr']).length > 0);
  show('gEnc', !!S.enc); show('gTilt', !!S.i2c); show('gLid', !!S.i2c && lidDevs().length > 0);
  buildCal(); buildPanels(); buildSteps(); drawSteps(); initCanvases();
}
function buildPanels() {
  S.imu = null; S.lids = null; $('lidtargets').innerHTML = '';
  if (!S.i2c) return;
  const f32 = () => new Float32Array(IMU_N);
  S.imu = { a: [f32(), f32(), f32()], g: [f32(), f32(), f32()], pos: 0, cnt: 0, last: null, ms: [], rate: 0 };
  S.lids = lidDevs().map(() => ({ mm: new Uint16Array(LID_N), st: new Uint8Array(LID_N), pos: 0, cnt: 0, last: null, ms: [], rate: 0 }));
  $('lidtargets').innerHTML = S.lids.map((_, k) => '<div class="row"><label class="small">Lidar ' + (k + 1) + ' true target distance in mm (optional, for the accuracy check) <input id="tgt' + k + '" type="number" min="30" max="1200"></label></div>').join('');
}
function updateProg() {
  const n = S.steps.length, p = S.steps.filter(s => s.state === 'pass').length, f = S.steps.some(s => s.state === 'fail');
  $('dprog').textContent = n ? p + '/' + n + (f ? ' fail' : '') : ''; $('dprog').style.color = f ? C.bad : C.lava;
}

// ---- faders: caps that travel, a ghost tick shows the raw (tapered) position
function drawFaders() {
  const cv = $('cvFaders'); if (cv.offsetParent === null) return; const hot = hotReset(cv), { g, w, h } = fit(cv); g.clearRect(0, 0, w, h);
  const F = chOf(['slider']), n = F.length, colw = Math.min(150, (w - 8) / n), ty = 78, tl = 170;
  F.forEach((x, j) => {
    const i = x.i, cx = 8 + colw * (j + .5), lin = S.lastL ? S.lastL[i] : S.last[i], raw = S.last[i]; if (lin === undefined) return;
    const v = lin / FS, y = ty + (1 - v) * tl, col = COLORS[i % 8];
    txt(g, Math.round(v * 100), cx - 6, 52, '600 46px ' + FN, C.mist, 'right'); txt(g, '%', cx - 2, 52, '500 16px ' + FT, C.dim, 'left');
    g.fillStyle = C.vein; rr(g, cx - 3, ty, 6, tl, 3); g.fill();
    const gr = g.createLinearGradient(0, ty + tl, 0, ty); gr.addColorStop(0, C.amethyst); gr.addColorStop(1, C.lava);
    g.fillStyle = gr; rr(g, cx - 3, y, 6, ty + tl - y, 3); g.fill();
    g.strokeStyle = 'rgba(141,128,179,.45)'; g.lineWidth = 1; for (let t = 0; t <= 10; t++) { const yy = ty + tl * t / 10, L = t % 5 ? 4 : 9; g.beginPath(); g.moveTo(cx + 24, yy); g.lineTo(cx + 24 + L, yy); g.stroke(); }
    const ry = ty + (1 - raw / FS) * tl; g.fillStyle = C.dim; g.beginPath(); g.moveTo(cx - 26, ry); g.lineTo(cx - 33, ry - 4); g.lineTo(cx - 33, ry + 4); g.fill();
    const cg = g.createLinearGradient(0, y - 13, 0, y + 13); cg.addColorStop(0, '#4a2f83'); cg.addColorStop(1, '#1e1038');
    g.save(); g.shadowColor = 'rgba(255,79,163,.45)'; g.shadowBlur = 14 * v; g.fillStyle = cg; rr(g, cx - 22, y - 13, 44, 26, 6); g.fill(); g.restore();
    g.strokeStyle = 'rgba(236,228,255,.55)'; g.lineWidth = 1; rr(g, cx - 22, y - 13, 44, 26, 6); g.stroke();
    g.strokeStyle = C.lava; g.lineWidth = 2; g.beginPath(); g.moveTo(cx - 17, y); g.lineTo(cx + 17, y); g.stroke();
    txt(g, x.c.n.replace('FADER', 'Fader '), cx, ty + tl + 34, '500 13px ' + FT, C.mist); txt(g, 'raw ' + raw, cx, ty + tl + 50, '11px ' + FT, C.dim);
    hot.push({ x: cx - colw / 2, y: 0, w: colw, h, f: chTip(i) });
  });
}
// ---- knobs: rotate with the normalized value
function drawKnobs() {
  const cv = $('cvKnobs'); if (cv.offsetParent === null) return; const hot = hotReset(cv), { g, w, h } = fit(cv); g.clearRect(0, 0, w, h);
  const K = chOf(['pot', 'pot2w']), n = K.length, colw = Math.min(170, (w - 8) / n);
  K.forEach((x, j) => {
    const i = x.i, cx = 8 + colw * (j + .5), cy = 150, R = Math.min(colw / 2 - 26, 52), lin = S.lastL ? S.lastL[i] : S.last[i], raw = S.last[i]; if (lin === undefined) return;
    const v = lin / FS, a0 = .75 * Math.PI, a1 = a0 + 1.5 * Math.PI * v;
    txt(g, Math.round(v * 100), cx - 6, 52, '600 46px ' + FN, C.mist, 'right'); txt(g, '%', cx - 2, 52, '500 16px ' + FT, C.dim, 'left');
    g.lineCap = 'round'; g.lineWidth = 7; g.strokeStyle = C.vein; g.beginPath(); g.arc(cx, cy, R + 12, a0, a0 + 1.5 * Math.PI); g.stroke();
    const gr = g.createLinearGradient(cx - R, cy + R, cx + R, cy - R); gr.addColorStop(0, C.amethyst); gr.addColorStop(1, C.lava);

  const st = q.get('selftest'), scn0 = st === 'ok6' ? { t6: true } : null, scn = st.startsWith('bad') ? { bad: 1 } : st.startsWith('xtalk') ? { xtalk: 0 } : st === 'badimu5' ? { badimu: 1 } : st === 'err5' ? { i2cerr: 0 } : {};
  if (scn0) { scn.t6 = true; scn.t5 = true; }
  if (st.endsWith('5')) scn.t5 = true; if (st === 'badimu5') scn.badimu = true; if (st === 'bad5') scn.bad = 1;
  const r = runScripted(scn); document.title = 'SELFTEST ' + r; draw();
  const o = document.createElement('pre'); o.id = 'selftest'; o.textContent = r + '\n' + S.steps.map(s => s.title + '\n' + s.checks.map(c => (c.ok ? ' PASS ' : ' FAIL ') + c.name + ': ' + c.detail).join('\n')).join('\n'); document.body.appendChild(o);
} else {
  showBase(); drawScope(); autoReconnect(1);
  if (q.get('demo')) { const tv = q.get('t'); if (tv === '05' || tv === '06') $('testSel').value = tv === '06' ? '06_pots2w_enc' : '05_faders_imu_lidar'; if (q.get('drawer')) setDrawer(true); demoLive(); }
  if (q.get('cvlog')) setTimeout(() => { document.title = 'CV dpr' + devicePixelRatio + ' ' + [...document.querySelectorAll('canvas')].map(c => (c.id || c.className) + ':' + c.width + 'x' + c.height + ' css' + Math.round(c.getBoundingClientRect().height)).join(' | '); }, 5000);
}
