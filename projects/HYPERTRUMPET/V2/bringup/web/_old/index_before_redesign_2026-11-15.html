<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HYPERTRUMPET V2 bring-up</title>
<style>
:root{
  --bg:#0a0612; --panel:#130b22; --panel2:#1a1030; --line:#2c1c4d; --ink:#ece4ff; --dim:#8f7fb8;
  --v:#a78bfa; --m:#f472b6; --c:#67e8f9; --ok:#7cffb2; --bad:#ff5d7a; --warn:#ffcf5a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
h1{font-size:15px;letter-spacing:.18em;margin:0;font-weight:700;color:var(--v)}
h1 b{color:var(--m)}
.sp{flex:1}
button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer;letter-spacing:.06em}
button:hover{border-color:var(--v)}
button.pri{background:var(--v);color:#12081f;border-color:var(--v);font-weight:700}
button:disabled{opacity:.35;cursor:default}
.pill{padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.pill.on{color:var(--ok);border-color:var(--ok)} .pill.off{color:var(--bad);border-color:var(--bad)}
main{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1.2fr);gap:14px;padding:14px 16px}
@media(max-width:860px){main{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h2{margin:0 0 8px;font-size:12px;letter-spacing:.16em;color:var(--dim);font-weight:600;text-transform:uppercase}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cname{font-weight:700;letter-spacing:.1em}
.cpin{color:var(--dim);font-size:12px}
.big{font-size:34px;font-weight:700;letter-spacing:.02em;line-height:1.1}
.sub{color:var(--dim);font-size:12px}
canvas{display:block;width:100%;height:100px;max-width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:8px;font-size:12px}
.grid2 span:nth-child(odd){color:var(--dim)}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .dim{color:var(--dim)}
.step{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 6px;border-radius:8px;border:1px solid transparent}
.step.act{border-color:var(--v);background:var(--panel2)}
.step .dot{font-weight:700}
.step .t{font-weight:700}
.step .i{color:var(--dim);font-size:12px}
.chk{font-size:12px;margin-top:4px;display:grid;grid-template-columns:auto 1fr;gap:1px 10px}
.banner{font-size:20px;font-weight:700;letter-spacing:.14em;text-align:center;padding:14px;border-radius:10px;border:1px solid var(--line);color:var(--dim)}
.banner.pass{color:#06130c;background:var(--ok);border-color:var(--ok)} .banner.fail{color:#18040a;background:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.small{font-size:12px;color:var(--dim)}
select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit}
input[type=number]{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;width:130px}
.chip{display:inline-block;padding:2px 8px;margin:2px 4px 2px 0;border-radius:6px;border:1px solid var(--line)}
.chip.ok{border-color:var(--ok)}.chip.bad{border-color:var(--bad)}
#msg{padding:0 16px 10px;color:var(--warn);min-height:1em}
</style>
</head>
<body>
<header>
  <h1>HYPERTRUMPET <b>V2</b> / BRING-UP <span id="testname" class="dim"></span></h1>
  <select id="testSel" title="test view (follows the firmware when connected)"><option value="01_faders">01 faders</option><option value="05_faders_imu_lidar">05 faders + pots + FSR + IMU + lidars</option><option value="06_pots2w_enc">06 faders + 2-wire pots + encoders + IMU + lidars</option></select>
  <span id="conn" class="pill off">DISCONNECTED</span>
  <span id="fwinfo" class="small"></span>
  <span class="sp"></span>
  <button id="bConnect" class="pri">Connect</button>
  <button id="bDemo">Demo</button>
  <button id="bReset" disabled>Reset stats</button>
  <button id="bDfu" disabled>Enter DFU</button>
</header>
<div id="msg"></div>
<main>
  <div class="col">
    <div id="cards" class="col"></div>
    <div id="encwrap" class="col"></div>
    <div id="calwrap" class="col"></div>
    <div id="i2cwrap" class="col"></div>
    <div class="card"><h2>Link</h2>
      <div class="grid2" id="link"><span>sample rate</span><span id="lrate">-</span><span>frames dropped</span><span id="ldrop">-</span><span>stats frames</span><span id="lst">-</span></div>
    </div>
  </div>
  <div class="col">
    <div class="card"><h2>Scope (10 s, full scale 0 to 65535; faders shown linearized)</h2><canvas id="scope" data-h="230"></canvas>
      <div id="legend" class="small" style="margin-top:6px"></div></div>
    <div id="banner" class="banner">NO RESULT YET</div>
    <div class="card"><h2>Guided test</h2><div id="steps"></div>
      <div class="row"><button id="bBegin" class="pri" disabled>Begin step</button><button id="bSkip" disabled>Skip</button><button id="bRestart" disabled>Restart test</button><button id="bCopy" disabled>Copy report</button><button id="bBase" disabled>Save noise baseline</button></div>
      <div class="small" id="baseinfo" style="margin-top:8px"></div>
    </div>
  </div>
</main>
<script>
"use strict";
// ---------------------------------------------------------------- constants
const FS = 65535, VREF = 3.3;
const T = {                                   // PASS thresholds (see BRINGUP_PLAN.md, TEST 01)
  edgeLo: 0.02, edgeHi: 0.98,                 // full-scale sweep must reach <2% and >98%
  restPP: 64, restWarn: 160,                  // rest noise p-p, raw counts, 1 s window (200 samples)
  restRecheck: 1.5, restRecheckAdd: 16,       // later rest p-p <= max(1.5 x first, first + 16)
  backtrack: 0.02 * FS,                       // sweep must be monotonic within 2% FS
  jump: 10000,                                // one-sample step bigger than this = dropout/glitch
  xtalk: 0.01 * FS,                           // other channels' excursion during a sweep <= 1% FS
  cover: 30,                                  // sweep must touch >= 30 of 32 bins
  restSamples: 600, sweepTimeoutMs: 30000, sweepMinSamples: 100,
  rateMin: 150, dropMax: 0.02
};
const COLORS = ['#a78bfa', '#f472b6', '#67e8f9', '#fbbf24', '#34d399', '#fb923c', '#60a5fa', '#e879f9'];
const SCOPE_N = 2000;
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- state
const S = {
  test: '', fw: '', ch: [], N: 0, hist: [], hpos: 0, hcount: 0, last: [], st: null,
  seq: 0, lastSeq: -1, drops: 0, frames: 0, stFrames: 0, rate: 0, msBuf: [],
  steps: [], cur: -1, run: null, rest1: null, connected: false, demo: false, port: null, writer: null,
  cards: [], dirty: false, staleT: 0
};

// ---------------------------------------------------------------- line handling
function onLine(line) {
  let m; try { m = JSON.parse(line); } catch (e) { return; }
  if (m.t === 'hello') return onHello(m);
  if (m.t === 's') return onSample(m);
  if (m.t === 'st') { S.st = m; S.stFrames++; mark(); }
  if (m.t === 'imu') return onImu(m);
  if (m.t === 'lid') return onLid(m);
}
function onHello(m) {
  const sig = m.test + '|' + m.ch.map(c => c.n).join(',') + '|' + (m.i2c ? 'i2c' : '') + '|' + (m.enc ? 'enc' : '');
  S.fw = m.fw; $('fwinfo').textContent = 'fw ' + m.fw + '  test ' + m.test + '  ' + m.rate + ' Hz  adc ' + m.adc_bits + 'b x' + m.ovs;
  S.i2c = m.i2c || null; S.helloMs = m.ms; S.calFw = m.cal || null; S.invFw = m.inv || null; S.enc = !!m.enc;
  if (m.calc && !S.calResent) { S.calResent = true; try { const o = JSON.parse(localStorage.getItem('ht_cal') || '{}'); m.ch.forEach((c, i) => { if (!m.calc[i] && o[c.n]) { send('cal ' + i + ' ' + o[c.n].join(' ')); if (S.cal && S.cal[i]) { S.cal[i].bp = o[c.n]; S.cal[i].sent = true; } } }); } catch (e) {} }
  const sel = $('testSel'); if ([...sel.options].some(o => o.value === m.test)) sel.value = m.test;
  if (S.sigKey !== sig) { S.sigKey = sig; S.test = m.test; S.ch = m.ch; S.N = m.ch.length; buildUI(); }
  if (S.run && S.run.s.kind === 'i2c') i2cStepFeed(m);
  mark();
}
// ---- IMU / lidar streams (test 05)
const IMU_N = 1000, LID_N = 400;
function onImu(m) {
  const I = S.imu; if (!I) return;
  const a = m.a.map(x => x / 16384), g = m.g.map(x => x / 131);
  for (let k = 0; k < 3; k++) { I.a[k][I.pos] = a[k]; I.g[k][I.pos] = g[k]; }
  I.pos = (I.pos + 1) % IMU_N; if (I.cnt < IMU_N) I.cnt++;
  I.last = { a, g, ra: m.a, rg: m.g, mag: Math.hypot(a[0], a[1], a[2]), pitch: m.pr[0] / 100, roll: m.pr[1] / 100, tmp: m.tmp / 340 + 36.53 };
  I.ms.push(m.ms); if (I.ms.length > 100) I.ms.shift();
  if (I.ms.length > 10) I.rate = 1000 * (I.ms.length - 1) / (I.ms[I.ms.length - 1] - I.ms[0]);
  if (S.run && (S.run.s.kind === 'imu_rest' || S.run.s.kind === 'imu_faces')) imuStepFeed(m, a, g);
  mark();
}
function onLid(m) {
  const k = m.i || 0, L = S.lids && S.lids[k]; if (!L) return;
  L.mm[L.pos] = m.mm; L.st[L.pos] = m.st; L.pos = (L.pos + 1) % LID_N; if (L.cnt < LID_N) L.cnt++;
  L.last = m; L.ms.push(m.ms); if (L.ms.length > 40) L.ms.shift();
  if (L.ms.length > 5) L.rate = 1000 * (L.ms.length - 1) / (L.ms[L.ms.length - 1] - L.ms[0]);
  if (S.run && S.run.s.kind === 'lid_fixed' && S.run.s.lk === k) lidStepFeed(m);
  mark();
}
function onSample(m) {
  if (!S.N) return;
  if (S.lastSeq >= 0 && m.n !== S.lastSeq + 1) S.drops += Math.max(0, m.n - S.lastSeq - 1);
  S.lastSeq = m.n; S.frames++;
  S.msBuf.push(m.ms); if (S.msBuf.length > 200) S.msBuf.shift();
  if (S.msBuf.length > 20) S.rate = 1000 * (S.msBuf.length - 1) / (S.msBuf[S.msBuf.length - 1] - S.msBuf[0]);
  const LV = m.l || m.v;
  for (let i = 0; i < S.N; i++) { S.hist[i][S.hpos] = m.v[i]; S.histL[i][S.hpos] = LV[i]; }
  S.hpos = (S.hpos + 1) % SCOPE_N; if (S.hcount < SCOPE_N) S.hcount++;
  S.last = m.v; S.lastL = LV; if (m.e) { S.encv = m.e; if (S.run && S.run.s.kind === 'enc') encStepFeed(m); }
  if (S.run && (S.run.s.kind === 'rest' || S.run.s.kind === 'sweep' || S.run.s.kind === 'fsr')) stepSample(m.v, m.ms, LV);
  mark();
  if (S.connected && !S.demo) { clearTimeout(S.staleT); S.staleT = setTimeout(stale, 1500); }
}
function stale() { setMsg('No data for 1.5 s. Check USB, or the firmware is not the bring-up app.'); setConn(false, 'NO DATA'); }

// ---------------------------------------------------------------- UI build
function buildUI() {
  $('testname').textContent = S.test;
  S.hist = S.ch.map(() => new Uint16Array(SCOPE_N)); S.histL = S.ch.map(() => new Uint16Array(SCOPE_N)); S.hpos = 0; S.hcount = 0;
  const cards = $('cards'); cards.innerHTML = ''; S.cards = [];
  S.ch.forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'card';
    d.innerHTML = '<div class="chead"><span class="cname" style="color:' + COLORS[i % 8] + '">' + c.n + '</span><span class="cpin">' + c.pin + ' / Seed pin ' + c.phys + '</span></div>' +
      '<div class="big"><span class="raw">-</span> <span class="sub pct"></span> <span class="sub rv"></span></div>' +
      '<canvas class="meter" data-h="46"></canvas>' +
      '<div class="grid2"><span>voltage</span><span class="volt">-</span><span>min / max seen</span><span class="mm">-</span>' +
      '<span>noise p-p now (1 s)</span><span class="pp">-</span><span>noise p-p best</span><span class="ppb">-</span>' +
      '<span>coverage</span><span class="cov">-</span><span>status</span><span class="stat">-</span></div>';
    cards.appendChild(d);
    S.cards.push({ el: d, raw: d.querySelector('.raw'), pct: d.querySelector('.pct'), rv: d.querySelector('.rv'), cv: d.querySelector('canvas'), volt: d.querySelector('.volt'),
      mm: d.querySelector('.mm'), pp: d.querySelector('.pp'), ppb: d.querySelector('.ppb'), cov: d.querySelector('.cov'), stat: d.querySelector('.stat') });
  });
  $('legend').innerHTML = S.ch.map((c, i) => '<span style="color:' + COLORS[i % 8] + '">&#9632; ' + c.n + '</span>').join('  ');
  buildEnc(); buildCal(); buildPanels(); buildSteps(); drawSteps(); initCanvases();
}
function buildSteps() {
  const sw = S.ch.map((c, i) => ({ c, i })).filter(x => x.c.k === 'slider' || x.c.k === 'pot' || x.c.k === 'pot2w' || x.c.k === 'stick' || x.c.k === 'fsr');
  S.steps = [{ id: 'rest', kind: 'rest', title: 'Rest noise', instr: 'Hands off everything for 3 s. Wires still, nothing touching the faders.', state: 'idle', checks: [] }];
  if (S.i2c) S.steps.unshift({ id: 'i2c', kind: 'i2c', title: 'I2C devices', instr: 'Scan shows 0x68 and 0x29, both devices ok, zero I2C errors for 10 s. Hands off.', state: 'idle', checks: [] });
  sw.forEach(x => S.steps.push(x.c.k === 'fsr' ? { id: 'fsr' + x.i, kind: 'fsr', ch: x.i, state: 'idle', checks: [], title: 'Press ' + x.c.n,
    instr: 'Keep hands off for 0.5 s, then press ' + x.c.n + ' firmly (above 60% FS), then let go fast. Others untouched.' } : { id: 'sw' + x.i, kind: 'sweep', ch: x.i, state: 'idle', checks: [],
    title: 'Sweep ' + x.c.n,
    instr: x.c.k === 'fsr' ? 'Press ' + x.c.n + ' from nothing to hardest, then release. Others untouched.'
      : 'Move ' + x.c.n + ' from the very bottom to the very top, slowly (2 to 4 s). Touch nothing else.' }));
  if (sliders().length) S.steps.unshift({ id: 'cal', kind: 'cal', title: 'Calibrate faders and pots', instr: 'Optional but recommended (faders are A taper, pots C500K reverse-log). Capture bottom, 25 %, 50 %, 75 %, top for each fader in the Fader calibration card, then Fit and send. Skip keeps the default A-taper inverse.', state: 'idle', checks: [] });
  S.steps.push({ id: 'rest2', kind: 'rest', title: 'Rest noise recheck', instr: 'Let go of everything again. Noise must not be worse than the first rest step.', state: 'idle', checks: [] });
  if (S.i2c) addI2cSteps();
  if (S.enc) addEncSteps();
  S.cur = 0; S.run = null; S.rest1 = null;
  $('bBegin').disabled = !S.connected; $('bSkip').disabled = !S.connected; $('bRestart').disabled = false;
  $('banner').className = 'banner'; $('banner').textContent = 'NO RESULT YET';
  showBase();
}
function drawSteps() {
  const el = $('steps'); el.innerHTML = '';
  S.steps.forEach((s, i) => {
    const d = document.createElement('div'); d.className = 'step' + (i === S.cur ? ' act' : '');
    const dot = s.state === 'pass' ? '<span class="dot ok">&#10003;</span>' : s.state === 'fail' ? '<span class="dot bad">&#10005;</span>' : s.state === 'run' ? '<span class="dot warn">&#9654;</span>' : '<span class="dot dim">' + (i + 1) + '</span>';
    let h = dot + '<div><div class="t">' + s.title + '</div><div class="i">' + s.instr + '</div>';
    if (s.state === 'run') h += '<div class="i warn">' + (s.progress || 'measuring') + '</div>';
    if (s.checks.length) h += '<div class="chk">' + s.checks.map(c => '<span class="' + (c.ok ? 'ok' : 'bad') + '">' + (c.ok ? 'PASS' : 'FAIL') + '</span><span>' + c.name + ': ' + c.detail + '</span>').join('') + '</div>';
    d.innerHTML = h + '</div>'; el.appendChild(d);
  });
  const all = S.steps.length && S.steps.every(s => s.state === 'pass' || s.state === 'skip');
  const anyFail = S.steps.some(s => s.state === 'fail');
  const done = S.steps.every(s => s.state === 'pass' || s.state === 'fail' || s.state === 'skip');
  const b = $('banner');
  if (done && all && S.steps.some(s => s.state === 'pass')) { b.className = 'banner pass'; b.textContent = 'TEST ' + S.test + ' PASS'; }
  else if (done && anyFail) { b.className = 'banner fail'; b.textContent = 'TEST ' + S.test + ' FAIL'; }
  else { b.className = 'banner'; b.textContent = 'NO RESULT YET'; }
  $('bCopy').disabled = !S.steps.some(s => s.checks.length);
  $('bBase').disabled = !S.rest1;
}

// ---------------------------------------------------------------- step engine
function begin() {
  const s = S.steps[S.cur]; if (!s || !S.N) return;
  s.checks = []; s.state = 'run';
  if (s.kind === 'enc') { S.run = { s }; s.progress = 'turn / press now'; }
  else if (s.kind === 'cal') { S.run = { s }; s.progress = 'use the Fader calibration card'; }
  else if (s.kind === 'i2c') { S.run = { s, ms0: S.helloMs, err0: S.i2c ? S.i2c.err : 0, seen: 0, bad: 0 }; s.progress = 'waiting for hello frames'; }
  else if (s.kind === 'fsr') S.run = { s, ms0: null, rest: [], peak: 0, lastHi: -1, back: -1, t0: performance.now(), mn: S.ch.map(() => 65535), mx: S.ch.map(() => 0), n: 0 };
  else if (s.kind === 'imu_rest') S.run = { s, a: [[], [], []], g: [[], [], []], n: 0, ms: [] };
  else if (s.kind === 'imu_faces') S.run = { s, hit: { '+X': 0, '-X': 0, '+Y': 0, '-Y': 0, '+Z': 0, '-Z': 0 }, worst: {} };
  else if (s.kind === 'lid_fixed') S.run = { s, mm: [], ok: 0, n: 0, ms: [] };
  else if (s.kind === 'rest') S.run = { s, buf: S.ch.map(() => []) };
  else S.run = { s, t0: performance.now(), path: [], lo: null, hi: null, mn: S.ch.map(() => 65535), mx: S.ch.map(() => 0), n: 0, first: null, firstIdx: -1, hiIdx: -1, loIdx: -1 };
  drawSteps();
}
function stepSample(v, ms, lv) {
  const r = S.run, s = r.s;
  if (s.kind === 'fsr') return fsrFeed(v, ms);
  if (s.kind === 'rest') {
    v.forEach((x, i) => r.buf[i].push(x));
    s.progress = r.buf[0].length + ' / ' + T.restSamples + ' samples';
    if (r.buf[0].length >= T.restSamples) finishRest(r);
    if (r.buf[0].length % 50 === 0) drawSteps();
    return;
  }
  const w = lv || v;                                     // sweep checks use the LINEARIZED values
  const c = s.ch; r.n++; r.path.push(w[c]);
  for (let i = 0; i < S.N; i++) { if (w[i] < r.mn[i]) r.mn[i] = w[i]; if (w[i] > r.mx[i]) r.mx[i] = w[i]; }
  const x = w[c], idx = r.path.length - 1;
  if (x < T.edgeLo * FS) { r.loIdx = idx; if (r.first === null) r.first = 'lo'; }
  if (x > T.edgeHi * FS) { r.hiIdx = idx; if (r.first === null) r.first = 'hi'; }
  const lo = r.mn[c] < T.edgeLo * FS, hi = r.mx[c] > T.edgeHi * FS;
  s.progress = (lo ? 'bottom seen' : 'bottom not yet') + ', ' + (hi ? 'top seen' : 'top not yet') + '  (' + Math.round(x / FS * 100) + '%)';
  if (r.n % 20 === 0) drawSteps();
  const kindFsr = S.ch[c].k === 'fsr';
  if ((lo && hi) || (kindFsr && hi)) {
    // finish once the mover sits at the second extreme it was waiting for
    const secondFirstHi = r.first === 'lo' ? r.hiIdx === idx : r.loIdx === idx;
    if (secondFirstHi || kindFsr) finishSweep(r);
  } else if (performance.now() - r.t0 > T.sweepTimeoutMs) finishSweep(r, true);
}
function fsrFeed(v, ms) {
  const r = S.run, s = r.s, c = s.ch, x = v[c]; r.n++;
  if (r.ms0 === null) r.ms0 = ms;
  for (let i = 0; i < S.N; i++) { if (v[i] < r.mn[i]) r.mn[i] = v[i]; if (v[i] > r.mx[i]) r.mx[i] = v[i]; }
  if (ms - r.ms0 < 500) { r.rest.push(x); s.progress = 'hands off... measuring rest'; return; }
  if (x > r.peak) r.peak = x;
  if (x >= 0.10 * FS) { r.lastHi = ms; r.back = -1; }
  else if (r.back < 0 && r.peak > 0.6 * FS && r.lastHi > 0 && x < 0.02 * FS) { r.back = ms; return finishFsr(r); }
  s.progress = 'peak ' + (r.peak / FS * 100).toFixed(0) + '% (need > 60%), now ' + (x / FS * 100).toFixed(1) + '%'; if (r.n % 20 === 0) drawSteps();
  if (performance.now() - r.t0 > 30000) finishFsr(r);
}
function finishFsr(r) {
  const s = r.s, c = s.ch, ck = [], rest = r.rest.length ? Math.max(...r.rest) : 65535;
  ck.push({ name: 'rest level', ok: rest < 0.02 * FS, detail: 'max ' + rest + ' = ' + pct(rest) + ' before pressing, need < 2% FS' });
  ck.push({ name: 'firm press peak', ok: r.peak > 0.6 * FS, detail: 'peak ' + r.peak + ' = ' + pct(r.peak) + ', need > 60% FS' });
  const fall = r.back > 0 && r.lastHi > 0 ? r.back - r.lastHi : -1;

      if (S.ch[i].k === 'fsr') { const pk = st.max[i] / FS; cd.stat.textContent = 'press peak ' + (pk * 100).toFixed(1) + '%  rest now ' + (v / FS * 100).toFixed(2) + '%' + (v < 0.02 * FS ? ' (rest ok)' : '') + (pk > 0.6 ? '  firm press seen' : '  (press harder: need > 60%)'); cd.stat.className = pk > 0.6 ? 'ok' : 'dim'; }
      else if (S.ch[i].k === 'pot2w') { const okk = st.max[i] > 0.9 * FS && st.min[i] < 0.15 * FS; cd.stat.textContent = okk ? 'full travel seen (Rx 0 to 500k)' : 'travel incomplete (raw ' + st.min[i] + ' to ' + st.max[i] + ', expect about 5600 to 65000)'; cd.stat.className = okk ? 'ok' : 'dim'; }
      else { cd.stat.textContent = st.min[i] < T.edgeLo * FS && st.max[i] > T.edgeHi * FS ? 'full range seen' : 'range incomplete'; cd.stat.className = st.min[i] < T.edgeLo * FS && st.max[i] > T.edgeHi * FS ? 'ok' : 'dim'; }
    }
    // meter: bar + 2%/98% pass zones + 32-bin coverage strip
    const { g, w, h } = fit(cd.cv); g.clearRect(0, 0, w, h);
    g.fillStyle = '#1d1236'; g.fillRect(0, 0, w, 22);
    g.fillStyle = COLORS[i % 8]; g.fillRect(0, 0, w * v / FS, 22);
    g.fillStyle = 'rgba(124,255,178,.5)'; g.fillRect(0, 0, 2, 22); g.fillRect(w - 2, 0, 2, 22);
    g.strokeStyle = '#8f7fb8'; g.lineWidth = 1; g.beginPath(); g.moveTo(w * T.edgeLo, 0); g.lineTo(w * T.edgeLo, 26); g.moveTo(w * T.edgeHi, 0); g.lineTo(w * T.edgeHi, 26); g.stroke();
    for (let b = 0; b < 32; b++) { const hit = st && (st.cov[i] >>> b & 1); g.fillStyle = hit ? COLORS[i % 8] : '#241640'; g.fillRect(b * w / 32 + 1, 30, w / 32 - 2, 12); }
  });
  drawScope(); drawPanels(); drawCal(); drawEnc();
}
function drawScope() {
  const { g, w, h } = fit($('scope')); g.clearRect(0, 0, w, h);
  g.strokeStyle = '#2c1c4d'; g.lineWidth = 1; g.fillStyle = '#8f7fb8'; g.font = '10px monospace';
  for (let k = 0; k <= 4; k++) { const y = 6 + (h - 12) * (1 - k / 4); g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); g.fillText(k * 25 + '%', 3, y - 2); }
  if (!S.hcount) return;
  S.histL.forEach((hs, i) => {
    g.strokeStyle = COLORS[i % 8]; g.lineWidth = 1.5; g.beginPath();
    const n = S.hcount, start = (S.hpos - n + SCOPE_N) % SCOPE_N;
    for (let k = 0; k < n; k++) {
      const x = w - (n - 1 - k) * w / SCOPE_N, y = 6 + (h - 12) * (1 - hs[(start + k) % SCOPE_N] / FS);
      k ? g.lineTo(x, y) : g.moveTo(x, y);

}
function setMsg(t) { $('msg').textContent = t || ''; }
function setConn(on, label) { const p = $('conn'); p.className = 'pill ' + (on ? 'on' : 'off'); p.textContent = label || (on ? 'STREAMING' : 'DISCONNECTED'); }
function ctl(on) { ['bReset', 'bDfu', 'bBegin', 'bSkip'].forEach(id => $(id).disabled = !on); }

// ---------------------------------------------------------------- WebSerial
const SFILT = [{ usbVendorId: 0x0483 }, { usbVendorId: 0xcafe }];
async function connect() {
  if (!('serial' in navigator)) return setMsg('WebSerial missing: use Chrome or Edge on http://localhost (see README).');
  try { await openPort(await navigator.serial.requestPort({ filters: SFILT })); } catch (e) { setMsg('Connect failed: ' + e.message); }
}
async function openPort(port) {
  if (S.connected && !S.demo) return;
  await port.open({ baudRate: 115200 });
  try { await port.setSignals({ dataTerminalReady: true, requestToSend: true }); } catch (e) {}
  S.port = port; S.demo = false; S.connected = true; S.expectReboot = false; setMsg(''); setConn(true); ctl(true); resetLink();
  S.writer = port.writable.getWriter(); send('hello');
  readLoop(port);
}
async function autoReconnect(tries) {            // after a flash/replug: re-open the permitted port, a few tries, then give up
  if (!navigator.serial || (S.connected && !S.demo)) return;
  for (let i = 0; i < tries; i++) {
    try {
      const ps = (await navigator.serial.getPorts()).filter(p => { const k = p.getInfo(); return k.usbVendorId === 0x0483 || k.usbVendorId === 0xcafe; });
      if (ps.length) { await openPort(ps[0]); return; }
    } catch (e) {}
    await new Promise(r => setTimeout(r, 700));
  }
  setMsg('Seed rebooted or re-enumerated. Press Connect.');
}
async function readLoop(port) {
  const dec = new TextDecoder(); let buf = '';
  try {
    while (port.readable) {
      const rd = port.readable.getReader();
      try { for (;;) { const { value, done } = await rd.read(); if (done) break;
        buf += dec.decode(value, { stream: true }); let k;
        while ((k = buf.indexOf('\n')) >= 0) { const l = buf.slice(0, k); buf = buf.slice(k + 1); if (l.length > 1) onLine(l); }
        if (buf.length > 4096) buf = ''; } } finally { rd.releaseLock(); }
    }
  } catch (e) { setMsg('Serial read ended: ' + e.message); }
  S.connected = false; S.writer = null; clearTimeout(S.staleT); setConn(false); ctl(false);
}
function send(s) { if (S.writer) S.writer.write(new TextEncoder().encode(s + '\n')).catch(() => {}); }
function resetLink() { S.calResent = false; S.lastSeq = -1; S.drops = 0; S.frames = 0; S.stFrames = 0; S.msBuf = []; S.rate = 0; S.sigKey = ''; S.st = null; }

// ---------------------------------------------------------------- demo / self-test feed (same parser as the real stream)
function simLines(scn, nCh) {                // generates JSON lines for a scripted run, 200 Hz
  const out = []; let seq = 0, ms = 1000; const noise = scn.noise || 8;
  const ch = ['FADER1', 'FADER2', 'FADER3'].map((n, i) => ({ n, k: 'slider', pin: ['A3/D18', 'A4/D19', 'A5/D20'][i], phys: 25 + i }));
  const t5 = !!scn.t5, nz = () => Math.random() - .5;
  const t6 = !!scn.t6;
  if (t6) { ch.push({ n: 'POT1', k: 'pot2w', pin: 'A6/D21', phys: 28 }, { n: 'POT2', k: 'pot2w', pin: 'A7/D22', phys: 29 }); } else if (t5) ch.push({ n: 'FSR', k: 'fsr', pin: 'A8/D23', phys: 30 });
  const NC = ch.length;
  const hello = () => out.push(JSON.stringify(Object.assign({ t: 'hello', test: t6 ? '06_pots2w_enc' : t5 ? '05_faders_imu_lidar' : '01_faders', fw: 'sim', rate: 200, adc_bits: 16, ovs: 32, win: 200, ms, ch },
    (t6 ? { enc: 2 } : {}), t5 ? { i2c: { scl: 'D11/12', sda: 'D12/13', err: scn.i2cerr || 0, scan: [41, 48, 104], imu: { s: 'ok', who: 104 }, lid: { s: 'ok', id: 60108, addr: 48, dbg: [10, 10, 3, 17] }, lid2: { s: 'ok', id: 60108, addr: 41, dbg: [10, 10, 3, 17] } } } : {})));
  hello();
  let ori = [0, 0, scn.badimu ? 20000 : 16384], lidmm = 300;
  const rest = t6 ? [20000, 33000, 45000, 30000, 12000] : t5 ? [20000, 33000, 45000, 120] : [20000, 33000, 45000];
  const E = [0, 0, 0, 0, 0, 0, 0, 0]; const cur = rest.slice();
  const min = rest.map(() => 65535), max = rest.map(() => 0), cov = rest.map(() => 0);
  const frame = (lvl) => { // lvl: array of 3 target values
    seq++; ms += 5; const v = lvl.map(x => Math.max(0, Math.min(65535, Math.round(x + (Math.random() - .5) * noise))));
    if (t5) {
      if (seq % 200 === 0) hello();
      if (seq % 2 === 0) { const a = ori.map(x => Math.round(x + nz() * 6)); const pr = [Math.round(Math.atan2(-a[0], Math.hypot(a[1], a[2])) * 5729.578), Math.round(Math.atan2(a[1], a[2]) * 5729.578)];
        out.push(JSON.stringify({ t: 'imu', ms, a, g: [Math.round(nz() * 40 + 20), Math.round(nz() * 40), Math.round(nz() * 40 - 10)], tmp: -3900, pr })); }
      if (seq % 6 === 0) out.push(JSON.stringify({ t: 'lid', ms, mm: Math.round(lidmm + nz() * 4), st: 9 }));
      if (seq % 6 === 3) out.push(JSON.stringify({ t: 'lid', i: 1, ms, mm: Math.round(lidmm + 150 + nz() * 4), st: 9 }));
    }
    v.forEach((x, i) => { min[i] = Math.min(min[i], x); max[i] = Math.max(max[i], x); cov[i] |= 1 << (x >> 11); });
    out.push(JSON.stringify(Object.assign({ t: 's', n: seq, ms, v }, t6 ? { e: E.slice() } : {})));
    if (seq % 10 === 0) out.push(JSON.stringify({ t: 'st', min: min.slice(), max: max.slice(), pp: rest.map(() => noise), ppmin: rest.map(() => noise), cov: cov.map(c => c >>> 0), fill: 200 }));
  };
  const hold = n => { for (let i = 0; i < n; i++) frame(cur); };
  if (t5) hold(2200);                                           // I2C devices step (10 s)
  hold(700);                                                    // rest step
  for (let f = 0; f < (t6 ? 5 : 3); f++) {                       // sweep each fader / pot (bottom -> top)
    const bad = scn.bad === f;
    for (let i = 0; i <= 600; i++) { cur[f] = i / 600 * 65535; if (bad && i === 300) cur[f] += 14000; if (bad && i === 301) cur[f] -= 14000; if (scn.xtalk === f && i === 300) cur[(f + 1) % 3] += 3000; frame(cur); }
    hold(40);
  }
  if (t6) { hold(60); } else if (t5) { hold(200); for (let i = 0; i <= 40; i++) { cur[3] = i / 40 * 50000; frame(cur); } hold(40); for (let i = 0; i < 6; i++) { cur[3] = 50000 * (1 - (i + 1) / 6); frame(cur); } cur[3] = 120; hold(100); }
  hold(700);                                                    // rest recheck
  if (t5) {
    hold(700);                                                  // IMU rest, flat
    [[16384, 0, 0], [-16384, 0, 0], [0, 16384, 0], [0, -16384, 0], [0, 0, 16384], [0, 0, -16384]].forEach(o => { ori = o.slice(); hold(260); });
    ori = [0, 0, 16384]; hold(60); hold(700); hold(760);        // lidar 1 then lidar 2 fixed targets
  }
  if (t6) {                                                      // encoders: 20 detents cw, 20 ccw, 5 presses each
    hold(200);
    [0, 1].forEach(k => { for (let i = 0; i < 80; i++) { E[k * 4]++; hold(2); } for (let i = 0; i < 80; i++) { E[k * 4]--; hold(2); } hold(40);
      for (let p = 0; p < 5; p++) { E[k * 4 + 1] = 1; hold(12); E[k * 4 + 1] = 0; E[k * 4 + 2]++; hold(12); } hold(260); });
  }
  return out;
}
function runScripted(scn) {                  // synchronous, no timers: drives the real step engine
  resetLink(); S.connected = true; S.demo = true;
  const lines = simLines(scn); let k = 0;
  const feed = n => { for (let i = 0; i < n && k < lines.length; i++) onLine(lines[k++]); };
  feed(2); while (S.steps[S.cur] && S.steps[S.cur].kind === 'cal') { S.steps[S.cur].state = 'skip'; S.cur++; }
  begin();                                              // hello + first sample, start rest
  let guard = 0;
  while (k < lines.length && guard++ < 100000) {
    feed(1);
    if (S.run) continue;
    const s = S.steps[S.cur]; if (!s) break;
    if (s.kind === 'cal') { s.state = 'skip'; S.cur++; continue; }
    if (s.state === 'idle') { feed(60); begin(); }   // settle like a human would before pressing Begin
    else if (s.state === 'fail') { if (S.cur < S.steps.length - 1) { S.cur++; feed(60); begin(); } else break; }
    else if (s.state === 'pass' && S.cur === S.steps.length - 1) break;
  }
  drawSteps();
  return S.steps.map(s => s.id + ':' + s.state).join(' ') + ' | ' + $('banner').textContent;
}
let demoTimer = 0;
function demoLive() {
  if (demoTimer) { clearInterval(demoTimer); demoTimer = 0; S.demo = false; setConn(false); ctl(false); return; }
  resetLink(); S.connected = true; S.demo = true; setConn(true, 'DEMO'); ctl(true); setMsg('Demo: synthetic data, not the Seed.');
  const lines = simLines({ noise: 10, t5: $('testSel').value.startsWith('05') }); let k = 0;
  demoTimer = setInterval(() => { for (let i = 0; i < 2 && k < lines.length; i++) onLine(lines[k++]); if (k >= lines.length) k = 3; }, 10);
}

// ---------------------------------------------------------------- wiring
$('testSel').onchange = () => { if (S.connected && !S.demo && $('testSel').value !== S.test) { $('testSel').value = S.test; setMsg('The firmware reports test ' + S.test + '; the view follows the firmware. Flash another test to change it.'); } };
$('bConnect').onclick = connect;
$('bDemo').onclick = demoLive;
$('bReset').onclick = () => { send('reset'); S.st = null; mark(); };
$('bDfu').onclick = () => { if (confirm('Reboot the Seed into the bootloader for reflash?')) { send('dfu'); S.expectReboot = true; setMsg('DFU sent. The port will vanish: flash, then Connect again.'); } };
$('bBegin').onclick = begin;
$('bSkip').onclick = () => { if (S.run) { S.run.s.state = 'idle'; S.run = null; } const s = S.steps[S.cur]; if (s) s.state = 'skip'; if (S.cur < S.steps.length - 1) S.cur++; drawSteps(); };
$('bRestart').onclick = () => { S.run = null; buildSteps(); drawSteps(); send('reset'); };
$('bBase').onclick = () => saveBase(false);
$('bCopy').onclick = () => {
  const t = ['HYPERTRUMPET V2 bring-up ' + S.test + '  fw ' + S.fw, $('banner').textContent].concat(S.steps.map(s => s.title + ': ' + s.state + '\n' + s.checks.map(c => '  ' + (c.ok ? 'PASS ' : 'FAIL ') + c.name + ': ' + c.detail).join('\n'))).join('\n');
  navigator.clipboard && navigator.clipboard.writeText(t).catch(() => {});
};
initCanvases();
if (navigator.serial) {
  navigator.serial.addEventListener('disconnect', () => { S.connected = false; S.writer = null; clearTimeout(S.staleT); setConn(false, 'REBOOTING'); ctl(false); setMsg(S.expectReboot ? 'Seed rebooted into DFU / flashing. It reconnects by itself when it is back; if not, press Connect.' : 'Seed disconnected or rebooted. Reconnecting automatically; if it does not come back press Connect.'); });
  navigator.serial.addEventListener('connect', () => autoReconnect(8));
}
const q = new URLSearchParams(location.search);
if (q.get('selftest') === 'cal') {                // fit accuracy for several taper exponents
  const out = []; [[2.737, 'slider'], [3.5, 'slider'], [1.5, 'slider'], [1.0, 'slider'], [0.234, 'pot'], [0.5, 'pot']].forEach(([n, kd]) => { const raws = CAL_POS.map(p => Math.round(Math.pow(p, n) * FS)); const r = fitCal(raws, kd); let worst = 0;
    if (r.err) out.push('n=' + n + ' ' + r.err); else { for (let i = 0; i <= 100; i++) { const p = i / 100, raw = Math.pow(p, n) * FS, e = Math.abs(linApply(r.bp, raw) / FS - p); if (e > worst) worst = e; } out.push(kd + ' n=' + n + ' worst lin error ' + (worst * 100).toFixed(2) + '% FS bp=' + r.bp.join(',')); } });
  const o = document.createElement('pre'); o.id = 'selftest'; o.textContent = out.join('\n'); document.body.appendChild(o);
} else if (q.get('selftest')) {                       // headless check of the PASS/FAIL logic: ?selftest=ok|bad|xtalk
  const st = q.get('selftest'), scn0 = st === 'ok6' ? { t6: true } : null, scn = st.startsWith('bad') ? { bad: 1 } : st.startsWith('xtalk') ? { xtalk: 0 } : st === 'badimu5' ? { badimu: 1 } : st === 'err5' ? { i2cerr: 0 } : {};
  if (scn0) { scn.t6 = true; scn.t5 = true; }
  if (st.endsWith('5')) scn.t5 = true; if (st === 'badimu5') scn.badimu = true; if (st === 'bad5') scn.bad = 1;
  const r = runScripted(scn); document.title = 'SELFTEST ' + r; draw();
  const o = document.createElement('pre'); o.id = 'selftest'; o.textContent = r + '\n' + S.steps.map(s => s.title + '\n' + s.checks.map(c => (c.ok ? ' PASS ' : ' FAIL ') + c.name + ': ' + c.detail).join('\n')).join('\n'); document.body.appendChild(o);
} else {
  showBase(); drawScope(); autoReconnect(1);
  if (q.get('demo')) { if (q.get('t') === '05') $('testSel').value = '05_faders_imu_lidar'; demoLive(); }
  if (q.get('cvlog')) setTimeout(() => { document.title = 'CV dpr' + devicePixelRatio + ' ' + [...document.querySelectorAll('canvas')].map(c => (c.id || c.className) + ':' + c.width + 'x' + c.height + ' css' + Math.round(c.getBoundingClientRect().height)).join(' | '); }, 5000);
}
