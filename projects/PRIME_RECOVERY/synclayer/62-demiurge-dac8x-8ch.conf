# PRIME NEPTR (gorpi7v5): the DAC8x/ADC8x HAT is 8 in / 8 out, playback and capture
# locked to the same channel count. 50-demiurge.conf forces every platform card to
# 2ch FL/FR (written for the old DAC+ADC Pro), which would leave only lane 1 alive.
# Open this card as 8 channels so all four I2S lanes reach the graph.
monitor.alsa.rules = [
    {
        matches = [
            { node.name = "~alsa_output\\.platform-soc_.*_sound\\.pro-output-0" }
            { node.name = "~alsa_input\\.platform-soc_.*_sound\\.pro-input-0"  }
        ]
        actions = {
            update-props = {
                audio.channels = 8
                audio.position = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 AUX7 ]
            }
        }
    }
]
