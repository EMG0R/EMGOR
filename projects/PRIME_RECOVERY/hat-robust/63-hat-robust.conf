# PROPOSED, NOT DEPLOYED. Copy to ~/.config/wireplumber/wireplumber.conf.d/63-hat-robust.conf
# (sorts after 60/61/62 so it wins), then the HAT node picks it up on the next
# reopen (hat-reset, or an engine start). Does not touch live.conf or quantum.
#
# Why (measured 2026-10-22 on gorpi7v5, quantum 512 forced, ALSA period 256 x 8):
#  * /proc status sampled 400x: playback ring holds delay min 0 / median 219 / max 558
#    frames of a 2048-frame ring. With api.alsa.headroom=64 the DMA is kept almost
#    empty by design, so a graph cycle that is late by a couple of ms underruns it.
#  * Every ALSA output xrun makes PipeWire stop/prepare/restart the I2S stream.
#    Restarts were followed by `dma dma2chan5: BUG: IRQ with no descriptors` (4 times
#    in 70 min) and then 18-57 s of silent DAC output with the PCM RUNNING and
#    hw_ptr advancing, until a second restart. NAM start / csound deadline misses
#    cause the first xrun; the kernel/DMA restart race turns it into an outage.
#  So: make the first xrun rarer by keeping more audio queued in the ring.
#
# headroom is extra frames kept queued beyond the quantum. Cost is added output
# latency = headroom / 48000 s (256 -> +5.3 ms vs 64 -> +1.3 ms: net about +4 ms).
# Untested on the rig: treat 256 as the first step; 512 if outages persist.
monitor.alsa.rules = [
    {
        matches = [
            { node.name = "~alsa_output\\.platform-soc_.*_sound\\.pro-output-0" }
        ]
        actions = {
            update-props = {
                api.alsa.headroom = 256
                session.suspend-timeout-seconds = 0
                node.pause-on-idle = false
            }
        }
    }
    {
        matches = [
            { node.name = "~alsa_input\\.platform-soc_.*_sound\\.pro-input-0" }
        ]
        actions = {
            update-props = {
                session.suspend-timeout-seconds = 0
                node.pause-on-idle = false
            }
        }
    }
]
