# neptr-bridge: read the Teensy by its stable by-id name, not /dev/ttyACM0.
# The launcher bounces USB on every engine start; the Teensy re-enumerates and
# ttyACM numbers shuffle (2026-10-24: Teensy came back as ACM1, PMOR as ACM2,
# ACM0 gone), so the bridge sat on a dead path and the body went silent.
# serial_bridge.py reconnects to its path forever, so a stable path = self-heal.
[Unit]
# the old unit refused to start unless /dev/ttyACM0 existed; the bridge waits for its own path
ConditionPathExists=

[Service]
ExecStart=
ExecStart=/usr/bin/python3 /home/gorpi7v5/NEPTR_phase4/csound/serial_bridge.py /dev/serial/by-id/usb-Teensyduino_Teensy_MIDI_19910760-if00
Restart=always
