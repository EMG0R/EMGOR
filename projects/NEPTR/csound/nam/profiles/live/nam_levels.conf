# NAM gain staging — re-read every time a profile is toggled on (no restart).
# input_pad_db: level into the amp model. More negative = cleaner amp.
# target_loudness_db: common output loudness all profiles are matched to.
input_pad_db       = 0
target_loudness_db = -14
# loudness_norm: on = match all profiles to target_loudness_db, off = raw capture levels
loudness_norm      = on
