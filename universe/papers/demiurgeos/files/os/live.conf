# ~/demiurge/live.conf — THE user-facing DEMIURGE config. ONE file, one key
# decides whether audio runs through the sync layer:
#
#   sync_layer = on   -> full DEMIURGE sync layer (PipeWire/JACK chain through
#                        demiurge-sink): stack stages, the aggregate auto-bridges
#                        USB, the MIDI pool, etc.
#   sync_layer = off  -> sync layer BYPASSED; the chain's program grabs the audio
#                        interface directly (raw ALSA) for the lowest possible
#                        latency. One program owns the device.
#
# It takes effect when the service (re)starts — i.e. on the next reboot, or a
# `systemctl restart demiurge`. The chain below applies in either mode; the
# program can be any supported type (it's resolved from the file).

# ---------- globals ----------
link    = off
bpm     = 124
rate    = 48000
quantum = 128          # buffer size; THE single knob (both modes read it). Lockstep with ksmps in NEPTR globals.orc — gotchas Q7f.

# Power level (low/medium/high) is controlled live from the `demiurge` companion,
# not this file — see demiurge/docs/companion.md.

# ---------- sync layer ----------
sync_layer = on        # on = chain runs as PipeWire nodes (REQUIRED for the arcade console: game audio rides the sync layer + csound freezes cleanly). off = direct-on-interface bypass, lowest latency.

# ---------- audio interface ----------
# Optional per-set explicit interface, by PRODUCT NAME (as shown by
# `demiurge-interface`), e.g.:
#
#   interface = Volt 2
#
# Resolution order when the engine (re)starts, in BOTH modes:
#   1. `interface =` here, if that device is attached
#   2. the global remembered pick (~/demiurge/interface.conf — written by
#      `demiurge-interface <name>` / any UI's interface page)
#   3. legacy `audio_interface` CARD= id below, if attached
#   4. best attached real interface (never HDMI, never the loopback)
# Leave `interface` unset to follow the global pick / best attached.
#interface =

# Legacy raw ALSA device for sync_layer = off. Only honoured if its CARD= id
# is actually attached; superseded by the name-based `interface` above.
audio_interface = hw:CARD=USB,DEV=0

# ---------- rnbo ----------
# Gates the always-on RNBO runner (rnbo-runner.service — the on-device patch
# compiler/host, rnbooscquery). OFF by default so it never burns CPU/power when
# RNBO is not in use. The runner comes up only when EITHER condition holds:
#   * a *.rnbo token appears in the `chain =` below (a patch is in use), OR
#   * rnbo = on here (explicit opt-in: lets Max push/compile patches with
#                     nothing in the chain yet).
# Enforced by rnbo-runner.service's ExecCondition (demiurge-rnbo-gate.sh).
# FAIL-CLOSED: no config => runner stays down. Re-read on reboot or:
#   sudo systemctl restart rnbo-runner
#
#   rnbo = off   runner down unless a *.rnbo is in the chain (default)
#   rnbo = on    runner always up (Max can push patches any time)
rnbo = off

# ---------- ui ----------
# Central control for the on-device UI (the NEPTR face display) AND any number
# of extra programs that should run alongside it. Read at launch by the UI
# service (neptr-ui.service -> /usr/local/bin/demiurge-ui-launch.sh). The unit
# is PartOf=demiurge.service, so `systemctl restart demiurge` RELAUNCHES the UI
# (and every aux command) together with the audio stack.
#
#   ui      = on | off   master toggle for the UI + aux commands (default on)
#   ui_cmd  = <command>  FULL command for the main UI (interpreter + path/args)
#   ui_also = <list>     optional extra full commands, one per indented line,
#                        launched alongside the UI; comment a line out with #
#
# Independent of `audio` above: the UI runs whenever ui=on even if audio=off.
# Re-read on reboot or:  sudo systemctl restart neptr-ui   (or restart demiurge)
ui      = on
ui_cmd  = /home/gorpi7/kivy-venv/bin/python /home/gorpi7/NEPTR_phase4/neptrPhase4_UI.py
ui_also =
  # /home/gorpi7/kivy-venv/bin/python /home/gorpi7/NEPTR_phase4/scripts/neptr_visualizer.py
  # extra full commands here, one per line — all bounce on `restart demiurge`

# ---------- chain ----------
# sync_layer = off : the first program in the chain runs directly on the
#                    interface  (input -> program -> output).
# sync_layer = on  : the chain's programs become PipeWire stages wired in order
#                    into demiurge-sink.
# A *.rnbo token here auto-starts the RNBO runner (see the rnbo gate above).
chain =
  ~/NEPTR_phase4/csound/neptrPhase4.csd
