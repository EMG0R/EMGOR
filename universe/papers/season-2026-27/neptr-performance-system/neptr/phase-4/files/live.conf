# DEMIURGE-DEVICES-BEGIN
# devices detected by DEMIURGE (read-only, auto-refreshed when idle)
# audio:
#   - Scarlett Solo (3rd Gen.) Headphones / Line 1-2  (out only)
#   - Scarlett Solo (3rd Gen.) Input 1 Mic  (in only)
#   - Scarlett Solo (3rd Gen.) Input 2 Inst/Line  (in only)
#   - Split Scarlett Solo (3rd Gen.) Input 1 Mic  (in only)
#   - Split Scarlett Solo (3rd Gen.) Input 2 Inst/Line  (in only)
# midi:
#   - Teensy MIDI
#   - Csound
#   - PipeWire-System
#   - PipeWire-RT-Event
# DEMIURGE-DEVICES-END
# NEPTR Phase 4 — DEMIURGE live config.
#
# *** STALE / NOT THE ACTIVE CONFIG (verified 2026-06-11): ***
# /boot/firmware/demiurge.conf points `launch =` at ~/demiurge/live.conf,
# NOT at this file. Edit ~/demiurge/live.conf (repo copy:
# DEMIURGE_OS/demiurge/live.conf) to change what actually runs.
#
# Original (outdated) description: demiurge.service hot-loads this file
# on every boot. The Rust launcher
# (`/opt/demiurge/bin/demiurge-launcher`) handles every part of the
# audio stack here:
#
#   - Pins clock.force-rate / clock.force-quantum at 48000 / 128.
#   - Spawns each stage via /opt/demiurge/bin/demiurge-run-<lang>
#     wrappers so csound/chuck always start with -r/--srate matched
#     to the graph (no silent-resample bitcrush).
#   - Aggregates USB sinks/sources into the demiurge-sink/source hub
#     and re-runs aggregate on every pw-mon hot-plug event, so
#     unplug + replug of the Scarlett re-converges with no audio
#     interruption to the chain.
#   - Subscribes csound to ALSA seq Midi Through (-M 14:0), so the
#     Teensy, demiurge-clock CC119 broadcast, and claude_midi.sh
#     injections all reach csound on the same bus.
#
# Edit this file, save, the launcher hot-reloads. No reboot.


# ---------- globals ----------

link = off
bpm  = 124       # matches synthi.ck and demiurge-clock defaults
rate    = 48000
quantum = 64    # = csound -b in bypass (csd CsOptions are ignored). Lockstep
                 # with ksmps in csound/globals.orc — see demiurge gotchas Q7f.

# ---------- audio interface (raw ALSA name) ----------
#
# Used by bypass mode (below). NOT by the regular PipeWire/JACK chain
# — in normal mode the audio interface is selected by PipeWire/WirePlumber
# based on monitor.alsa.rules. This field gives bypass a stable
# device handle by NAME, so a card-number shuffle across reboots can't
# break it.
#
# Find it with:    aplay -l           (look for "card N: USB" → use CARD name)
#                  or `ls /proc/asound/cards`
#
# Default below is the Scarlett 3rd Gen USB Audio Class device.

audio_interface = hw:CARD=USB,DEV=0

# ---------- bypass — production default; collapses the sync layer -------
#
# **PRODUCTION DEFAULT: bypass = on.** NEPTR runs csound directly on raw
# ALSA against `audio_interface` (the line above) — no PipeWire, no JACK,
# no demiurge-sink/source loopback hop, no alsa_output ring. This is the
# working configuration. Do NOT flip this to `off` unless you have a
# specific reason (multi-stage chain, hot-replug, multi-language) and
# you accept the latency and xrun-sensitivity tradeoff.
#
# Empirically: at quantum=256 in normal mode, the sync layer alone adds
# enough scheduling pressure that minor undervoltage events cause
# persistent xruns. Bypass mode survives the same conditions because
# the audio thread has 4× the per-period budget.
#
# Latency:
#   bypass     (period=256):  ~12 ms RTT
#   bypass     (period=128):  ~7 ms RTT — current production (ksmps=128 lockstep)
#   normal mode (Q=256):     ~28 ms RTT (5 quantum hops + IO group delay)
#
# How bypass mode actually runs (current architecture):
#   demiurge.service ExecStart = /usr/local/bin/demiurge-mode-select.sh
#   The wrapper reads THIS file's `bypass = on/off`, stops PW+WP if on,
#   and execs csound directly with `-+rtaudio=alsa -odac:plughw:CARD=...`.
#   `sudo systemctl restart demiurge` IS the correct way to apply
#   .orc/.csd changes — there is no separate run-bypass.sh path in use.
#
# What you LOSE in bypass mode (per [[project_phase4_must_use_hub]]):
#   - replug recovery: unplugging the Scarlett mid-session drops audio
#     and csound holds onto a dead device until restarted.
#   - rate enforcement at the WirePlumber layer (rate is whatever csound
#     negotiates with the device).
#   - multi-stage chains: only ONE program owns the audio device. ChucK,
#     SuperCollider, multiple csound stages — none of those can also be
#     in the chain.
#   - the demiurge-sink/source hub: anything that writes to demiurge-sink
#     in a live.conf-style chain has no audio destination.
#   - Scarlett hardware init that PipeWire/WirePlumber rules would have
#     applied (e.g. MSD Mode off). If you switch from off to on for the
#     first time, run `amixer -c USB sset 'MSD Mode' off` once.
#
# If you edit this file with an assistant, the assistant should leave
# this `bypass = on`. Do not flip it without an explicit reason.

bypass = on

# ---------- audio chain ----------
#
# Two stages, piped left-to-right:
#   chuck synthi   — generates lockin saw voices (no input)
#   csound effects — full Phase 4 effect chain
#
# csound also gets hardware mic inputs as extra parallel edges via
# `inputs =` below — that way the synthi sound and the mic capture
# both arrive at csound's input1/input2 without forcing chuck to
# pass adc through.

chain =
  # ~/NEPTR_phase4/chuck/synthi.ck
  ~/NEPTR_phase4/csound/neptrPhase4.csd

# ---------- extra hardware-input edges ----------
#
# Wires `in1` (Scarlett Mic 1) and `in2` (Scarlett Mic 2) directly
# into the listed stage's input ports, in parallel with the chain
# upstream feed.

inputs =
  ~/NEPTR_phase4/csound/neptrPhase4.csd
