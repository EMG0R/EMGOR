<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0512">
<title>GORCAVE — lights</title>
<link rel="icon" href="gorcave-icon-192.png">
<style>
  :root{
    --bg:#0a0512; --bg-glow:#150b26;
    --surface:rgba(168,146,214,0.05); --surface-2:rgba(168,146,214,0.09);
    --line:rgba(178,158,222,0.12); --line-strong:rgba(178,158,222,0.30);
    --text:rgba(236,231,247,0.90); --text-dim:rgba(214,205,235,0.55);
    --text-faint:rgba(198,188,226,0.28); --lavender:rgba(178,163,214,0.85);
    --ok:rgba(140,214,168,0.90); --bad:rgba(224,130,140,0.90);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{height:100%;background:var(--bg)}
  body{margin:0;min-height:100%;color:var(--text);font-family:'Courier New',Courier,monospace;
    background:radial-gradient(120% 70% at 50% 0%,var(--bg-glow) 0%,var(--bg) 62%),var(--bg);
    padding:16px 14px 48px;max-width:560px;margin:0 auto;overscroll-behavior:none}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
  h1{font-size:14px;letter-spacing:.34em;margin:0;color:var(--lavender);font-weight:400}
  .live{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .now{font-size:12px;color:var(--text-dim);margin:0 0 14px;min-height:15px}
  .now b{color:var(--text)}
  .modes{display:flex;gap:6px;margin-bottom:12px}
  .modes button{flex:1;font-family:inherit;font-size:12px;letter-spacing:.12em;color:var(--text-dim);
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 0;cursor:pointer;transition:.14s}
  .modes button.on{color:#0a0512;background:linear-gradient(90deg,rgba(150,122,208,.7),rgba(178,163,214,.9));border-color:transparent;font-weight:bold}
  .pad-wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line-strong);
    touch-action:none;user-select:none;margin-bottom:6px}
  #pad{display:block;width:100%;height:230px}
  #marker{position:absolute;width:26px;height:26px;border-radius:50%;border:2px solid #fff;
    box-shadow:0 0 0 1px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.6);transform:translate(-50%,-50%);
    pointer-events:none;left:50%;top:50%;transition:opacity .2s}
  .hint{font-size:11px;color:var(--text-faint);text-align:center;margin:0 0 14px}
  .brush{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-left:6px;border:1px solid var(--line-strong)}
  section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
  .label{font-size:10px;letter-spacing:.22em;color:var(--text-faint);text-transform:uppercase;margin-bottom:10px}
  textarea{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line-strong);border-radius:10px;
    color:var(--text);font-family:inherit;font-size:14px;padding:11px;resize:vertical;min-height:48px}
  textarea:focus{outline:none;border-color:var(--lavender)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button.act{font-family:inherit;font-size:13px;color:var(--text);cursor:pointer;background:var(--surface-2);
    border:1px solid var(--line-strong);border-radius:10px;padding:10px 14px;transition:.14s;flex:0 0 auto}
  button.act:hover{background:rgba(178,163,214,.16);border-color:var(--lavender)}
  button.act:active{transform:translateY(1px)}
  button.go{background:linear-gradient(90deg,rgba(150,122,208,.65),rgba(178,163,214,.85));border-color:transparent;color:#0a0512;font-weight:bold;flex:1 1 auto}
  button.ghost{background:transparent}
  button.act:disabled{opacity:.4;cursor:default}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{font-size:12px;padding:7px 11px;border-radius:20px}
  .status{font-size:11px;color:var(--text-dim);margin-top:9px;min-height:14px}
  .status.err{color:var(--bad)} .status.ok{color:var(--ok)}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line-strong);border-top-color:var(--lavender);
    border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .pole{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .pole span{font-size:12px;color:var(--text-dim);min-width:52px}
  input[type=color]{width:44px;height:36px;padding:0;border:1px solid var(--line-strong);border-radius:9px;background:none;cursor:pointer}
  .muted{opacity:.45;pointer-events:none}
  a.back{color:var(--text-faint);font-size:11px;text-decoration:none;letter-spacing:.1em}
</style>
</head>
<body>
<header>
  <h1>G O R C A V E · L I G H T S</h1>
  <div class="live"><span class="dot" id="livedot"></span><span id="fps">—</span></div>
</header>
<p class="now">now · <b id="scenename">…</b></p>

<div class="modes">
  <button data-m="fill" class="on">FILL</button>
  <button data-m="paint">PAINT</button>
  <button data-m="vibe">VIBE</button>
  <button data-m="scenes">LOOKS</button>
</div>

<div class="pad-wrap" id="padwrap">
  <canvas id="pad"></canvas>
  <div id="marker"></div>
</div>
<p class="hint" id="hint">drag anywhere — the whole ring follows your finger, and stays.</p>

<section id="vibesec" style="display:none">
  <div class="label">say a vibe · neptr dreams it up</div>
  <textarea id="vibe" placeholder="cosmic underwater nebula…"></textarea>
  <div class="row" style="margin-top:10px">
    <button class="go" id="gen">generate</button>
    <button class="act ghost" id="like">♥ <span id="tastect">0</span></button>
  </div>
  <div class="status" id="genstatus"></div>
</section>

<section id="scenesec" style="display:none">
  <div class="label">saved looks · one tap</div>
  <div class="chips" id="scenes"><span class="status">loading…</span></div>
</section>

<section id="polesec" class="muted">
  <div class="label">the 2 poles <span id="polestat" style="color:var(--text-faint)">· connecting…</span></div>
  <div class="pole"><span>pole 1</span><input type="color" class="polecol" data-id="1" value="#5d2fc9"><button class="act poleoff" data-id="1">off</button></div>
  <div class="pole"><span>pole 2</span><input type="color" class="polecol" data-id="2" value="#8b2fc9"><button class="act poleoff" data-id="2">off</button></div>
</section>

<section>
  <div class="label">power</div>
  <div class="row">
    <button class="act" id="resume">▶ resume</button>
    <button class="act" id="stop">⏸ stop</button>
    <button class="act ghost" id="black">⏻ blackout</button>
    <span style="flex:1"></span>
    <a class="back" href="gorcave-dash.html">← dash</a>
  </div>
  <div class="status" id="pwrstatus"></div>
</section>

<script>
const API="https://gorcave.taila85593.ts.net/api/dash/lights";
const $=s=>document.querySelector(s);
function authHdr(){let t=null;try{t=localStorage.getItem("gorcave_token");}catch(e){}return t?{"Authorization":"Bearer "+t}:{};}
async function post(path,body){const r=await fetch(API+path,{method:"POST",
  headers:Object.assign({"Content-Type":"application/json"},authHdr()),body:body?JSON.stringify(body):null});
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||r.status);return r.json();}
async function get(path){const r=await fetch(API+path,{headers:authHdr()});return r.json();}
function flash(el,msg,cls){el.className="status "+(cls||"");el.textContent=msg;
  setTimeout(()=>{if(el.textContent===msg)el.textContent="";},4000);}

// --- color math ---
function hsv2hex(h,s,v){h/=360;let r,g,b,i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
  switch(i%6){case 0:r=v,g=t,b=p;break;case 1:r=q,g=v,b=p;break;case 2:r=p,g=v,b=t;break;
  case 3:r=p,g=q,b=v;break;case 4:r=t,g=p,b=v;break;case 5:r=v,g=p,b=q;break;}
  const H=x=>("0"+Math.round(x*255).toString(16)).slice(-2);return "#"+H(r)+H(g)+H(b);}

// --- pad canvas: x=hue, y=brightness (top bright -> bottom dark) ---
const pad=$("#pad"),ctx=pad.getContext("2d"),marker=$("#marker");
let mode="fill", curColor="#8b2fc9", curBright=0.85;
function drawFill(){const w=pad.width,h=pad.height;
  const g=ctx.createLinearGradient(0,0,w,0);
  for(let i=0;i<=12;i++)g.addColorStop(i/12,`hsl(${i/12*360},85%,55%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  const v=ctx.createLinearGradient(0,0,0,h);
  v.addColorStop(0,"rgba(255,255,255,0.0)");v.addColorStop(0.55,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,1)");
  ctx.fillStyle=v;ctx.fillRect(0,0,w,h);}
function drawPaint(){const w=pad.width,h=pad.height;
  const g=ctx.createLinearGradient(0,0,w,0); // ring positions as faint rainbow guide
  for(let i=0;i<=12;i++)g.addColorStop(i/12,`hsl(${i/12*360},40%,26%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.fillStyle="rgba(10,5,18,0.55)";ctx.fillRect(0,0,w,h);
  ctx.fillStyle=curColor;ctx.fillRect(0,h-8,w,8);}
function sizePad(){pad.width=pad.clientWidth*devicePixelRatio;pad.height=230*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);pad.width/=devicePixelRatio;pad.height/=devicePixelRatio;
  pad.width=pad.clientWidth;pad.height=230; mode==="paint"?drawPaint():drawFill();}
window.addEventListener("resize",sizePad);

// --- throttled sender (coalesce; one in flight) ---
let inflight=false,pending=null;
async function send(fn){pending=fn;if(inflight)return;inflight=true;
  while(pending){const f=pending;pending=null;try{await f();}catch(e){}}inflight=false;}

function ringFill(hex,bright){return send(()=>post("/scene",
  {name:"fill "+hex,master:{brightness:bright*1.5},layers:[{type:"solid",color:hex}]}));}
function ringPaint(idx,hex){const px={};for(let d=-6;d<=6;d++){const i=((idx+d)%1920+1920)%1920;px[i]=hex;}
  return send(()=>post("/pixels",{pixels:px,base:"current"}));}

// --- pointer drag on pad ---
let down=false;
function padXY(e){const r=pad.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:Math.max(0,Math.min(r.width,cx)),y:Math.max(0,Math.min(r.height,cy)),w:r.width,h:r.height};}
function onMove(e){if(!down)return;e.preventDefault();const {x,y,w,h}=padXY(e);
  marker.style.left=x+"px";marker.style.top=y+"px";
  if(mode==="fill"){const hue=x/w*360,val=1-(y/h)*0.92;curColor=hsv2hex(hue,0.85,Math.max(0.12,val));curBright=Math.max(0.12,val);
    marker.style.background=curColor;ringFill(curColor,curBright);}
  else if(mode==="paint"){const idx=Math.round(x/w*1919);marker.style.background=curColor;ringPaint(idx,curColor);}}
function onDown(e){if(mode==="vibe"||mode==="scenes")return;down=true;marker.style.opacity=1;onMove(e);}
function onUp(){down=false;} // "stays down": last color remains applied
const pw=$("#padwrap");
pw.addEventListener("mousedown",onDown);window.addEventListener("mousemove",onMove);window.addEventListener("mouseup",onUp);
pw.addEventListener("touchstart",onDown,{passive:false});pw.addEventListener("touchmove",onMove,{passive:false});window.addEventListener("touchend",onUp);

// --- modes ---
document.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;document.querySelectorAll(".modes button").forEach(x=>x.classList.toggle("on",x===b));
  const painty=(mode==="fill"||mode==="paint");
  $("#padwrap").style.display=painty?"block":"none";$("#hint").style.display=painty?"block":"none";
  $("#vibesec").style.display=mode==="vibe"?"block":"none";
  $("#scenesec").style.display=mode==="scenes"?"block":"none";
  if(painty){sizePad();
    $("#hint").innerHTML=mode==="paint"
      ?'drag to paint the ring — smear color anywhere, it stays.<span class="brush" style="background:'+curColor+'"></span>'
      :"drag anywhere — the whole ring follows your finger, and stays.";}
  if(mode==="scenes")loadScenes();
});

// --- vibe / like ---
$("#gen").onclick=async()=>{const t=$("#vibe").value.trim();if(!t)return;const s=$("#genstatus");
  s.className="status";s.innerHTML='<span class="spin"></span>neptr is dreaming… (10–30s)';$("#gen").disabled=true;
  try{const r=await post("/prompt",{text:t});s.className="status ok";s.textContent="✓ "+(r.scene?.name||"done")+" ("+r.source+")";refresh();}
  catch(e){s.className="status err";s.textContent="✗ "+e.message;}finally{$("#gen").disabled=false;}};
$("#like").onclick=async()=>{try{const r=await post("/like");$("#tastect").textContent=r.taste_count;
  flash($("#genstatus"),"♥ saved to your taste ("+r.taste_count+")","ok");}catch(e){flash($("#genstatus"),e.message,"err");}};

// --- scenes ---
async function loadScenes(){try{const s=await get("/scenes");
  $("#scenes").innerHTML=Object.entries(s).map(([k,v])=>`<button class="act chip" data-s="${k}">${v||k}</button>`).join("")||'<span class="status">none</span>';}
  catch(e){$("#scenes").innerHTML='<span class="status err">'+e.message+'</span>';}}
$("#scenes").addEventListener("click",e=>{const n=e.target.dataset.s;if(n)post("/scene/"+encodeURIComponent(n)).then(refresh).catch(()=>{});});

// --- poles ---
document.querySelectorAll(".polecol").forEach(inp=>inp.addEventListener("input",()=>
  post("/lamp/"+inp.dataset.id,{on:true,color:inp.value,brightness:80}).catch(()=>{})));
document.querySelectorAll(".poleoff").forEach(b=>b.addEventListener("click",()=>
  post("/lamp/"+b.dataset.id,{on:false}).catch(()=>{})));
async function probePoles(){try{const d=await get("/lamp/health");if(d.ok){
  $("#polesec").classList.remove("muted");$("#polestat").textContent="· live";}}catch(e){}}

// --- power ---
$("#resume").onclick=()=>post("/resume").then(()=>flash($("#pwrstatus"),"resumed","ok")).then(refresh).catch(e=>flash($("#pwrstatus"),e.message,"err"));
$("#stop").onclick=()=>post("/stop").then(()=>flash($("#pwrstatus"),"stopped","ok")).catch(e=>flash($("#pwrstatus"),e.message,"err"));
$("#black").onclick=()=>ringFill("#000000",0.0).then(()=>flash($("#pwrstatus"),"blackout","ok"));

// --- live state ---
async function refresh(){try{const st=await get("/state");$("#scenename").textContent=st.scene||"—";
  $("#fps").textContent=Math.round(st.fps_actual||0)+" fps";
  $("#livedot").style.background=st.streaming?"var(--ok)":"var(--text-faint)";}catch(e){$("#livedot").style.background="var(--bad)";}}
async function loadTaste(){try{$("#tastect").textContent=(await get("/taste")).count;}catch(e){}}

sizePad();refresh();loadTaste();probePoles();setInterval(refresh,3000);
</script>
</body>
</html>
