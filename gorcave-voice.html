<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0512">
<meta name="robots" content="noindex">
<title>gorcave</title>
<link rel="icon" href="gorcave-icon-192.png" type="image/png">
<style>
  :root{--bg:#0a0512;--glow:#150b26;--line:rgba(178,158,222,.3);--text:rgba(236,231,247,.9);--dim:rgba(214,205,235,.55);--lav:rgba(178,163,214,.85);--bad:rgba(224,130,140,.9)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Courier New',Courier,monospace}
  body{background:radial-gradient(120% 60% at 50% 0%,var(--glow),var(--bg) 60%);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  main{text-align:center;max-width:340px;width:100%}
  h1{font-size:16px;letter-spacing:.38em;font-weight:400;color:var(--lav);margin:0 0 22px}
  #sCode{font-size:54px;letter-spacing:.2em;color:var(--lav);margin:8px 0 14px}
  .msg{font-size:13px;color:var(--dim);min-height:18px}.msg.err{color:var(--bad)}
  .hidden{display:none!important}
  button,input{font:inherit;color:var(--text)}
  button{background:none;border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;margin-top:14px}
  input{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:11px;text-align:center;margin-top:8px}
  details{margin-top:34px;font-size:11px;color:var(--dim)}summary{cursor:pointer;list-style:none;opacity:.6}
  summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<main>
  <h1>G O R C A V E</h1>
  <div id="sCodeBox" class="hidden"><div id="sCode">----</div></div>
  <div id="sMsg" class="msg">...</div>
  <button id="sRetry" class="hidden">ask again</button>
  <details><summary>lost phone</summary>
    <input id="sPass" type="password" placeholder="passphrase" autocomplete="current-password">
    <input id="sTotp" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code">
    <button id="sLostGo">enter</button>
  </details>
</main>
<script>window.GORCAVE_PAGE="voice";</script>
<script src="gorcave-shell.js?v=1"></script>
</body>
</html>
