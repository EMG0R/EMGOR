        // preference is not changed by a fallback — the next reply tries the
        // server again.
        // -----------------------------------------------------------------
        var currentObjectUrl = null;
        var ttsFallbackNoticed = false;

        function stopSpeaking() {
            // A song is speech too: pressing the mic, muting, or leaving the
            // page must silence it and cancel a render still in flight.
            stopSong();
            try { ttsEl.pause(); } catch (e) {}
            if (hasSynth) { try { window.speechSynthesis.cancel(); } catch (e) {} }
        }

        function revokeCurrent() {
            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = null;
            }
        }

        function speak(text) {
            if (!text || voiceMode === 'off') return;
            if (voiceMode === 'device') { speakDevice(text); return; }
            speakServer(text);
        }

        async function speakServer(text) {
            try {
                var res = await fetch(VOICE_SPEAK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                if (!res.ok) throw new Error('speak ' + res.status);
                var blob = await res.blob();
                if (!blob || blob.size < 64) throw new Error('empty audio');

                revokeCurrent();
                currentObjectUrl = URL.createObjectURL(blob);
                ttsEl.src = currentObjectUrl;
                ttsEl.onended = revokeCurrent;
                // Playback follows the mic press, so the autoplay gate is
                // already satisfied — but if the browser still refuses, the
                // rejected promise routes us to the device voice.
                await ttsEl.play();
            } catch (err) {
                if (!ttsFallbackNoticed && hasSynth) {
                    ttsFallbackNoticed = true;
                    addMessage("gorcave's own voice is unavailable — using this device's voice", 'system');
                }
                speakDevice(text);
            }
        }

        function speakDevice(text) {
            if (!hasSynth) return;
            try {
                window.speechSynthesis.cancel();
                var u = new SpeechSynthesisUtterance(text);
                u.rate = 1.0;
                u.pitch = 0.9;
                var voices = window.speechSynthesis.getVoices() || [];
                for (var i = 0; i < voices.length; i++) {
                    if (/^en/i.test(voices[i].lang)) { u.voice = voices[i]; break; }
                }
                window.speechSynthesis.speak(u);
            } catch (e) {}
        }

        // -----------------------------------------------------------------
        // Singing.
        //
        //   POST /api/voice/sing  { song } -> wav bytes of the agent actually
        //   singing (MIDI melody + vocoder + Speak-and-Spell texture).
        //
        // TRIGGER — the USER's own words, not the reply. The persona is told
        // explicitly never to announce that it is about to sing, so the reply
        // text carries no reliable signal; the request that provoked it does.
        // /\bsing\b/ on the outgoing message is self-contained, testable
        // today and needs no backend contract at all. A structured hint from
        // the backend (data.sing / data.song) is honoured if one ever turns
        // up, but nothing here depends on it existing.
        //
        // The song IS the reply for that turn, so the normal TTS path is
        // suppressed for it — we never speak the text and sing over it.
        //
        // Rendering happens on a Pi and can take many seconds on a cold
        // cache, so this is a patient, cancellable state rather than a
        // spinner that lies: the notice is a button the whole time, and it
        // aborts the fetch just as readily as it stops playback.
        // -----------------------------------------------------------------
        var SING_RE = /\b(?:sing|serenade)\b/i;

        // Everything between "sing" and the end of the clause, minus the
        // filler that wraps a request. "sing me daisy" -> 'daisy';
        // "can you sing?" / "sing me a song" -> '' -> the default, daisy.
        // A wrong guess is harmless: the backend falls back to daisy too.
        var SING_FILLER = {
            me:1, us:1, a:1, an:1, the:1, some:1, one:1, another:1, your:1,
            please:1, song:1, songs:1, tune:1, something:1, anything:1,
            now:1, again:1, first:1, favourite:1, favorite:1, little:1,
            old:1, called:1, named:1, titled:1
        };
        // If the first real word is one of these, the user described a song
        // rather than named one ("sing about the rain") — take the default.
        var SING_STOP = {
            about:1, for:1, to:1, with:1, in:1, on:1, at:1, like:1, if:1,
            when:1, while:1, and:1, but:1, or:1, that:1, this:1, it:1,
            you:1, we:1, i:1, my:1, is:1, are:1, was:1, do:1, can:1,
            will:1, would:1, could:1, something:1
        };

        function songFrom(text) {
            var m = SING_RE.exec(String(text || ''));
            if (!m) return '';
            var rest = String(text).slice(m.index + m[0].length).split(/[.!?\n]/)[0];
            rest = rest.toLowerCase().replace(/[^a-z0-9' -]+/g, ' ');
            var words = rest.split(/\s+/).filter(Boolean);
            while (words.length && SING_FILLER[words[0]]) words.shift();
            while (words.length && SING_FILLER[words[words.length - 1]]) words.pop();
            if (!words.length || SING_STOP[words[0]]) return '';
            return words.slice(0, 4).join(' ');
        }

        // Optional and additive. If a future backend labels a turn as sung we
        // take it; a missing field is the normal case, not an error.
        function singHint(data) {
            if (!data) return null;
            if (typeof data.sing === 'string' && data.sing) return data.sing;
            if (data.sing === true) return '';
            if (typeof data.song === 'string' && data.song) return data.song;
            return null;
        }

        /** -> song name to request, or null if this turn isn't a sung one. */
        function singRequestFor(userText, data) {
            var hint = singHint(data);
            if (hint === null && !SING_RE.test(String(userText || ''))) return null;
            return hint || songFrom(userText) || 'daisy';
        }

        var singEl = null;        // the notice/control, if one is on screen
        var singPending = false;  // a render is in flight
        var singPlaying = false;  // audio is actually running
        var singAbort = null;
        var singFellBack = false; // one "can't sing yet" notice per session

        function singNotice(label, loading, onTap) {
            clearSingNotice();
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'msg singing' + (loading ? ' loading' : '');
            b.textContent = label;
            b.addEventListener('click', onTap);
            historyEl.appendChild(b);
            scrollToLatest();
            singEl = b;
            return b;
        }

        function clearSingNotice() {
            if (singEl && singEl.parentNode) singEl.parentNode.removeChild(singEl);
            singEl = null;
        }

        function onSingPause() { stopSong(); }

        function stopSong() {
            if (singAbort) {
                try { singAbort.abort(); } catch (e) {}
                singAbort = null;
            }
            singPending = false;
            if (singPlaying) {
                singPlaying = false;
                try { ttsEl.pause(); } catch (e) {}
            }
            try { ttsEl.removeEventListener('pause', onSingPause); } catch (e) {}
            revokeCurrent();
            clearSingNotice();
        }

        // Subtle, and only once the song is really playing: the stored turn
        // keeps the machine's real reply text with a single note appended.
        // No invented lyrics ever go into the log.
        function markSung(el, replyText) {
            if (!replyText) return;
            var marked = replyText + ' ♪';
            for (var i = convo.length - 1; i >= 0; i--) {
                if (convo[i].role === 'them' && convo[i].text === replyText) {
                    convo[i].text = marked;
                    convoSave();
                    break;
                }
            }
            if (el) el.textContent = marked;
        }

        /**
         * Entry point. `song` comes from singRequestFor(); `reply`/`replyEl`
         * are the already-rendered reply turn, used only for the sung marker
         * and for the speak() fallback if the endpoint can't sing yet.
         */
        function singSong(song, reply, replyEl) {
            // An explicit mute is an explicit mute — never auto-play over it.
            // The song still exists, it just waits behind one deliberate tap.
            if (voiceMode === 'off') {
                singNotice('a song is waiting · tap to play', false, function () {
                    unlockAudio();
                    startSong(song, reply, replyEl);
                });
                return;
            }
            startSong(song, reply, replyEl);
        }

        async function startSong(song, reply, replyEl) {
            stopSpeaking();   // nothing talks over the song, including itself
            singPending = true;
            singNotice('singing… · tap to stop', true, stopSong);

            try {
                singAbort = (typeof AbortController === 'function')
                    ? new AbortController() : null;
                var opts = {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ song: song || 'daisy' })
                };
                if (singAbort) opts.signal = singAbort.signal;

                var res = await fetch(VOICE_SING, opts);
                if (!singPending) return;            // cancelled while waiting
                if (!res.ok) { singFailed(res.status, reply); return; }

                var blob = await res.blob();
                if (!singPending) return;
                if (!blob || blob.size < 64) { singFailed(null, reply); return; }

                // Same object-URL handling as the speak path, same element:
                // one player, so a song and a spoken reply can never overlap.
                revokeCurrent();
                currentObjectUrl = URL.createObjectURL(blob);
                ttsEl.src = currentObjectUrl;
                ttsEl.onended = function () { stopSong(); };
                await ttsEl.play();
                if (!singPending) { try { ttsEl.pause(); } catch (e) {} return; }

                singPlaying = true;
                singPending = false;
                ttsEl.addEventListener('pause', onSingPause);
                if (singEl) {
                    singEl.classList.remove('loading');
                    singEl.textContent = 'singing · tap to stop';
                }
                markSung(replyEl, reply);
            } catch (err) {
                if (err && err.name === 'AbortError') return;   // we cancelled
                singFailed(err && err.status ? err.status : null, reply);
            }
        }

        // Calm lavender, never red, never a stack trace — and the reply is
        // never simply lost: whatever went wrong, it gets spoken normally.
        function singFailed(status, reply) {
            stopSong();
            if (!singFellBack) {
                singFellBack = true;
                if (status === 404 || status === 501) {
                    addMessage("gorcave can't sing yet — that part isn't up on the Pi", 'system');
                } else if (status) {
                    addMessage('the song came back wrong (' + status + ')', 'system');
                } else {
                    addMessage(unreachableText(null), 'system');
                }
            }
            if (reply) speak(reply);
        }

        // ---------- text fallback ----------
        function openComposer() {
            composer.classList.add('open');
            typeToggle.textContent = 'hide keyboard';
        }
        function closeComposer() {
            composer.classList.remove('open');
            typeToggle.textContent = 'type instead';
        }
        typeToggle.addEventListener('click', function () {
            if (composer.classList.contains('open')) { msgInput.blur(); closeComposer(); }
            else { openComposer(); msgInput.focus(); }
        });

        // Tapping Send must not blur the input (that would bounce the keyboard).
        ['mousedown', 'touchstart', 'pointerdown'].forEach(function (evt) {
            sendBtn.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
        });
        sendBtn.addEventListener('click', function () {
            if (document.activeElement !== msgInput) msgInput.focus();
        });

        composer.addEventListener('submit', function (e) {
            e.preventDefault();
            var text = msgInput.value.trim();
            if (!text || busy) return;
            msgInput.value = '';
            msgInput.focus();
            unlockAudio();
            sendText(text);
        });

        // -----------------------------------------------------------------
        // Keyboard handling — same visualViewport approach as the text chat.
        // The layout viewport doesn't shrink when the software keyboard opens,
        // so a pinned shell would sit underneath it; resize the shell to the
        // visual viewport instead and translate by its offsetTop.
        // -----------------------------------------------------------------
        var vv = window.visualViewport;

        function applyViewport() {
            if (!vv) return;
            document.body.style.height = Math.round(vv.height) + 'px';
            var top = Math.round(vv.offsetTop);
            document.body.style.transform = top ? 'translateY(' + top + 'px)' : 'none';
            var kbUp = (window.innerHeight - vv.height) > 120;
            document.documentElement.style.setProperty(
                '--kb-pad', kbUp ? '0px' : 'env(safe-area-inset-bottom)'
            );
        }

        var vvFrame = null;
        function scheduleViewport(keepAtBottom) {
            if (vvFrame) cancelAnimationFrame(vvFrame);
            vvFrame = requestAnimationFrame(function () {
                vvFrame = null;
                applyViewport();
                if (keepAtBottom) scrollToLatest();
            });
        }

        if (vv) {
            vv.addEventListener('resize', function () { scheduleViewport(true); });
            vv.addEventListener('scroll', function () { scheduleViewport(false); });
            applyViewport();
        }

        window.addEventListener('scroll', function () {
            if (window.scrollY !== 0) window.scrollTo(0, 0);
        }, { passive: true });

        msgInput.addEventListener('focus', function () {
            setTimeout(function () { scheduleViewport(true); }, 60);
            setTimeout(function () { scheduleViewport(true); }, 320);
        });

        // Leaving the page shouldn't leave the mic open or a voice talking.
        window.addEventListener('pagehide', function () {
            stopSpeaking();
            if (recording) stopRecording(false);
            releaseStream();
            stopWordParticles();
        });
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) return;
            if (recording) stopRecording(false);
            // Backgrounded: drop the words rather than let a throttled rAF
            // hold a canvas and a loop open behind a locked screen.
            stopWordParticles();
            // Backgrounded with a countdown on screen: drop the VAD state so
            // coming back never resumes a half-elapsed silence window.
            resetVad();
        });

        // ---------- boot ----------
        (function init() {
            // Canvas is drawn at 2x the CSS box for crispness on phones.
            var rect = meterEl.getBoundingClientRect();
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            if (rect.width) {
                meterEl.width = Math.round(rect.width * dpr);
                meterEl.height = Math.round(rect.height * dpr);
            }

            // Shared history renders BEFORE any session notice and before
            // the first scroll-to-bottom, so switching modes mid-conversation
            // drops you exactly where you left off. This only writes into
            // #history's own scroller — it never touches the body shell the
            // visualViewport logic owns.
            convo = convoLoad();
            renderConvo();

            if (!voiceAvailable) {
                var why = (window.isSecureContext === false)
                    ? 'Voice needs a secure (https) connection. Typing still works.'
                    : 'This browser has no microphone recording support. Typing still works.';
                addMessage(why, 'system');
                micBtn.disabled = true;
                micBtn.style.opacity = '0.35';
                setHint('voice unavailable');
                openComposer();
            } else if (!convo.length) {
                addMessage(
                    autoSend
                        ? 'Hold the circle and talk, release to send — or tap it once for ' +
                          'hands-free: it sends on its own after ' +
                          Math.round(SILENCE_MS / 1000) + ' seconds of quiet.'
                        : 'Hold the circle and talk. Release to send.',
                    'system'
                );
            }

            scrollToLatest();
            requestAnimationFrame(scrollToLatest);
            window.addEventListener('load', scrollToLatest, { once: true });

            // Populate the synthesis voice list early (Chrome loads it async).
            if (hasSynth) {
                try { window.speechSynthesis.getVoices(); } catch (e) {}
            }
        })();

        // =================================================================
        // Build stamp, stale-build detection, and the install offer.
        //
        // There is no APK: the installed home-screen app IS this page, so
        // the only way it can go stale is a cached copy. gorcave-version.json
        // is the single source of truth for "what is deployed right now";
        // APP_VERSION below is what THIS file shipped as. When they disagree,
        // the copy running in this browser is old.
        //
        //   >>> BUMP ALL THREE TOGETHER ON EACH MEANINGFUL DEPLOY <<<
        //         gorcave-version.json  ("version")
        //         gorcave-voice.html    (APP_VERSION)
        //         gorcave-chat.html     (APP_VERSION)
        //       Format: YYYY-MM-DD.N   (N restarts at 1 each day)
        //
        // No service worker is registered here and none should be: sw.js in
        // this repo is deliberately scoped to ciesen.html only. The cache
        // purge below deletes ONLY gorcave-* caches, so ciesen's webchugl-*
        // cache is never touched.
        //
        // Every failure path (404, malformed JSON, offline, blocked fetch)
        // degrades to silence — a broken version check must never nag or
        // throw.
        // =================================================================
        var APP_VERSION = '2026-08-05.1';

        (function buildAndInstall() {
            var VERSION_URL = 'gorcave-version.json';
            var POLL_MS     = 15 * 60 * 1000;  // background re-check cadence
            var MIN_GAP_MS  = 60 * 1000;       // floor between any two checks
            var INSTALL_KEY = 'gorcave_install_dismissed';
            var AUTO_KEY    = 'gorcave_auto_updated';

            var stamp = document.getElementById('build-stamp');
            if (stamp) stamp.textContent = 'build ' + APP_VERSION;

            // ---- staleness ------------------------------------------------
            var upBanner  = document.getElementById('update-banner');
            var upText    = document.getElementById('update-text');
            var upApply   = document.getElementById('update-apply');
            var upDismiss = document.getElementById('update-dismiss');

            var latest     = null;   // newest version the server admits to
            var lastCheck  = 0;
            var dismissed  = false;  // user said "not now" this session
            var firstCheck = true;

            // "Would reloading destroy something?" — anything in the shared
            // transcript, or half-typed text, counts.
            function conversationInProgress() {
                try {
                    if (typeof convo !== 'undefined' && convo && convo.length) return true;
                } catch (e) {}
                var input = document.getElementById('msg-input');
                if (input && input.value && input.value.trim()) return true;
                return false;
            }

            // Only ever delete caches we could plausibly own. ciesen.html's
            // service worker owns webchugl-* — leave that, and anything else
            // unrecognised, strictly alone.
            function purgeOurCaches() {
                try {
                    if (!window.caches || !caches.keys) return Promise.resolve();
                    return caches.keys().then(function (keys) {
                        return Promise.all(keys.map(function (k) {
                            return /^gorcave[-_.]/i.test(k) ? caches.delete(k) : null;
                        }));
                    })['catch'](function () {});
                } catch (e) {
                    return Promise.resolve();
                }
            }

            function navigateFresh(v) {
                // A plain location.reload() can still come out of the bfcache
                // or an in-memory cache. A URL the browser has never seen
                // cannot. pathname (not href) drops any previous ?v=, so this
                // never accumulates query junk.
                location.replace(location.pathname + '?v=' + encodeURIComponent(v));
            }

            function applyUpdate() {
                var v = latest || String(Date.now());
                var go = function () { navigateFresh(v); };
                try { purgeOurCaches().then(go, go); } catch (e) { go(); }
            }

            function showUpdate(v) {
                if (!upBanner || dismissed) return;
                if (upText) upText.textContent = 'a newer version is available (' + v + ')';
                upBanner.classList.add('show');
            }

            function autoAlreadyTried(v) {
                try { return sessionStorage.getItem(AUTO_KEY) === v; } catch (e) { return false; }
            }
            function markAutoTried(v) {
                try { sessionStorage.setItem(AUTO_KEY, v); } catch (e) {}
            }

            function checkVersion() {
                var now = Date.now();
                if (now - lastCheck < MIN_GAP_MS) return;
                lastCheck = now;
                var wasFirst = firstCheck;
                firstCheck = false;

                var req;
                try {
                    if (typeof fetch !== 'function') return;
                    req = fetch(VERSION_URL + '?t=' + now, {
                        cache: 'no-store',
                        credentials: 'omit'
                    });
                } catch (e) { return; }
                if (!req || typeof req.then !== 'function') return;

                req.then(function (res) {
                    if (!res || !res.ok) return null;          // 404 / 5xx -> silence
                    return res.text();
                }).then(function (body) {
                    if (!body) return;
                    var data = null;
                    try { data = JSON.parse(body); } catch (e) { return; }  // malformed -> silence
                    if (!data || typeof data.version !== 'string' || !data.version) return;
                    if (data.version === APP_VERSION) { latest = null; return; }
                    latest = data.version;
                    // A fresh load with nothing to lose can just take the new
                    // build. Mid-conversation we always ask first — an
                    // unasked-for reload would wipe what you were doing.
                    // autoAlreadyTried guards against a reload loop if the
                    // HTML itself is somehow still being served stale.
                    if (wasFirst && !conversationInProgress() && !autoAlreadyTried(latest)) {
                        markAutoTried(latest);
                        applyUpdate();
                        return;
                    }
                    showUpdate(latest);
                })['catch'](function () { /* offline / blocked: stay quiet */ });
            }

            if (upApply) {
                upApply.addEventListener('click', applyUpdate);
            }
            if (upDismiss) {
                upDismiss.addEventListener('click', function () {
                    dismissed = true;
                    if (upBanner) upBanner.classList.remove('show');
                });
            }

            setTimeout(checkVersion, 4000);   // stay out of startup's way
            setInterval(function () {
                if (document.visibilityState === 'visible') checkVersion();
            }, POLL_MS);
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') checkVersion();
            });

            // ---- install offer ---------------------------------------------
            var inBanner  = document.getElementById('install-banner');
            var inGo      = document.getElementById('install-go');
            var inDismiss = document.getElementById('install-dismiss');
            var deferred  = null;

            function isInstalled() {
                try {
                    if (window.matchMedia &&
                        window.matchMedia('(display-mode: standalone)').matches) return true;
                } catch (e) {}
                return navigator.standalone === true;
            }
            function installDismissed() {
                try { return localStorage.getItem(INSTALL_KEY) === '1'; } catch (e) { return false; }
            }
            function hideInstall() {
                if (inBanner) inBanner.classList.remove('show');
            }
            function rememberInstallDismissed() {
                try { localStorage.setItem(INSTALL_KEY, '1'); } catch (e) {}
            }

            window.addEventListener('beforeinstallprompt', function (e) {
                // Chrome's own mini-infobar is suppressed so we can offer it
                // on our own terms, in palette, where it can't block anything.
                try { e.preventDefault(); } catch (err) {}
                deferred = e;
                if (isInstalled() || installDismissed() || !inBanner) return;
                inBanner.classList.add('show');
            });

            window.addEventListener('appinstalled', function () {
                deferred = null;
                hideInstall();
                rememberInstallDismissed();
            });

            if (inGo) {
                inGo.addEventListener('click', function () {
                    hideInstall();
                    if (!deferred) return;
                    var p = deferred;
                    deferred = null;      // a prompt event is single-use
                    try { p.prompt(); } catch (e) { return; }
                    try {
                        if (p.userChoice && p.userChoice.then) {
                            // Declining is not a dismissal: we simply say
                            // nothing more this visit and may offer again later.
                            p.userChoice['catch'](function () {});
                        }
                    } catch (e) {}
                });
            }
            if (inDismiss) {
                inDismiss.addEventListener('click', function () {
                    hideInstall();
                    rememberInstallDismissed();
                });
            }

            if (isInstalled()) hideInstall();
        })();
    </script>
</body>
</html>
